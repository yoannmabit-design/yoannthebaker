<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1f1b16;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --alerte:#8c2f22;--ok:#3d6b3d;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:18px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    background:var(--encre);color:var(--creme);padding:14px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;
  }
  header h1{font-size:19px;margin:0;font-weight:600}
  header .qui{margin-left:auto;font-size:14.5px;opacity:.72}
  header button{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:8px 13px;border-radius:var(--r);font-size:15px;cursor:pointer;
  }
  main{max-width:820px;margin:0 auto;padding:20px 16px 120px}

  .filtres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  #recherche{
    display:block;width:100%;box-sizing:border-box;padding:10px 13px;
    margin-bottom:20px;border:1px solid var(--trait);border-radius:var(--r);
    font:inherit;font-size:16px;background:#fff;color:var(--encre);
  }
  #recherche:focus{outline:2px solid var(--accent);outline-offset:1px}
  .filtres button{
    border:1px solid var(--trait);background:transparent;color:var(--encre-doux);
    padding:8px 15px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }
  .filtres button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  }
  /* Compteur des nouvelles commandes : rouge même quand le bouton n'est pas
     actif, sinon la seule information qui doit sauter aux yeux se fondrait
     dans la barre. Masqué à zéro — un compteur à 0 n'apprend rien et use
     l'attention pour rien. */
  .filtres button .compteur{
    display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;
    border-radius:99px;background:var(--alerte);color:#fff;
    font-size:13.5px;font-weight:700;line-height:1.5;
  }
  .filtres button[aria-pressed="true"] .compteur{background:#fff;color:var(--alerte)}
  /* Deuxième rang de filtres : critères plus rares que les trois vues, donc
     repliés par défaut pour ne pas alourdir l'écran de tous les jours. */
  .filtres-plus{
    display:none;gap:9px;flex-wrap:wrap;align-items:flex-end;margin:-6px 0 14px;
    padding:12px 13px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fffdf8;
  }
  .filtres-plus.ouvert{display:flex}
  .filtres-plus label{
    display:block;font-size:13.5px;color:var(--encre-doux);margin-bottom:3px;
  }
  .filtres-plus input,.filtres-plus select{
    padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);
    font:inherit;font-size:15.5px;background:#fff;color:var(--encre);
  }
  /* Critères actifs : sans rappel visible, on cherche pendant dix minutes
     pourquoi une commande n'apparaît pas alors qu'un filtre est resté posé. */
  .rappel-import{
    padding:11px 14px;margin:0 0 14px;border-radius:var(--r);
    border:1px solid var(--trait);border-left:3px solid #2f4858;
    background:#f3f6f9;font-size:15.5px;color:var(--encre);
  }
  .rappel-import[hidden]{display:none}
  .rappel-import a{color:var(--accent)}
  .criteres{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .criteres:empty{display:none}
  .criteres .crit{
    display:inline-flex;align-items:center;gap:7px;padding:5px 7px 5px 11px;
    border:1px solid var(--trait);border-radius:99px;background:#fff;
    font-size:14.5px;color:var(--encre);
  }
  .criteres .crit button{
    border:none;background:transparent;color:var(--encre-doux);
    font-size:17px;line-height:1;cursor:pointer;padding:0 3px;
  }
  .compte-res{font-size:14.5px;color:var(--encre-doux);margin:0 0 12px}

  .jour{font-size:16px;color:var(--encre-doux);margin:22px 0 9px;font-weight:600}
  .cmd{
    background:var(--papier);border:1px solid var(--trait);
    border-radius:var(--r);padding:14px;margin-bottom:10px;
  }
  .cmd.impaye{border-left:4px solid var(--alerte)}
  .cmd.reglee{border-left:4px solid var(--ok)}
  /* Repérage temporaire en arrivant depuis "Commandes à venir" sur
     l'accueil — un halo qui s'estompe, pour ne pas laisser une carte
     encadrée en permanence après le premier coup d'œil. */
  .cmd.cible{
    animation:surligne-cmd 2.6s ease-out;
  }
  @keyframes surligne-cmd{
    0%   {box-shadow:0 0 0 3px var(--accent)}
    75%  {box-shadow:0 0 0 3px var(--accent)}
    100% {box-shadow:0 0 0 0 transparent}
  }
  .tete{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
  .tete .ref{font-family:ui-monospace,monospace;font-size:14.5px;color:var(--encre-doux)}
  .tete .nom{font-weight:600;flex:1;min-width:120px}
  /* Souligné en pointillé plutôt qu'en plein : c'est un lien, mais il ne doit
     pas attirer l'œil plus que le nom lui-même. */
  .tete .nom-lien{
    color:inherit;text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:3px;text-decoration-color:var(--encre-doux);
  }
  .tete .nom-lien:hover{text-decoration-color:var(--accent);color:var(--accent)}
  .tete .montant{font-weight:600;font-variant-numeric:tabular-nums}
  .tete .quand{color:var(--encre-doux);font-size:15px}
  .tete .fleche{color:var(--encre-doux);font-size:13px}
  .resume{font-size:15px;color:var(--encre-doux);margin-top:4px}

  .detail{margin-top:13px;padding-top:13px;border-top:1px dashed var(--trait)}
  .detail[hidden]{display:none}
  .detail .l{display:flex;justify-content:space-between;gap:12px;font-size:16.5px;padding:2px 0}
  .info{font-size:16px;color:var(--encre-doux);margin:3px 0}
  .info b{color:var(--encre);font-weight:600}

  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  select{
    padding:9px 10px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font:inherit;font-size:16.5px;color:var(--encre);
  }
  .lien{
    display:inline-block;padding:9px 14px;border:1px solid var(--trait);
    border-radius:var(--r);text-decoration:none;color:var(--accent);font-size:16px;
  }
  .etiq{
    font-size:13px;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 8px;border-radius:3px;background:#efe6d8;color:var(--encre-doux);
  }
  .etiq.rouge{background:#f6e2de;color:var(--alerte)}
  /* Fiche à compléter : bleu et non rouge — ce n'est pas une alerte, c'est un
     travail à faire avant de lancer une course. */
  .etiq.neuf{background:#e0e8f0;color:#2f4858;font-weight:700}
  /* Adresse ponctuelle : même famille que les alertes, parce que c'est une
     commande où l'automatisme de livraison ne s'applique pas. */
  .etiq.ponctuelle{background:#f6e2de;color:var(--alerte);font-weight:700}
  .etiq.verte{background:#e2eede;color:var(--ok)}
  .etiq.bleue{background:#dfe8ee;color:var(--accent)}
  /* COD : ni payé ni "à encaisser en ligne" — l'argent arrive à la
     remise, pas de preuve à vérifier. Une couleur neutre à part pour ne
     pas la confondre avec l'alerte rouge d'un paiement en ligne manquant. */
  .etiq.cod{background:#eae6df;color:#6d665c}

  /* Une couleur par statut, du plus froid au plus chaud : la commande
     avance vers le pain prêt, puis s'éteint une fois remise. */
  .etiq.st-nouvelle      {background:#e6e3f0;color:#4a4270}
  .etiq.st-confirmee     {background:#dfe8ee;color:#2d5771}
  .etiq.st-production    {background:#fbead2;color:#8a5a1c}
  .etiq.st-prete         {background:#e2eede;color:#33632f}
  .etiq.st-remise        {background:#eae6df;color:#6d665c}
  .etiq.st-annulee       {background:#f6e2de;color:var(--alerte);
                          text-decoration:line-through}

  /* Le même code couleur en filet à gauche de la carte : la liste se lit
     d'un coup d'œil sans avoir à relire chaque étiquette. */
  .cmd{border-left:3px solid transparent}
  .cmd.b-nouvelle   {border-left-color:#8b83b5}
  .cmd.b-confirmee  {border-left-color:#5b8bab}
  .cmd.b-production {border-left-color:#d09a3f}
  .cmd.b-prete      {border-left-color:#5f9257}
  .cmd.b-remise     {border-left-color:#c3bcb0}
  .cmd.b-annulee    {border-left-color:#c1705f}

  /* Confirmée ET payée : rien à faire sur cette commande. Le filet vert vif
     l'emporte sur la couleur de statut — c'est la combinaison des deux qui
     compte, pas l'un ou l'autre séparément. Un balayage du regard suffit :
     ce qui est vert est réglé, tout le reste demande quelque chose. */
  .cmd.rien-a-faire{border-left-color:#00c853;border-left-width:4px}
  .cmd.compacte{padding:9px 14px;opacity:.82}
  .cmd.compacte .tete{gap:10px}

  /* ---------- Modification d'une commande ---------- */
  /* Ces deux classes n'existaient pas dans cette page : l'écran de
     modification est le premier à avoir de vrais boutons d'action. */
  .action{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;
    border-radius:var(--r);font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;
  }
  .action:disabled{opacity:.5;cursor:default}
  .mineur{
    background:none;border:1px solid var(--trait);color:var(--accent);
    padding:9px 14px;border-radius:var(--r);font:inherit;font-size:16px;cursor:pointer;
  }
  .edition{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--trait);
  }
  .edition .edit-l{
    display:flex;align-items:center;gap:9px;padding:6px 0;
    border-bottom:1px solid var(--trait);
  }
  .edition .edit-l .n{flex:1;font-size:16.5px}
  .edition .edit-l .q{
    width:62px;padding:6px 8px;border:1px solid var(--trait);
    border-radius:var(--r);font:inherit;font-size:16.5px;text-align:center;
  }
  .edition .edit-l .p{
    min-width:74px;text-align:right;font-variant-numeric:tabular-nums;font-size:16.5px;
  }
  .edition .edit-l .retirer{
    background:none;border:none;color:var(--alerte);
    font-size:17px;cursor:pointer;padding:4px 6px;
  }
  .edition .edit-vide{
    padding:10px 0;color:var(--alerte);font-size:16px;
  }
  .edition .edit-ajout{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .edition .edit-ajout select{
    flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:16.5px;
  }
  .edition .edit-ajout .edit-qte{
    width:70px;padding:8px;border:1px solid var(--trait);
    border-radius:var(--r);font:inherit;font-size:16.5px;text-align:center;
  }
  .edition .edit-date{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;
  }
  .edition .edit-date label{font-size:15px;color:var(--encre-doux)}
  .edition .edit-date input{
    padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);
    font:inherit;font-size:16.5px;
  }
  .edition .edit-avertit{font-size:14.5px;color:var(--alerte);flex:1;min-width:150px}
  .edition .edit-livraison-champ{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;
  }
  .edition .edit-livraison-champ label{font-size:15px;color:var(--encre-doux)}
  .edition .edit-livraison-champ select{
    padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);
    font:inherit;font-size:16.5px;background:#fff;min-width:220px;
  }
  .edition .edit-bilan{margin-top:14px;font-size:16.5px}
  .edition .edit-bilan .l{
    display:flex;justify-content:space-between;gap:12px;padding:3px 0;
  }
  .edition .edit-bilan .l.somme{
    border-top:1px solid var(--trait);margin-top:6px;padding-top:7px;font-weight:600;
  }
  .edition .edit-bilan .l.ecart{color:var(--alerte);font-weight:600}
  .edition .edit-alerte{
    margin-top:10px;padding:10px 12px;border-radius:var(--r);
    background:#f6e2de;color:var(--alerte);font-size:15px;line-height:1.45;
  }
  .edition .edit-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}

  .coche{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .jour{display:flex;align-items:center;gap:10px}
  .jour .tout{
    font-size:14px;color:var(--accent);background:none;border:none;
    cursor:pointer;text-decoration:underline;padding:0;font-weight:400;
  }
  .lot{
    position:fixed;left:0;right:0;bottom:0;background:var(--encre);color:var(--creme);
    padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    transform:translateY(120%);transition:transform .18s ease;z-index:6;
  }
  .lot.vu{transform:translateY(0)}
  .lot .n{font-weight:600;margin-right:auto}
  .lot select{font-size:16px;padding:8px 9px}
  .lot .appliquer{
    background:var(--creme);color:var(--encre);border:none;padding:10px 16px;
    border-radius:var(--r);font-size:16.5px;font-weight:600;cursor:pointer;
  }
  .lot .appliquer:disabled{opacity:.45;cursor:default}
  .lot .annuler{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:9px 13px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }
  .lot .danger{
    background:transparent;border:1px solid #a8503f;color:#f0a795;
    padding:9px 13px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }

  /* Couleur des menus de statut : l'état d'une commande se lit de loin,
     sans avoir à déplier la carte. */
  select[data-v]{font-weight:600}
  select[data-v="nouvelle"]     {color:#8c2f22;border-color:#d9a79c}
  select[data-v="confirmee"]    {color:#2f4858;border-color:#a9bcc7}
  select[data-v="en production"]{color:#8a5a12;border-color:#dcbe8a}
  select[data-v="prete"]        {color:#3d6b3d;border-color:#a9c7a9}
  select[data-v="remise"]       {color:#6b6157;border-color:var(--trait)}
  select[data-v="annulee"]      {color:#9a9188;border-color:var(--trait)}
  select[data-v="en attente"]   {color:#8c2f22;border-color:#d9a79c}
  select[data-v="paye"]         {color:#3d6b3d;border-color:#a9c7a9}
  select[data-v="rembourse"]    {color:#6b6157;border-color:var(--trait)}
  .vide{padding:44px;text-align:center;color:var(--encre-doux)}
  .connexion{max-width:400px;margin:14vh auto;text-align:center;padding:0 20px}
  .connexion h1{font-size:25px;margin:0 0 20px}
  .connexion button{
    background:var(--accent);color:#fff;border:none;padding:12px 22px;
    border-radius:var(--r);font-size:17px;font-weight:600;cursor:pointer;
  }
  .etat{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:var(--encre);color:var(--creme);padding:10px 18px;
    border-radius:var(--r);font-size:16px;opacity:0;transition:opacity .2s;
  }
  .etat.vu{opacity:1}
  .etat.ok{background:#33632f}
  .etat.err{background:var(--alerte)}
</style>
</head>
<body>

<div id="ecranConnexion" class="connexion">
  <h1>Commandes</h1>
  <button id="btnConnexion">Se connecter avec Google</button>
  <p id="msgConnexion" style="margin-top:18px;font-size:16px"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Commandes</h1>
    <span class="qui" id="qui"></span>
    <button id="btnRecharger">Actualiser</button>
    <button id="btnNouvelleCommande" class="action">➕ Nouvelle commande</button>
    <button id="btnDeconnexion">Quitter</button>
  </header>
  <main>
    <div class="cmd" id="panneauNouvelle" hidden style="border-left:3px solid var(--accent)">
      <h2 style="margin:0 0 4px">Nouvelle commande</h2>
      <p style="margin:0 0 10px;font-size:14.5px;color:var(--encre-doux)">
        Pour un client qui commande par téléphone ou en personne — même
        calcul de prix, mêmes options que la vitrine.
      </p>
      <div class="edition" style="border-top:none;padding-top:0;margin-top:0">

        <div class="edit-livraison-champ">
          <label>Téléphone</label>
          <input type="tel" id="nc-tel" placeholder="09xx xxx xxxx" style="flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);font:inherit;font-size:16.5px">
        </div>
        <div id="nc-compte-etat" style="margin-top:6px;font-size:14.5px;color:var(--encre-doux)"></div>

        <div class="edit-livraison-champ">
          <label>Nom</label>
          <input type="text" id="nc-nom" style="flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);font:inherit;font-size:16.5px">
        </div>

        <div class="edit-livraison-champ" id="nc-adresse-champ" hidden>
          <label>Adresse</label>
          <input type="text" id="nc-adresse" style="flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);font:inherit;font-size:16.5px">
        </div>

        <div class="edit-lignes" id="nc-lignes"></div>

        <div class="edit-ajout">
          <select id="nc-produit"></select>
          <input type="number" class="edit-qte" id="nc-qte" min="1" step="1" value="1">
          <button type="button" class="mineur" id="nc-ajouter">Ajouter</button>
        </div>

        <div class="edit-livraison-champ" id="nc-promo-champ" hidden>
          <label>Code promo</label>
          <input type="text" id="nc-promo" placeholder="CODE" style="width:140px;padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);font:inherit;font-size:16.5px;text-transform:uppercase">
          <button type="button" class="mineur" id="nc-promo-appliquer">Appliquer</button>
          <span id="nc-promo-msg" style="font-size:14.5px"></span>
        </div>

        <div class="edit-date">
          <label>Date de retrait</label>
          <input type="date" id="nc-date">
          <span class="edit-avertit" id="nc-avertit"></span>
        </div>

        <div class="edit-livraison-champ">
          <label>Mode de retrait / livraison</label>
          <select id="nc-livraison"></select>
        </div>

        <div class="edit-bilan" id="nc-bilan"></div>

        <div class="edit-actions">
          <button type="button" class="action" id="nc-creer">Créer la commande</button>
          <button type="button" class="mineur" id="nc-annuler">Annuler</button>
        </div>
      </div>
    </div>

    <div class="filtres" id="filtres">
      <button data-f="nouvelles" aria-pressed="false">Nouvelles<span class="compteur" id="cptNouvelles" hidden>0</span></button>
      <button data-f="actives" aria-pressed="true">À traiter</button>
      <button data-f="impayees" aria-pressed="false">Impayées</button>
      <button data-f="toutes" aria-pressed="false">Toutes</button>
      <button type="button" id="btnPlus" title="Filtrer par date, tag client ou code produit">＋ Filtres</button>
      <button type="button" id="btnReclasser" title="Remonter en tête ce qui attend encore une action"
              style="margin-left:auto">↕ Reclasser</button>
    </div>
    <input type="search" id="recherche"
           placeholder="Chercher un client, un article, un n° de commande ou un code produit…">

    <!-- Critères secondaires. La recherche libre ci-dessus couvre déjà le nom,
         l'article, le numéro et le code : ce panneau sert aux bornes et aux
         listes fermées, qu'on ne peut pas taper au clavier. -->
    <div class="filtres-plus" id="filtresPlus">
      <div><label for="fCode">Code produit</label>
        <input type="text" id="fCode" list="codesConnus" placeholder="PAI-BAG" size="10"></div>
      <div><label for="fTag">Tag client</label>
        <select id="fTag"><option value="">Tous</option></select></div>
      <div><label for="fDu">Commandée du</label>
        <input type="date" id="fDu"></div>
      <div><label for="fAu">au</label>
        <input type="date" id="fAu"></div>
      <button type="button" class="mineur" id="btnEffacerFiltres">Tout effacer</button>
    </div>
    <datalist id="codesConnus"></datalist>
    <!-- Rappel d'import : une commande dont le client n'a pas de fiche ne
         peut ni recevoir de tag, ni porter de point de livraison, ni afficher

const VUES = ["nouvelles", "actives", "impayees", "toutes"];

let joursFermes = [];   // 0 = lundi

let nomVersCode = {};   // rattrapage : nom du produit -> code, pour les commandes d'avant les codes
let abonnements = [];   // échéances d'abonnement à ajouter à la production

// Même normalisation que clients-admin.html : ne garder que les chiffres,
// et seulement les 10 derniers, pour ignorer les préfixes (+63, 0…).
function cleTel(t) {
  const chiffres = String(t || "").replace(/\D/g, "");
  return chiffres.length > 10 ? chiffres.slice(-10) : chiffres;
}
const selection = new Set();

/* ---------- Connexion ---------- */

/* ---------- Chargement ---------- */
async function charger() {
  try {
    // Quels produits ont un stock à décompter ?
    try {
      const p = await getDoc(doc(db, "parametres", "boutique"));
      if (p.exists()) {
        joursFermes = p.data().jours_fermes || [];
        optionsRetrait = p.data().options_retrait || [];
      }
    } catch (e) { console.error(e); }

    try {
      const cat = await getDocs(collection(db, "boutique_produits"));
      stockLimite = {}; nomVersCode = {}; catalogue = {};
      cat.forEach(d => {
        const v = d.data();
        if (v.mode_stock === "limite") stockLimite[d.id] = true;
        if (v.nom) nomVersCode[cle(v.nom)] = d.id;
        catalogue[d.id] = {
          nom: v.nom || d.id,
          prix_vente: Number(v.prix_vente) || 0,
          rayon: rayonDe(v),
          publie: v.publie !== false
        };
      });
    } catch (e) { console.error(e); }

    try {
      const sa = await getDocs(collection(db, "abonnements"));
      abonnements = [];
      sa.forEach(d => abonnements.push({ id: d.id, ...d.data() }));
    } catch (e) {
      console.warn("Abonnements non lus (règles Firestore ?) :", e.message);
      abonnements = [];
    }

    try {
      const scl = await getDocs(collection(db, "clients"));
      clients = [];
      scl.forEach(d => clients.push({ id: d.id, ...d.data() }));
    } catch (e) { console.error(e); clients = []; }

    try {
      const sco = await getDocs(collection(db, "comptes"));
      comptes = [];
      sco.forEach(d => comptes.push({ id: d.id, ...d.data() }));
    } catch (e) { console.error(e); comptes = []; }

    const s = await getDocs(collection(db, "commandes"));
    commandes = [];
    s.forEach(d => commandes.push({ id: d.id, ...d.data() }));
    trierCommandes();
    const crees = await materialiserAbonnements();
    if (crees) {
      trierCommandes();
      signaler(crees + " commande(s) d'abonnement générée(s).");
    }

    majListesFiltres();
    afficher();
    // Les destinations d'expédition conditionnent l'affichage du bouton de

    if (!configLieux) {
      lireLieuxLalamove()
        .then(cfg => { configLieux = cfg; afficher(); })
        .catch(e => console.warn("Lieux Lalamove non lus :", e.message));

    publierProduction();
