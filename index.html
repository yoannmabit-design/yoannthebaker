/* ---------- Arrivée depuis la page d'accueil ("Commandes à venir") ---------- */
// Le lien pointe vers ?commande=ID. On force la vue "Toutes" pour être
// sûr de la trouver même si son statut sort du filtre actif par défaut
// (remise, annulée...), puis on l'amène à l'écran et on la met en
// évidence un instant — sans quoi, en fin de liste, elle se noierait
// exactement comme depuis la page d'accueil, ce qui annulerait l'intérêt
// du lien.
function allerVersCommandeCiblee() {
  const id = new URLSearchParams(location.search).get("commande");
  if (!id) return;

  const cible = commandes.find(c => c.id === id);
  if (!cible) return;

  if (filtre !== "toutes") {
    filtre = "toutes";
    $("filtres").querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.f === "toutes"));
    afficher();
  }

  // Nettoie l'URL pour qu'un rechargement ou un retour en arrière ne
  // re-déclenche pas le même repérage indéfiniment.
  history.replaceState(null, "", location.pathname);

  const el = document.getElementById("cmd-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("cible");
  setTimeout(() => el.classList.remove("cible"), 2600);
}

/* ---------- Filtres ---------- */
/* Reclasser à la demande : la liste ne bouge jamais toute seule, mais on
   doit pouvoir la ranger quand on a fini de traiter une série. */
$("btnReclasser").onclick = () => { afficher(true); };

// Le bouton actif est écrit en dur dans le HTML sur « À traiter » : si l'URL
// a demandé une autre vue, il faut le remettre d'accord avec l'état réel.
$("filtres").querySelectorAll("button[data-f]").forEach(b =>
  b.setAttribute("aria-pressed", b.dataset.f === filtre ? "true" : "false"));

$("filtres").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b || !b.dataset.f) return;
  filtre = b.dataset.f;
  $("filtres").querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", x === b));
  afficher();
};

// Léger anti-rebond : évite de refiltrer toute la liste à chaque frappe
// sur un historique de commandes qui peut être long.
let attenteRecherche;
$("recherche").addEventListener("input", (e) => {
  clearTimeout(attenteRecherche);
  attenteRecherche = setTimeout(() => {
    recherche = normaliser(e.target.value.trim());
    afficher();
  }, 120);
});

function retenue(c) {
  if (filtre === "toutes") return true;
  // Statut « nouvelle » et rien d'autre : ce que personne n'a encore regardé.
  // Volontairement sans borne de date — une nouvelle commande dont la date de
  // retrait est déjà passée est justement celle qu'il ne faut pas rater.
  if (filtre === "nouvelles") return c.statut === "nouvelle";
  if (filtre === "impayees")
    return (c.paiement?.statut || "en attente") === "en attente" && c.statut !== "annulee";
  return !["remise", "annulee"].includes(c.statut);
}

// Insensible aux accents : "eclair" doit trouver "éclair", pareil pour un nom client.
function normaliser(s) {
  return String(s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

let recherche = "";
function correspond(c) {
  if (!recherche) return true;
  if (normaliser(c.client?.nom).includes(recherche)) return true;
  // Numéro de commande : on cherche aussi sur l'identifiant Firestore, seul
  // repère des commandes anciennes qui n'ont pas de numéro lisible.
  if (normaliser(c.numero || "").includes(recherche)) return true;
  if (normaliser(c.id).includes(recherche)) return true;
  return (c.panier || []).some(l =>
    normaliser(l.nom).includes(recherche) ||
    normaliser(codeLigne(l) || "").includes(recherche));
}

/* ---------- Critères secondaires ----------
   Tout se filtre en mémoire : la page charge déjà la collection entière, une
   requête Firestore par critère n'apporterait rien et imposerait des index
   composites. */
const crit = { code: "", tag: "", du: "", au: "" };

// Le tag vit sur la fiche client (champ « groupe »), pas sur la commande :
// on rapproche par téléphone, comme partout ailleurs dans cette page.
function tagDe(c) {
  const k = cleTel(c.client?.telephone);
  if (!k) return "";
  const fiche = clients.find(x => cleTel(x.telephone || x.id) === k);
  return fiche ? (fiche.groupe || "") : "";
}

function passeCriteres(c) {
  if (crit.code) {
    const cherche = crit.code.trim().toUpperCase();
    if (!(c.panier || []).some(l => String(codeLigne(l) || "").toUpperCase() === cherche))
      return false;
  }
  if (crit.tag && tagDe(c) !== crit.tag) return false;
  // Date de commande, pas date de retrait : « cree_le » est un horodatage ISO,
  // les dix premiers caractères suffisent à le comparer à une date de champ.
  const jour = (c.cree_le || "").slice(0, 10);
  if (crit.du && (!jour || jour < crit.du)) return false;
  if (crit.au && (!jour || jour > crit.au)) return false;
  return true;
}

function critereActif() {
  return !!(crit.code || crit.tag || crit.du || crit.au || recherche);
}

/* Rappel visible des critères posés, chacun retirable d'un clic. Sans lui,
   un filtre oublié se lit comme une commande disparue. */
function peindreCriteres() {
  const boite = $("criteres");
  const puces = [];
  if (recherche)  puces.push(["recherche", "« " + $("recherche").value.trim() + " »"]);
  if (crit.code)  puces.push(["code", "Code " + crit.code.toUpperCase()]);
  if (crit.tag)   puces.push(["tag", "Tag " + crit.tag]);
  if (crit.du)    puces.push(["du", "À partir du " + crit.du]);
  if (crit.au)    puces.push(["au", "Jusqu'au " + crit.au]);
  boite.innerHTML = puces.map(([k, t]) =>
    `<span class="crit">${echapper(t)}<button type="button" data-crit="${k}"
       title="Retirer ce critère" aria-label="Retirer ce critère">×</button></span>`).join("");
}

$("criteres").onclick = (e) => {
  const b = e.target.closest("button[data-crit]");
  if (!b) return;
  const k = b.dataset.crit;
  if (k === "recherche") { $("recherche").value = ""; recherche = ""; }
  else { crit[k] = ""; $({ code: "fCode", tag: "fTag", du: "fDu", au: "fAu" }[k]).value = ""; }
  afficher();
};

$("btnPlus").onclick = () => {
  const p = $("filtresPlus");
  p.classList.toggle("ouvert");
  $("btnPlus").setAttribute("aria-pressed", p.classList.contains("ouvert") ? "true" : "false");
};

["fCode", "fTag", "fDu", "fAu"].forEach(id => {
  $(id).oninput = () => {
    crit.code = $("fCode").value.trim();
    crit.tag  = $("fTag").value;
    crit.du   = $("fDu").value;
    crit.au   = $("fAu").value;
    afficher();
  };
});

$("btnEffacerFiltres").onclick = () => {
  crit.code = crit.tag = crit.du = crit.au = "";
  ["fCode", "fTag", "fDu", "fAu"].forEach(id => $(id).value = "");
  $("recherche").value = ""; recherche = "";
  afficher();
};

// Listes d'aide à la saisie, remplies d'après ce qui existe réellement :
// proposer un code ou un tag inutilisé ne ferait que produire des vues vides.
function majListesFiltres() {
  const codes = new Set();
  commandes.forEach(c => (c.panier || []).forEach(l => {
    const k = codeLigne(l); if (k) codes.add(k);
  }));
  $("codesConnus").innerHTML =
    [...codes].sort().map(k => `<option value="${echapper(k)}">`).join("");

  const tags = [...new Set(clients.map(x => x.groupe).filter(Boolean))].sort();
  const garde = $("fTag").value;
  $("fTag").innerHTML = '<option value="">Tous</option>' +
    tags.map(t => `<option value="${echapper(t)}">${echapper(t)}</option>`).join("");
  if (tags.includes(garde)) $("fTag").value = garde;
}

/* Compteur des nouvelles commandes. Il compte sur la collection entière et
   non sur la vue courante : c'est un rappel permanent, il ne doit pas
   disparaître parce qu'on regarde ailleurs. */
function majCompteurNouvelles() {
  const n = commandes.filter(c => c.statut === "nouvelle").length;
  const el = $("cptNouvelles");
  el.textContent = n;
  el.hidden = n === 0;
}

/* ---------- Affichage ---------- */
/* Ordre affiché à l'écran, figé. Une commande sur laquelle on vient d'agir
   ne doit pas se déplacer sous les doigts : confirmer une commande la ferait
   sortir du groupe « à traiter » et il faudrait la rechercher pour pointer
   son paiement. Le classement se recalcule au chargement, au changement de
   filtre et à la recherche — jamais après un enregistrement. */
let ordreFige = null;

function afficher(reclasser = true) {
  const liste = $("liste");
  majCompteurNouvelles();
  majRappelImport();
  peindreCriteres();
  let vues = commandes.filter(retenue).filter(correspond).filter(passeCriteres);

  // Combien on voit sur combien : affiché seulement quand un critère est posé,
  // sinon le total de l'historique s'afficherait en permanence sans utilité.
  const cr = $("compteRes");
  cr.hidden = !critereActif();
  if (!cr.hidden) cr.textContent = vues.length + " commande(s) sur " + commandes.length;
  // Seule la vue « Toutes » mélange des commandes closes et actives : elle
  // seule a besoin de les séparer.
  if (filtre === "toutes") vues = trierPourToutes(vues);

  if (reclasser) {
    ordreFige = vues.map(c => c.id);
  } else if (ordreFige) {
    // Une commande absente du classement figé (rare : arrivée entre-temps)
    // est renvoyée en fin de liste plutôt que placée au hasard.
    const rang = new Map(ordreFige.map((id, i) => [id, i]));
    vues.sort((a, b) => (rang.has(a.id) ? rang.get(a.id) : Infinity)
                      - (rang.has(b.id) ? rang.get(b.id) : Infinity));
  }

  liste.innerHTML = "";

  if (!vues.length) {
    liste.innerHTML = critereActif()
      ? '<div class="vide">Aucune commande ne correspond aux critères.' +
        '<br><br>Les filtres portent sur tout l\'historique : si rien ne sort, ' +
        'c\'est que la commande cherchée n\'existe pas sous cette forme.</div>'
      : '<div class="vide">Aucune commande dans cette vue.</div>';
    return;
  }

  // Une commande sortie de la vue ne doit pas rester sélectionnée en douce.
  const visibles = new Set(vues.map(c => c.id));
  [...selection].forEach(id => { if (!visibles.has(id)) selection.delete(id); });

  let jourCourant = null;
  vues.forEach(c => {
    if (c.date_retrait !== jourCourant) {
      jourCourant = c.date_retrait;
      const t = document.createElement("div");
      t.className = "jour";
      const duJour = vues.filter(x => x.date_retrait === jourCourant).map(x => x.id);
      const toutes = duJour.every(id => selection.has(id));
      t.innerHTML = '<span></span><button type="button" class="tout"></button>' +
        '<button type="button" class="tout tournee"></button>';
      t.querySelector("span").textContent = dateLongue(jourCourant);
      const bTout = t.querySelector(".tout");
      bTout.textContent = toutes ? "Tout désélectionner" : "Tout sélectionner";
      bTout.onclick = () => {
        duJour.forEach(id => toutes ? selection.delete(id) : selection.add(id));
        afficher(false);
      };

      /* Une tournée n'appartient à aucune commande en particulier : elle se
         lance depuis la journée, pas depuis une carte. Le bouton n'apparaît
         que s'il reste au moins deux livraisons groupables ce jour-là. */
      const dateDuJour = jourCourant;
      const bTournee = t.querySelector(".tournee");
      const groupables = vues.filter(x => x.date_retrait === dateDuJour)
                             .filter(estGroupable);
      // Une destination fixe compte comme un arrêt possible : expédier vers
      // une delivery area est une course à part entière.
      if (groupables.length + destinationsLalamove().length >= 2) {
        bTournee.textContent = "🛵 Grouper une tournée";
        bTournee.onclick = () => ouvrirTournee(dateDuJour, groupables, panneau);
      } else {
        bTournee.remove();
      }
      liste.appendChild(t);

      const panneau = document.createElement("div");
      panneau.className = "cmd";
      panneau.hidden = true;
      panneau.style.borderLeft = "3px solid var(--accent)";
      liste.appendChild(panneau);
    }
    liste.appendChild(carte(c));
  });

  majLot();
}

// Date courte, pour les cartes réduites : le jour du mois suffit, la
// date longue avec l'année n'apporte rien sur une commande déjà classée.
function dateCourte(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

function dateLongue(iso) {
  if (!iso) return "Sans date";
  const d = new Date(iso + "T12:00:00");
  const texte = d.toLocaleDateString("fr-FR",
    { weekday: "long", day: "numeric", month: "long" });
  // Les deux repères sont pris à midi : comparer une date à midi avec un
  // aujourd'hui à minuit donnait un demi-jour d'écart, arrondi à un jour
  // entier — toutes les journées étaient annoncées avec un jour d'avance.
  const auj = new Date(); auj.setHours(12, 0, 0, 0);
  const ecart = Math.round((d - auj) / 86400000);
  if (ecart === 0) return "Aujourd'hui — " + texte;
  if (ecart === 1) return "Demain — " + texte;
  if (ecart < 0)   return "Passée — " + texte;
  return texte;
}

/* ---------- Lalamove ----------
   Les coordonnées de livraison vivent sur la fiche client, pas sur la
   commande : la collection « clients » est déjà chargée en mémoire pour la
   création de commande, on la réutilise plutôt que de relire Firestore.
   Rapprochement par téléphone, comme partout ailleurs dans cette page. */
/* Le numéro que le motard appellera. Beaucoup de clients sont des étrangers
   résidant ici : leur WhatsApp d'origine ne sonne pas depuis un téléphone
   philippin. Trois sources, de la plus récente à la plus ancienne — celle
   saisie au checkout prime sur celle tapée à la main, qui prime sur le
   numéro de contact habituel. */
function telLivraison(c) {
  const surCommande = (c.client?.telephone_local || "").trim();
  if (surCommande) return surCommande;

  const k = cleTel(c.client?.telephone);
  const fiche = k ? clients.find(x => cleTel(x.telephone || x.id) === k) : null;
  const surFiche = fiche ? String(fiche.telephone_local || "").trim() : "";
  if (surFiche) return surFiche;

  return c.client?.telephone || "";
}

function coordonneesDe(c) {
  /* Livraison ponctuelle ailleurs : le client a coché « livrer ailleurs cette
     fois » au checkout. Le point GPS de la fiche désigne son domicile
     habituel — l'envoyer à Lalamove ferait partir le motard au mauvais
     endroit sans que rien ne le signale. Pas de coordonnées, donc pas de
     course automatique : la commande sort des tournées et le bloc Lalamove
     explique pourquoi (voir monterLalamove). */
  if (c.client?.adresse_ponctuelle) return null;
  const k = cleTel(c.client?.telephone);
  if (!k) return null;
  const fiche = clients.find(x => cleTel(x.telephone || x.id) === k);
  const co = fiche && fiche.coordonnees;
  return (co && co.lat && co.lng) ? co : null;
}

/* Points de départ : lus une seule fois par ouverture de page et partagés
   par toutes les commandes. Ajouter un lieu se fait dans Firestore, sans
   toucher à cette page. */
/* Lieux Lalamove gardés en mémoire dès le premier chargement : le bouton de
   tournée doit pouvoir décider s'il s'affiche sans attendre le serveur. */
let configLieux = null;

/* Un lieu porteur d'un contact est aussi une destination : on peut y expédier
   du pain, pas seulement en partir. C'est le cas de la delivery area d'un
   immeuble, où le pain de plusieurs résidents est déposé en une fois. */
function destinationsLalamove() {
  return ((configLieux && configLieux.lieux) || [])
    .filter(l => l.contact_nom && l.contact_tel && l.lat && l.lng);
}

let promesseLieux = null;
function lireLieuxLalamove() {
  if (!promesseLieux) {
    promesseLieux = httpsCallable(fns, "lalamoveLieux")()
      .then(r => r.data)
      .catch(e => { promesseLieux = null; throw e; });
  }
  return promesseLieux;
}

function carte(c) {
  const paye = (c.paiement?.statut || "en attente") === "paye";
  // Montant réellement réglé au moment où "Payé" a été coché — capturé à cet
  // instant précis (voir enregistrer()), pas recalculé après coup. Un ajout
  // à la commande APRÈS ce moment fait grimper le total sans toucher ce
  // chiffre : l'écart entre les deux est ce qu'il reste à encaisser.
  const montantPaye = Number(c.paiement?.montant_paye) || 0;
  /* Absent (et non zéro) quand la commande n'a jamais été réglée en son nom
     propre : c'est le cas des livraisons d'abonnement, payées en un lot au
     niveau de l'abonnement. Sans cette distinction, le champ manquant était
     lu comme « zéro encaissé » et le badge réclamait la totalité du montant
     sur des commandes pourtant soldées. */
  const aMontantConnu = c.paiement?.montant_paye != null;
  const resteAPayer = (paye && aMontantConnu)
    ? Math.max(0, (c.total || 0) - montantPaye) : 0;
  const el = document.createElement("div");
  el.id = "cmd-" + c.id;
  // Confirmée et payée : la commande n'attend plus rien de vous.
  const rienAFaire = paye && ["confirmee", "en production", "prete", "remise"]
    .includes(c.statut);

  // Remise ou annulée, et le paiement réglé dans un sens ou dans l'autre :
  // il n'y a plus jamais rien à faire ni à vérifier dessus. La carte se
  // réduit à l'essentiel, pour que les commandes qui attendent encore une
  // action ne se noient pas dans celles qui sont closes depuis longtemps.
  // Le détail reste consultable au clic — passée ou remboursée, une
  // commande peut toujours être recherchée si un client la questionne.
  const etatPaiement = c.paiement?.statut || "en attente";
  const compacte = ["remise", "annulee"].includes(c.statut)
                 && ["paye", "rembourse"].includes(etatPaiement);

  el.className = "cmd " + (paye ? "reglee" : "impaye") +
                 " b-" + (CLASSE_STATUT[c.statut] || "nouvelle") +
                 (rienAFaire ? " rien-a-faire" : "") +
                 (compacte ? " compacte" : "");

  const articles = (c.panier || []).reduce((n, l) => n + l.qte, 0);

  el.innerHTML = compacte ? `
    <div class="tete">
      <input type="checkbox" class="coche" aria-label="Sélectionner">
      <span class="ref">${echapper(c.numero || c.id)}</span>
      <span class="nom"></span>
      <span class="quand">${echapper(dateCourte(c.date_retrait))}</span>
      <span class="fleche">▾</span>
    </div>
    <div class="detail" hidden>
      <div class="lignes"></div>
      <p class="info" style="margin-top:11px"><b>Contact</b> ${
        echapper(c.client?.telephone || "")}</p>
      ${c.client?.adresse ? '<p class="info adresse"></p>' : ""}
      ${c.option?.lieu ? '<p class="info lieu"></p>' : ""}
      ${c.notes ? '<p class="info notes"></p>' : ""}
    </div>` : `
    <div class="tete">
      <input type="checkbox" class="coche" aria-label="Sélectionner">
      <span class="ref">${echapper(c.numero || c.id)}</span>
      <span class="nom"></span>
      ${c.abonnement_id ? `<span class="etiq bleue">Abonnement${
        c.abonnement_rang ? " " + c.abonnement_rang +
          (c.abonnement_total ? "/" + c.abonnement_total : "") : ""}</span>` : ""}
      ${c.credit_utilise > 0 ? `<span class="etiq">crédit ${peso(c.credit_utilise)}</span>` : ""}
      ${c.client?.adresse_ponctuelle ? `<span class="etiq ponctuelle"
        title="Livraison ailleurs pour cette commande — le point GPS de la fiche ne s'applique pas"
        >Adresse ponctuelle</span>` : ""}
      ${ficheAVerifier(c) ? `<span class="etiq neuf"
        title="Fiche client à compléter : ${echapper(ficheAVerifier(c))}"
        >Nouveau · ${echapper(ficheAVerifier(c))}</span>` : ""}
      <span class="etiq st-${CLASSE_STATUT[c.statut] || "nouvelle"}">${
        LIBELLES[c.statut] || c.statut}</span>
      ${c.paiement?.methode ? `<span class="etiq">${
        echapper(MOYENS_PAIEMENT[c.paiement.methode] || c.paiement.methode)}</span>` : ""}
      <span class="etiq ${paye ? "verte" : (estCOD(c) ? "cod" : "rouge")}">${
        paye ? "Payé" : (estCOD(c) ? "COD" : "À encaisser")}</span>
      ${resteAPayer > 0 ? `<span class="etiq rouge btnResteAPayer" title="Un ajout à la commande a fait grimper le total après le paiement — clique une fois la différence encaissée" style="cursor:pointer;">Reste à payer : ${peso(resteAPayer)}</span>` : ""}
      <span class="montant">${peso(c.total)}</span>
    </div>
    <div class="resume"></div>
    <div class="detail" hidden>
      <div class="lignes"></div>
      <p class="info" style="margin-top:11px"><b>Contact</b> ${
        echapper(c.client?.telephone || "")}</p>
      ${c.client?.adresse ? '<p class="info adresse"></p>' : ""}
      ${c.option?.lieu ? '<p class="info lieu"></p>' : ""}
      ${c.notes ? '<p class="info notes"></p>' : ""}
      <div class="actions">
        <select class="selStatut">
          ${STATUTS.map(s => `<option value="${s}">${LIBELLES[s]}</option>`).join("")}
        </select>
        <select class="selPaiement">
          ${Object.entries(PAIEMENTS).map(([v, t]) =>
            `<option value="${v}">${t}</option>`).join("")}
        </select>
        <select class="selMethode">
          <option value="">Moyen non précisé</option>
          ${Object.entries(MOYENS_PAIEMENT).map(([v, t]) =>
            `<option value="${v}">${t}</option>`).join("")}
        </select>
        <a class="lien lienClient" target="_blank" rel="noopener">WhatsApp client</a>
        <button type="button" class="mineur btnModifier">Modifier la commande</button>
      </div>

      <div class="lala" hidden style="margin-top:12px;padding-top:12px;
           border-top:1px dashed var(--trait)"></div>

      <div class="edition" hidden></div>
    </div>`;

  /* Trois zones cliquables distinctes sur la carte : la case coche
     sélectionne, le nom ouvre la fiche client, tout le reste déplie la
     commande. Le nom devient un vrai lien (nouvel onglet, clic milieu, copie
     de l'adresse) plutôt qu'un gestionnaire de clic, mais il faut arrêter la
     propagation, sinon partir vers la fiche déplierait la carte au passage. */
  const zoneNom = el.querySelector(".nom");
  const telClient = cleTel(c.client?.telephone);
  const ficheClient = telClient
    ? clients.find(x => cleTel(x.telephone || x.id) === telClient) : null;
  if (ficheClient) {
    const a = document.createElement("a");
    a.className = "nom-lien";
    a.href = "clients-admin.html?client=" + encodeURIComponent(ficheClient.id);
    a.textContent = nomDe(c) || "—";
    a.title = "Ouvrir la fiche client";
    a.onclick = (e) => e.stopPropagation();
    zoneNom.textContent = "";
    zoneNom.appendChild(a);
  } else {
    // Pas de fiche : un lien mènerait à une page vide. Le nom reste du texte,
    // et déplier la carte marche comme partout ailleurs.
    zoneNom.textContent = nomDe(c) || "—";
  }
  if (!compacte) {
    // Le statut est déjà dans l'étiquette colorée de l'en-tête.
    el.querySelector(".resume").textContent =
      [c.option?.nom, c.creneau,
       articles + (articles > 1 ? " articles" : " article")]
      .filter(Boolean).join(" · ");
  }

  el.querySelector(".lignes").innerHTML = (c.panier || []).map(l =>
    `<div class="l"><span>${l.qte} × ${echapper(l.nom)}</span>
     <span>${peso(l.qte * l.prix)}</span></div>`).join("") +
    (c.frais_livraison > 0
      ? `<div class="l"><span>${echapper(c.option?.nom || "Livraison")}</span>
         <span>${peso(c.frais_livraison)}</span></div>` : "") +
    (c.frais_a_confirmer
      ? `<div class="l"><span>${echapper(c.option?.nom || "")}</span>
         <span>à confirmer</span></div>` : "");

  /* Afficher l'adresse qui servira réellement à livrer, et non celle tapée au
     checkout : sans cela, on corrige une adresse dans le fichier clients et
     la carte continue d'afficher l'ancienne, ce qui donne à penser que la
     correction n'a pas pris. */
  if (c.client?.adresse) {
    el.querySelector(".adresse").textContent =
      (c.option?.type === "livraison") ? adresseLivraison(c) : c.client.adresse;
  }
  if (c.option?.lieu)    el.querySelector(".lieu").textContent = c.option.lieu;
  if (c.notes)           el.querySelector(".notes").textContent = "Note : " + c.notes;

  const detail = el.querySelector(".detail");
  el.querySelector(".tete").onclick = () => { detail.hidden = !detail.hidden; };

  const coche = el.querySelector(".coche");
  coche.checked = selection.has(c.id);
  coche.onclick = (e) => e.stopPropagation();   // ne pas déplier la carte
  coche.onchange = () => {
    coche.checked ? selection.add(c.id) : selection.delete(c.id);
    majLot();
  };

  // Rien à faire sur une commande classée : ni statut à changer, ni
  // paiement à pointer, ni modification possible. Câbler ces éléments
  // sur une carte qui ne les contient pas ferait planter le rendu.
  if (!compacte) {
    el.querySelector(".btnModifier").onclick = () => {
      const zone = el.querySelector(".edition");
      if (!zone.hidden) { zone.hidden = true; zone.innerHTML = ""; return; }
      ouvrirModification(c, el);
    };

    const selS = el.querySelector(".selStatut");
    const selP = el.querySelector(".selPaiement");
    const selM = el.querySelector(".selMethode");
    selS.value = c.statut || "nouvelle";
    selP.value = c.paiement?.statut || "en attente";
    selM.value = c.paiement?.methode || "";
    // La valeur est recopiée dans un attribut : le CSS ne peut pas cibler
    // la sélection courante d'un menu autrement.
    const teinter = (sel) => sel.dataset.v = sel.value;
    teinter(selS); teinter(selP);
    selS.onchange = () => { teinter(selS); enregistrer(c, { statut: selS.value }); };
    selP.onchange = () => {
      teinter(selP);
      const champs = { "paiement.statut": selP.value };
      // Capturé à cet instant : un ajout ultérieur à la commande fera
      // grimper le total sans toucher ce chiffre, ce qui fait apparaître
      // le reste à payer (voir carte()).
      if (selP.value === "paye") champs["paiement.montant_paye"] = c.total || 0;
      enregistrer(c, champs);
    };
    selM.onchange = () => enregistrer(c, { "paiement.methode": selM.value });

    el.querySelector(".lienClient").href =
      "https://wa.me/" + (c.client?.telephone || "").replace(/\D/g, "");

    const btnReste = el.querySelector(".btnResteAPayer");
    if (btnReste) {
      btnReste.onclick = () => {
        if (!confirm(`Marquer ${peso(resteAPayer)} comme encaissé pour cette commande ?`)) return;
        enregistrer(c, { "paiement.montant_paye": c.total || 0 });
      };
    }

    monterLalamove(c, el);
  }

  return el;
}

/* Une commande est groupable si elle a un point de livraison, aucune course
   déjà commandée, et n'est pas annulée. Même règle que le bloc individuel :
   les clients en retrait n'apparaissent jamais. */
function estGroupable(c) {
  if (c.statut === "annulee") return false;
  if (c.lalamove && c.lalamove.orderId) return false;
  return !!coordonneesDe(c);
}

/* ---------- Panneau de tournée ----------
   Trois arrêts au maximum : une moto porte trois sacs. La limite est aussi
   refusée côté serveur, celle-ci n'est là que pour éviter de cocher pour rien. */
const MAX_ARRETS = 3;

function ouvrirTournee(date, groupables, panneau) {
  if (!panneau.hidden) { panneau.hidden = true; panneau.innerHTML = ""; return; }
  panneau.hidden = false;

  /* Commandes et destinations fixes deviennent des « cibles » de même nature :
     le panneau ne fait plus la différence, seul l'enregistrement final la
     refait — une destination n'a pas de commande à marquer. */
  const cibles = [
    ...groupables.map(c => {
      const co = coordonneesDe(c);
      return {
        cle: c.id,
        titre: (nomDe(c) || "—") + " · " + (adresseLivraison(c) || "sans adresse"),
        marque: c.numero || c.id,
        commande: c,
        arrivee: () => ({
          lat: String(co.lat), lng: String(co.lng),
          adresse: adresseLivraison(c),
          nom: nomDe(c) || c.client?.telephone || "",
          tel: telLivraison(c),
          commandeId: c.id
        })
      };
    }),
    ...destinationsLalamove().map(l => ({
      cle: "lieu:" + l.cle,
      titre: l.contact_nom,
      marque: "Dépôt",
      commande: null,
      // Fonction et non valeur figée : la consigne se tape après la
      // construction de la liste, elle doit être lue au moment de l'envoi.
      arrivee: () => ({
        lat: String(l.lat), lng: String(l.lng),
        adresse: [l.adresse || l.contact_nom, consignes["lieu:" + l.cle] || ""]
                   .filter(Boolean).join(" — "),
        nom: l.contact_nom,
        tel: l.contact_tel,
        commandeId: null
      })
    }))
  ];

  const choisis = new Set();
  /* Consignes saisies pour une destination fixe : les résidents changent
     d'une expédition à l'autre, elles ne peuvent donc pas vivre dans la
     configuration du lieu. Elles ne valent que pour cette course. */
  const consignes = {};
  let cotation = null, cotationLe = 0, armee = 0;
  const VALIDITE = 4 * 60 * 1000;

  panneau.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:19px">Tournée du ${echapper(dateCourte(date))}</h2>
    <p style="margin:0 0 10px;font-size:14.5px;color:var(--encre-doux)">
      Un seul motard, jusqu'à ${MAX_ARRETS} arrêts. Lalamove choisit l'ordre
      du trajet. Un dépôt compte comme un arrêt.</p>
    <div class="tourneeListe"></div>
    <div class="actions">
      <select class="tourneeDepart"></select>
      <button type="button" class="mineur tourneeCoter" disabled>Estimer la tournée</button>
      <span class="info tourneeEtat" style="margin:0"></span>
    </div>
    <div class="actions" style="margin-top:8px">
      <button type="button" class="mineur tourneeCourser" hidden
              style="border-color:var(--alerte);color:var(--alerte)">Commander la tournée</button>
      <span class="info tourneeCourseEtat" style="margin:0"></span>
      <button type="button" class="mineur tourneeFermer">Fermer</button>
    </div>`;

  const zl        = panneau.querySelector(".tourneeListe");
  const selDepart = panneau.querySelector(".tourneeDepart");
  const btnCoter  = panneau.querySelector(".tourneeCoter");
  const etatCoter = panneau.querySelector(".tourneeEtat");
  const btnCourse = panneau.querySelector(".tourneeCourser");
  const etatCourse= panneau.querySelector(".tourneeCourseEtat");

  panneau.querySelector(".tourneeFermer").onclick = () => {
    panneau.hidden = true; panneau.innerHTML = "";
  };

  lireLieuxLalamove().then(cfg => {
    selDepart.innerHTML = (cfg.lieux || [])
      .map(l => `<option value="${echapper(l.cle)}">${echapper(l.nom)}</option>`).join("");
    if (cfg.defaut) selDepart.value = cfg.defaut;
  }).catch(e => {
    console.error(e);
    etatCoter.textContent = "Points de départ indisponibles.";
  });

  // Toute modification de la sélection périme la cotation : le prix affiché
  // ne correspondrait plus aux arrêts cochés.
  function oublierCotation() {
    cotation = null; cotationLe = 0; armee = 0;
    btnCourse.hidden = true;
    btnCourse.textContent = "Commander la tournée";
    btnCourse.style.background = "";
    etatCoter.textContent = "";
    etatCourse.textContent = "";
  }

  function dessiner() {
    zl.innerHTML = "";
    cibles.forEach(t => {
      const ligne = document.createElement("div");
      ligne.className = "edit-l";
      ligne.innerHTML = `
        <input type="checkbox" class="coche">
        <span class="n"></span>
        <span class="p" style="min-width:0"></span>`;
      const coche = ligne.querySelector(".coche");
      coche.checked = choisis.has(t.cle);
      // Le plafond bloque les cases non cochées, jamais celles déjà cochées :
      // il doit toujours rester possible de décocher pour changer d'avis.
      coche.disabled = !coche.checked && choisis.size >= MAX_ARRETS;
      coche.onchange = () => {
        coche.checked ? choisis.add(t.cle) : choisis.delete(t.cle);
        oublierCotation();
        dessiner();
      };
      ligne.querySelector(".n").textContent = t.titre;
      ligne.querySelector(".p").textContent = t.marque;
      zl.appendChild(ligne);

      /* Le commentaire part dans les remarques de l'arrêt : c'est ce que le
         motard lit dans son application. Affiché seulement quand la
         destination est cochée, pour ne pas encombrer la liste. */
      if (!t.commande && coche.checked) {
        const champ = document.createElement("input");
        champ.type = "text";
        champ.placeholder = "Noms et unités — ex. Cruz 12B / Reyes 4A";
        champ.value = consignes[t.cle] || "";
        champ.style.cssText = "width:100%;margin:4px 0 8px;padding:8px 10px;"
          + "border:1px solid var(--trait);border-radius:var(--r);"
          + "font:inherit;font-size:16px;background:#fff";
        // Pas de redessin à la frappe : le champ perdrait le curseur.
        champ.oninput = (e) => { consignes[t.cle] = e.target.value; };
        zl.appendChild(champ);
      }
    });

    // Un seul arrêt suffit : expédier uniquement vers un dépôt est une
    // course légitime, et le serveur l'accepte.
    btnCoter.disabled = choisis.size < 1;
    const restant = MAX_ARRETS - choisis.size;
    etatCoter.textContent = etatCoter.textContent ||
      (choisis.size < 1 ? "Cochez au moins une destination."
                        : restant > 0 ? restant + " arrêt(s) encore possible(s)." : "");
  }
  dessiner();

  const selectionnees = () => cibles.filter(t => choisis.has(t.cle));
  const arrivees = () => selectionnees().map(t => t.arrivee());

  btnCoter.onclick = async () => {
    btnCoter.disabled = true;
    etatCoter.style.color = "";
    etatCoter.textContent = "Cotation…";
    try {
      const r = await httpsCallable(fns, "lalamoveCotationTournee")({
        depart: selDepart.value, arrivees: arrivees()
      });
      const q = r.data;
      cotation = q; cotationLe = Date.now();
      const dist = q.distance ? " · " + q.distance.value + " " + q.distance.unit : "";
      etatCoter.style.color = "var(--ok)";
      etatCoter.textContent = (q.devise || "PHP") + " " + q.total
        + " pour " + q.nbArrets + " arrêts · départ " + q.depart + dist;
      btnCourse.hidden = false;
      etatCourse.textContent = "";
    } catch (e) {
      console.error(e);
      etatCoter.style.color = "var(--alerte)";
      etatCoter.textContent = e && e.message ? e.message : "Cotation impossible.";
      cotation = null; btnCourse.hidden = true;
    } finally {
      btnCoter.disabled = choisis.size < 1;
    }
  };

  btnCourse.onclick = async () => {
    if (!armee || Date.now() > armee) {
      if (!cotation || (Date.now() - cotationLe) > VALIDITE) {
        etatCourse.style.color = "";
        etatCourse.textContent = "Cotation expirée — réestimez d'abord.";
        oublierCotation();
        return;
      }
      armee = Date.now() + 10000;
      btnCourse.textContent = "Confirmer : " + (cotation.devise || "PHP") + " "
        + cotation.total + " · " + choisis.size + " arrêts";
      btnCourse.style.background = "#f6e2de";
      etatCourse.style.color = "";
      etatCourse.textContent = "Second clic dans les 10 secondes pour engager.";
      setTimeout(() => {
        if (armee && Date.now() > armee - 200) {
          armee = 0;
          btnCourse.textContent = "Commander la tournée";
          btnCourse.style.background = "";
          etatCourse.textContent = "Annulé — rien n'a été commandé.";
        }
      }, 10000);
      return;
    }

    // Second clic : point de non-retour, un motard est assigné.
    armee = 0;
    btnCourse.disabled = true;
    btnCourse.textContent = "Commander la tournée";
    btnCourse.style.background = "";
    etatCourse.style.color = "";
    etatCourse.textContent = "Réservation…";

    // Une destination fixe n'a pas de commande à marquer : elle peut être
    // réexpédiée autant de fois que nécessaire.
    const lot = selectionnees().filter(t => t.commande).map(t => t.commande);
    try {
      const r = await httpsCallable(fns, "lalamoveCourseTournee")({
        quotationId: cotation.quotationId,
        stops: cotation.stops,
        departCoord: cotation.departCoord,
        arrivees: arrivees()
      });
      const o = r.data;
      const trace = {
        orderId: o.orderId, statut: o.statut,
        prix: (o.devise || "PHP") + " " + o.prix,
        partageUrl: o.partageUrl || "",
        tournee: choisis.size,
        quand: new Date().toISOString()
      };

      /* La même course est écrite sur chaque commande du lot : c'est ce qui
         les fait toutes sortir des groupables et empêche de les recommander.
         Une écriture qui échoue n'annule pas la course, déjà partie. */
      try {
        if (lot.length) {
          const paquet = writeBatch(db);
          lot.forEach(c => paquet.update(doc(db, "commandes", c.id), { lalamove: trace }));
          await paquet.commit();
        }
      } catch (err) {
        console.error("Trace sur les commandes impossible", err);
        signaler("Tournée commandée, mais non enregistrée sur les commandes.", "err");
      }
      lot.forEach(c => c.lalamove = trace);

      panneau.hidden = true; panneau.innerHTML = "";
      afficher();
      signaler("Tournée Lalamove commandée (" + choisis.size + " arrêt(s)).", "ok");
    } catch (e) {
      console.error(e);
      etatCourse.style.color = "var(--alerte)";
      etatCourse.textContent = e && e.message ? e.message : "Réservation impossible.";
      btnCourse.disabled = false;
    }
  };
}

/* ---------- Bloc Lalamove d'une commande ----------
   Trois états : rien à faire (pas de coordonnées, commande annulée), à coter,
   ou course déjà partie. L'orderId est écrit sur la commande dès qu'elle
   existe : c'est ce qui empêche de payer deux fois la même livraison si la
   page est rechargée ou la carte rouverte. */
function monterLalamove(c, el) {
  const zone = el.querySelector(".lala");
  if (!zone) return;

  // Une commande annulée n'a pas à être livrée.
  if (c.statut === "annulee") return;

  /* Adresse ponctuelle : dire pourquoi il n'y a pas de bouton, sinon son
     absence passe pour une panne et on cherche ailleurs. La course reste
     possible depuis l'application Lalamove, en tapant l'adresse à la main. */
  if (c.client?.adresse_ponctuelle) {
    zone.hidden = false;
    zone.innerHTML = `
      <div class="info"><b>Adresse ponctuelle</b> — le client a demandé une
        livraison ailleurs pour cette commande. Le point GPS enregistré sur sa
        fiche ne correspond pas : pas de course automatique, à commander à la
        main sur l'adresse ci-dessus.</div>`;
    return;
  }

  // Course déjà commandée : plus de bouton, seulement le suivi.
  if (c.lalamove && c.lalamove.orderId) {
    zone.hidden = false;
    zone.innerHTML = `
      <div class="info"><b>Lalamove</b> course ${echapper(c.lalamove.orderId)}
        — ${echapper(c.lalamove.statut || "")}
        ${c.lalamove.prix ? "· " + echapper(String(c.lalamove.prix)) : ""}</div>`;
    if (c.lalamove.partageUrl) {
      const a = document.createElement("a");
      a.className = "lien"; a.target = "_blank"; a.rel = "noopener";
      a.href = c.lalamove.partageUrl; a.textContent = "Suivre le motard";
      a.style.marginTop = "7px";
      zone.appendChild(a);
    }
    return;
  }

  const co = coordonneesDe(c);
  if (!co) return;   // client en retrait, ou fiche sans point de livraison

  zone.hidden = false;
  zone.innerHTML = `
    <div class="actions" style="margin-top:0">
      <select class="lalaDepart"></select>
      <button type="button" class="mineur lalaCoter">Estimer la livraison</button>
      <span class="info lalaEtat" style="margin:0"></span>
    </div>
    <div class="actions" style="margin-top:8px">
      <button type="button" class="mineur lalaCourser" hidden
              style="border-color:var(--alerte);color:var(--alerte)">Commander la course</button>
      <span class="info lalaCourseEtat" style="margin:0"></span>
    </div>`;

  const selDepart  = zone.querySelector(".lalaDepart");
  const btnCoter   = zone.querySelector(".lalaCoter");
  const etatCoter  = zone.querySelector(".lalaEtat");
  const btnCourse  = zone.querySelector(".lalaCourser");
  const etatCourse = zone.querySelector(".lalaCourseEtat");

  lireLieuxLalamove().then(cfg => {
    selDepart.innerHTML = (cfg.lieux || [])
      .map(l => `<option value="${echapper(l.cle)}">${echapper(l.nom)}</option>`).join("");
    if (cfg.defaut) selDepart.value = cfg.defaut;
  }).catch(e => {
    console.error(e);
    etatCoter.textContent = "Points de départ indisponibles.";
  });

  /* Une cotation expire au bout de 5 minutes chez Lalamove. On retient une
     minute de marge : mieux vaut recoter pour rien que voir la réservation
     refusée entre deux clics. */
  const VALIDITE = 4 * 60 * 1000;
  let cotation = null, cotationLe = 0, armee = 0;

  function desarmer() {
    armee = 0;
    btnCourse.textContent = "Commander la course";
    btnCourse.style.background = "";
  }

  btnCoter.onclick = async () => {
    btnCoter.disabled = true;
    etatCoter.style.color = "";
    etatCoter.textContent = "Cotation…";
    try {
      const r = await httpsCallable(fns, "lalamoveCotation")({
        lat: String(co.lat), lng: String(co.lng),
        adresse: adresseLivraison(c),
        depart: selDepart.value
      });
      const q = r.data;
      cotation = q; cotationLe = Date.now();
      const dist = q.distance ? " · " + q.distance.value + " " + q.distance.unit : "";
      etatCoter.style.color = "var(--ok)";
      etatCoter.textContent = (q.devise || "PHP") + " " + q.total
        + " · départ " + q.depart + dist;
      btnCourse.hidden = false;
      desarmer();
      etatCourse.textContent = "";
    } catch (e) {
      console.error(e);
      etatCoter.style.color = "var(--alerte)";
      etatCoter.textContent = e && e.message ? e.message : "Cotation impossible.";
      cotation = null; btnCourse.hidden = true;
    } finally {
      btnCoter.disabled = false;
    }
  };

  /* Confirmation en deux temps plutôt qu'une fenêtre système : à 6h du matin
     on valide un confirm() sans le lire. Un bouton qui change de texte et
     affiche le prix oblige à regarder ce qu'on engage. */
  btnCourse.onclick = async () => {
    if (!armee || Date.now() > armee) {
      if (!cotation || (Date.now() - cotationLe) > VALIDITE) {
        etatCourse.style.color = "";
        etatCourse.textContent = "Cotation expirée — réestimez d'abord.";
        cotation = null; btnCourse.hidden = true;
        return;
      }
      armee = Date.now() + 10000;
      btnCourse.textContent = "Confirmer : " + (cotation.devise || "PHP") + " "
        + cotation.total + " → " + nomDe(c);
      btnCourse.style.background = "#f6e2de";
      etatCourse.style.color = "";
      etatCourse.textContent = "Second clic dans les 10 secondes pour engager.";
      setTimeout(() => {
        if (armee && Date.now() > armee - 200) {
          desarmer();
          etatCourse.textContent = "Annulé — rien n'a été commandé.";
        }
      }, 10000);
      return;
    }

    // Second clic : point de non-retour, un motard est assigné.
    desarmer();
    btnCourse.disabled = true;
    etatCourse.style.color = "";
    etatCourse.textContent = "Réservation…";
    try {
      const stops = cotation.stops || [];
      const r = await httpsCallable(fns, "lalamoveCourse")({
        quotationId: cotation.quotationId,
        stopIdDepart: stops[0] && stops[0].stopId,
        stopIdArrivee: stops[1] && stops[1].stopId,
        nomClient: nomDe(c) || c.client?.telephone || "",
        telClient: telLivraison(c),
        consignes: adresseLivraison(c).slice(0, 200)
      });
      const o = r.data;

      /* Écrit sur la commande, pas seulement dans « courses » : c'est ce
         qui fait disparaître le bouton au rechargement et rend un second
         paiement impossible. */
      const trace = {
        orderId: o.orderId, statut: o.statut,
        prix: (o.devise || "PHP") + " " + o.prix,
        partageUrl: o.partageUrl || "",
        quand: new Date().toISOString()
      };
      try {
        await updateDoc(doc(db, "commandes", c.id), { lalamove: trace });
      } catch (err) {
        // La course existe chez Lalamove : on n'annule rien, on signale.
        console.error("Trace sur la commande impossible", err);
        signaler("Course commandée, mais non enregistrée sur la commande.", "err");
      }
      c.lalamove = trace;
      monterLalamove(c, el);
      signaler("Course Lalamove commandée.", "ok");
    } catch (e) {
      console.error(e);
      etatCourse.style.color = "var(--alerte)";
      etatCourse.textContent = e && e.message ? e.message : "Réservation impossible.";
      btnCourse.disabled = false;
    }
  };
}

function echapper(t) {
  return String(t ?? "").replace(/[&<>"]/g, x =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
}

/* ---------- Les échéances d'abonnement deviennent des commandes ----------
   Une échéance sans commande n'est ni imprimable, ni encaissable, ni suivable.
   L'identifiant est déterministe : relancer la génération ne crée pas de doublon. */
async function materialiserAbonnements() {
  // Fenêtre glissante : tout ce qui est dû d'ici dix jours est généré, ainsi
  // que les échéances en retard — une livraison due ne doit pas disparaître
  // parce que la page n'a pas été ouverte le bon jour.
  const limite = new Date(); limite.setHours(0, 0, 0, 0);
  limite.setDate(limite.getDate() + FENETRE_JOURS);
  const jusquA = iso(limite);

  // Chaque échéance à traiter est repérée par son rang dans le plan : c'est
  // ce rang, et non la date, qui fixe l'identifiant de la commande.
  const aFaire = [];
  abonnements.forEach(a => {
    if (a.statut !== "actif") return;
    (a.echeances || []).forEach((e, i) => {
      if (e.statut === "planifiee" && e.date && e.date <= jusquA)
        aFaire.push({ a, rang: i + 1, date: e.date });
    });
  });

  console.log("Abonnements :", abonnements.length,
    "· actifs :", abonnements.filter(a => a.statut === "actif").length,
    "· échéances jusqu'au " + jusquA + " :", aFaire.length);
  if (abonnements.length && !aFaire.length) {
    abonnements.forEach(a => console.log("  ", a.id, "statut", a.statut,
      "· échéances", (a.echeances || []).map(e => e.date + "/" + e.statut).join(" ")));
  }

  if (!aFaire.length) return 0;

  let creees = 0;
  for (const { a, rang, date } of aFaire) {
    // Rang sur deux chiffres : la commande garde le même identifiant même si
    // sa date est décalée ensuite, donc pas de doublon à la génération suivante.
    const id = "ABO-" + a.id + "-" + String(rang).padStart(2, "0");
    if (commandes.some(c => c.id === id)) continue;   // déjà générée

    const sousTotal = (a.panier || []).reduce((t, l) => t + (l.qte || 0) * (l.prix || 0), 0);

    /* Le code promo retenu à la souscription est figé sur l'abonnement :
       on n'interroge pas la fiche du code, qui a pu changer depuis. Il
       couvre tout le plan par défaut, ou la seule première échéance quand
       il a été restreint. Le rang suit la première livraison effective :
       un report déplace donc la remise avec elle, ce qui est bien le sens
       d'un geste d'accueil. */
    const p = a.promo || null;
    const remiseCode = p ? Number(p.remise_livraison) || 0 : 0;
    const couvertes = p
      ? (p.premiere_livraison_seulement === true
          ? 1
          : (Number(p.livraisons_couvertes) || (a.echeances || []).length))
      : 0;
    const remise = (remiseCode > 0 && rang <= couvertes) ? remiseCode : 0;

    const frais = Number(a.frais_livraison) || 0;
    const commande = {
      numero: "ABO-" + date.slice(5).replace("-", "") + "-" +
              (a.client?.nom || "").slice(0, 3).toUpperCase(),
      statut: "confirmee",
      abonnement_id: a.id,
      abonnement_rang: rang,
      abonnement_total: (a.echeances || []).length,
      client: {
        nom: a.client?.nom || "",
        telephone: a.client?.telephone || "",
        adresse: a.client?.adresse || ""
      },
      panier: (a.panier || []).map(l => ({ code: l.code, nom: l.nom, qte: l.qte, prix: l.prix })),
      sous_total: sousTotal,
      // Même forme que les commandes du checkout : l'édition de commande
      // et le recalcul lisent cet objet, pas une chaîne.
      remise_source: remise > 0 ? "promo" : "aucune",
      code_promo: remise > 0
        ? { code: p.code, type: p.type || "pourcentage",
            valeur: Number(p.valeur) || 0,
            rayons: Array.isArray(p.rayons) ? p.rayons : [],
            montant: remise }
        : null,
      frais_livraison: frais,
      frais_a_confirmer: false,
      total: Math.max(0, sousTotal - remise) + frais,
      option: a.option || {},
      date_retrait: date,
      creneau: "",
      paiement: {
        methode: a.paiement?.mode === "credit" ? "credit" : "avance",
        statut: a.paiement?.mode === "credit" ? "en attente" : "paye"
      },
      notes: "Bread plan",
      cree_le: new Date().toISOString()
    };

    try {
      await setDoc(doc(db, "commandes", id), commande);
      commandes.push({ id, ...commande });
      creees += 1;
    } catch (e) {
      console.error("Génération de la commande d'abonnement", id, e);
    }
  }
  return creees;
}

/* ---------- Pont vers la production ----------
   Publie, pour la prochaine date de livraison, le total par code produit.
   Aucune donnée client : ce document est lisible par l'ERP sans risque. */
// Clé de rapprochement par nom, insensible aux accents et à la casse.
function cle(t) {
  return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Le code de la ligne, ou à défaut celui retrouvé d'après le nom du produit.
function codeLigne(l) {
  return l.code || nomVersCode[cle(l.nom)] || null;
}

function iso(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}

// Ordre d'affichage : date de retrait, puis mode de retrait/livraison
// (pour regrouper les commandes à préparer pour un même point de dépose
// ou une même tournée), puis les plus récemment reçues en premier.
/* Ce qui attend un geste de votre part passe devant. Une commande qui vient
   d'arriver n'est pas prioritaire parce qu'elle est récente, mais parce
   qu'elle n'est pas encore confirmée : trier par heure de réception ferait
   au contraire descendre une commande d'hier toujours en attente.

     0 — nouvelle, à confirmer
     1 — confirmée mais impayée, hors COD : un règlement en ligne est attendu
     2 — le reste

   Le classement suit donc ce que vous faites : confirmer une commande la
   fait descendre d'elle-même, sans rien à manipuler. */
function urgence(c) {
  if (c.statut === "nouvelle") return 0;
  const enAttente = (c.paiement?.statut || "en attente") === "en attente";
  if (enAttente && !estCOD(c) && c.statut !== "annulee") return 1;
  return 2;
}

// Une commande est close quand elle a été remise ou annulée : plus rien à
// en attendre, elle n'a donc plus sa place en haut de l'historique.
function close(c) {
  return ["remise", "annulee"].includes(c.statut);
}

function trierCommandes() {
  commandes.sort((a, b) =>
    (a.date_retrait || "").localeCompare(b.date_retrait || "")
    || urgence(a) - urgence(b)
    || (a.option?.nom || "").localeCompare(b.option?.nom || "")
    || (b.cree_le || "").localeCompare(a.cree_le || ""));
}

/* Vue « Toutes » : ce qui reste à traiter d'abord, de la livraison la plus
   proche à la plus lointaine, puis les commandes closes — les plus récentes
   en tête, puisqu'on ne les consulte qu'en remontant le temps. */
function trierPourToutes(liste) {
  return liste.slice().sort((a, b) => {
    const ca = close(a), cb = close(b);
    if (ca !== cb) return ca ? 1 : -1;
    if (ca) return (b.date_retrait || "").localeCompare(a.date_retrait || "");
    return (a.date_retrait || "").localeCompare(b.date_retrait || "")
        || urgence(a) - urgence(b)
        || (a.option?.nom || "").localeCompare(b.option?.nom || "")
        || (b.cree_le || "").localeCompare(a.cree_le || "");
  });
}

// Le jour que l'ERP doit préparer : le plus proche qui a encore des
// commandes en attente de pesées ("confirmée", pas encore en production).
// Dès que la dernière commande confirmée d'une date passe "en production",
// cette date sort du calcul et l'ERP bascule tout seul sur la suivante —
// c'est le geste de faire avancer une commande qui déclenche le
// changement de jour, pas l'heure qu'il est.
function prochaineLivraison() {
  const dates = commandes
    .filter(c => c.statut === "confirmee" && c.date_retrait)
    .map(c => c.date_retrait);
  if (dates.length) return dates.sort()[0];

  // Repli : plus aucune commande en attente de pesées (tout est déjà en
  // production, ou rien n'est encore confirmé) — on retombe sur le
  // prochain jour ouvré, pour ne jamais publier une date qui ne veut
  // plus rien dire.
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    if (!joursFermes.includes((d.getDay() + 6) % 7)) return iso(d);
    d.setDate(d.getDate() + 1);
  }
  return iso(new Date());
}

// Une commande entre en production dès qu'elle est confirmée par vous.
const RETENUS = ["confirmee", "en production", "prete"];

async function publierProduction() {
  try {
    const date = prochaineLivraison();
  const totaux = {}, noms = {};

  commandes
    .filter(c => c.date_retrait === date && RETENUS.includes(c.statut))
    .forEach(c => (c.panier || []).forEach(l => {
      const code = codeLigne(l);
      if (!code) { console.warn("Ligne sans code produit :", l.nom); return; }
      totaux[code] = (totaux[code] || 0) + (l.qte || 0);
      noms[code] = l.nom || code;
    }));

    const nbAbos = commandes.filter(c =>
      c.date_retrait === date && c.abonnement_id && RETENUS.includes(c.statut)).length;

    await setDoc(doc(db, "production", "commandes_boutique"), {
      date, totaux, noms,
      nb_commandes: commandes.filter(c => c.date_retrait === date && RETENUS.includes(c.statut)).length,
      nb_abonnements: nbAbos,
      maj: new Date().toISOString()
    });
    console.log("Production publiée :", date, totaux, "dont", nbAbos, "abonnement(s)");
  } catch (e) {
    console.error("Publication production", e);
    signaler("Publication vers l'ERP impossible.", "err");
  }
}


/* ---------- Charge de production ----------
   La vitrine ne peut pas additionner les commandes des autres clients :
   depuis les règles Firestore, chacun ne lit que les siennes. On publie donc,
   pour chaque jour à venir, ce qui est déjà commandé par produit — un document
   par date, en lecture publique.

   Le checkout incrémente ces compteurs au moment de la commande, mais c'est
   ici que se fait la vérité : à chaque ouverture de cette page, tout est
   recalculé depuis les commandes réelles. Un incrément manqué, une annulation,
   une modification à la main : tout se corrige tout seul.

   Attention au filtre : contrairement à la production, une commande reçue mais
   pas encore confirmée occupe déjà le four. Elle compte donc. */
const OCCUPANTS = ["nouvelle", "confirmee", "en production", "prete"];

// Deux inventaires identiques doivent produire le même texte, quel que soit
// l'ordre d'insertion des produits : sinon on réécrit pour rien.
function empreinte(produits) {
  return JSON.stringify(Object.keys(produits).sort().map(k => [k, produits[k]]));
}

async function publierCharges() {
  try {
    const aujourdhui = iso(new Date());

    // Un inventaire vide par jour de la fenêtre : les jours sans commande
    // doivent être publiés à zéro, sinon une annulation laisserait
    // l'ancienne charge en place.
    const parJour = {};
    for (let i = 0; i <= FENETRE_JOURS; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      parJour[iso(d)] = {};
    }

    commandes.forEach(c => {
      const jour = parJour[c.date_retrait];
      if (!jour || !OCCUPANTS.includes(c.statut)) return;
      (c.panier || []).forEach(l => {
        const code = codeLigne(l);
        if (!code) return;
        jour[code] = (jour[code] || 0) + (Number(l.qte) || 0);
      });
    });

    const s = await getDocs(collection(db, "charge"));
    const publie = {};
    s.forEach(d => publie[d.id] = d.data());

    const paquet = writeBatch(db);
    let ecrits = 0;

    Object.entries(parJour).forEach(([date, produits]) => {
      const avant = publie[date] ? (publie[date].produits || {}) : null;
      if (avant && empreinte(avant) === empreinte(produits)) return;   // inchangé
      paquet.set(doc(db, "charge", date),
                 { date, produits, maj: new Date().toISOString() });
      ecrits++;
    });

    // Les jours passés n'intéressent plus personne : on garde la collection courte.
    Object.keys(publie).forEach(date => {
      if (date < aujourdhui) { paquet.delete(doc(db, "charge", date)); ecrits++; }
    });

    if (ecrits) await paquet.commit();
    console.log("Charges publiées :", ecrits, "jour(s) mis à jour.");
  } catch (e) {
    console.error("Publication des charges", e);
    signaler("Publication des capacités impossible.", "err");
  }
}

/* ---------- Décompte du stock ----------
   Confirmer une commande retire ses pièces du stock ; l'annuler les rend.
   Le drapeau stock_deduit évite tout double décompte. */
function ajustementsStock(c, nouveauStatut) {
  const dejaDeduit = !!c.stock_deduit;
  const doitDeduire = nouveauStatut === "confirmee" && !dejaDeduit;
  const doitRendre  = nouveauStatut === "annulee" && dejaDeduit;
  if (!doitDeduire && !doitRendre) return null;

  const signe = doitDeduire ? -1 : 1;
  const lignes = (c.panier || [])
    .map(l => Object.assign({}, l, { code: codeLigne(l) }))
    .filter(l => l.code && stockLimite[l.code]);
  return { lignes, signe, drapeau: doitDeduire };
}

// Un crédit annoncé au checkout n'est réellement débité qu'à la confirmation,
// et restitué si la commande est annulée.
function appliquerCredit(paquet, c, nouveauStatut) {
  const montant = Number(c.credit_utilise) || 0;
  if (!montant || !c.compte_uid) return null;

  const deja = !!c.credit_deduit;
  const debiter = nouveauStatut === "confirmee" && !deja;
  const rendre  = nouveauStatut === "annulee" && deja;
  if (!debiter && !rendre) return null;

  const signe = debiter ? -1 : 1;
  paquet.set(doc(collection(db, "comptes", c.compte_uid, "mouvements")), {
    type: debiter ? "depense" : "remboursement",
    montant: signe * montant,
    note: "Commande " + (c.numero || c.id),
    quand: new Date().toISOString(),
    par: auth.currentUser.email
  });
  paquet.update(doc(db, "comptes", c.compte_uid), { solde: increment(signe * montant) });
  return debiter;
}

function appliquerStock(paquet, c, nouveauStatut) {
  const a = ajustementsStock(c, nouveauStatut);
  if (!a) return false;
  a.lignes.forEach(l => {
    paquet.update(doc(db, "boutique_produits", l.code),
      { stock: increment(a.signe * (l.qte || 0)) });
  });
  return a.drapeau;
}


/* ---------- Modification d'une commande ----------
   Ajouter, retirer, changer une quantité, déplacer la date — y compris sur
   un jour de fermeture, pour les commandes spéciales.

   Le prix : les lignes sont recalculées avec la même fonction que la vitrine
   et le checkout, à partir du prix catalogue et de la remise portée par la
   commande. Un article ajouté suit donc le tarif de groupe et le code promo
   comme s'il avait été commandé le jour même.

   Le stock : recalculé automatiquement, mais seulement si la commande a déjà
   été confirmée — avant confirmation, rien n'a été déduit.

   Le crédit : jamais touché. Si le total change alors qu'un crédit a été
   prélevé, l'écart est signalé et se règle à la main depuis la page Crédit. */

// Prix catalogue d'une ligne, avec repli sur le prix facturé si le produit
// a disparu du catalogue.
function prixBaseLigne(l) {
  const code = codeLigne(l);
  const fiche = code ? catalogue[code] : null;
  return fiche ? fiche.prix_vente : (Number(l.prix) || 0);
}

function rayonLigne(l) {
  const code = codeLigne(l);
  return (code && catalogue[code]) ? catalogue[code].rayon : "Other";
}

// Recalcule prix unitaires, sous-total et total d'un panier donné.
function recalculer(c, panier, option) {
  const fiche = c.code_promo
    ? { valeur: c.code_promo.valeur, type: c.code_promo.type,
        rayons: c.code_promo.rayons || [] }
    : null;

  const pourCalcul = panier.map(l => ({
    qte: Number(l.qte) || 0,
    prixBase: prixBaseLigne(l),
    rayon: rayonLigne(l)
  }));

  const calcul = calculerPrix(pourCalcul, Number(c.remise) || 0, fiche);

  const lignes = panier.map(l => ({
    code: codeLigne(l) || l.code || null,
    nom: l.nom,
    qte: Number(l.qte) || 0,
    prix: prixUnitaire(prixBaseLigne(l), Number(c.remise) || 0, calcul.source)
  }));

  // Le mode de livraison peut être changé dans l'écran de modification :
  // sans changement, on retombe sur le tarif déjà enregistré sur la commande.
  const o = option || null;
  const fraisAConfirmer = o ? !!o.tarif_variable : !!c.frais_a_confirmer;
  const frais = fraisAConfirmer ? 0 :
    (o ? (Number(o.tarif) || 0) : (Number(c.frais_livraison) || 0));

  return {
    lignes, calcul,
    sous_total: calcul.sousTotal,
    frais_livraison: frais,
    frais_a_confirmer: fraisAConfirmer,
    total: calcul.sousTotal + frais
  };
}

/* Écarts de stock entre l'ancien et le nouveau panier.
   Positif = pièces à rendre au stock, négatif = pièces à retirer. */
function ecartsStock(avant, apres) {
  const compte = (panier) => {
    const t = {};
    (panier || []).forEach(l => {
      const code = codeLigne(l);
      if (code && stockLimite[code]) t[code] = (t[code] || 0) + (Number(l.qte) || 0);
    });
    return t;
  };
  const a = compte(avant), b = compte(apres);
  const ecarts = {};
  new Set([...Object.keys(a), ...Object.keys(b)]).forEach(code => {
    const d = (a[code] || 0) - (b[code] || 0);
    if (d !== 0) ecarts[code] = d;
  });
  return ecarts;
}

function jourFerme(iso) {
  if (!iso) return false;
  const d = new Date(iso + "T12:00:00");
  return joursFermes.includes((d.getDay() + 6) % 7);
}

/* ---------- Écran de modification ---------- */
function ouvrirModification(c, el) {
  // Copie de travail : rien n'est touché tant que l'on n'enregistre pas.
  let panier = (c.panier || []).map(l => Object.assign({}, l));
  let date = c.date_retrait || "";
  // Mode de livraison en cours d'édition : si la commande utilise une
  // option qui a depuis été supprimée des paramètres boutique, elle reste
  // proposée en tête de liste pour ne pas la perdre silencieusement.
  let optionCourante = optionsRetrait.find(o => o.nom === c.option?.nom) ||
    (c.option?.nom ? { nom: c.option.nom, type: c.option.type,
                        lieu: c.option.lieu, tarif: c.frais_livraison,
                        tarif_variable: c.frais_a_confirmer } : null);
  const optionsProposees = optionCourante &&
    !optionsRetrait.some(o => o.nom === optionCourante.nom)
    ? [optionCourante, ...optionsRetrait] : optionsRetrait;

  const zone = el.querySelector(".edition");
  zone.hidden = false;

  const choixProduits = Object.entries(catalogue)
    .filter(([, f]) => f.publie)
    .sort((a, b) => a[1].nom.localeCompare(b[1].nom))
    .map(([code, f]) => `<option value="${code}">${echapper(f.nom)}</option>`)
    .join("");

  function dessiner() {
    const r = recalculer(c, panier, optionCourante);
    const ecartTotal = r.total - (Number(c.total) || 0);
    const credit = Number(c.credit_utilise) || 0;

    zone.innerHTML = `
      <div class="edit-lignes"></div>

      <div class="edit-ajout">
        <select class="edit-produit">${choixProduits}</select>
        <input type="number" class="edit-qte" min="1" step="1" value="1">
        <button type="button" class="mineur edit-plus">Ajouter</button>
      </div>

      <div class="edit-date">
        <label>Date de retrait</label>
        <input type="date" class="edit-jour" value="${date}">
        <span class="edit-avertit"></span>
      </div>

      <div class="edit-livraison-champ">
        <label>Mode de retrait / livraison</label>
        <select class="edit-livraison">
          ${optionsProposees.map(o => `<option value="${echapper(o.nom)}"${
            optionCourante && o.nom === optionCourante.nom ? " selected" : ""
          }>${echapper(o.nom)}${o.tarif_variable ? " (tarif à confirmer)" :
            (Number(o.tarif) > 0 ? " — " + peso(Number(o.tarif)) : "")}</option>`).join("")}
        </select>
      </div>

      <div class="edit-bilan">
        <div class="l"><span>Sous-total</span><span>${peso(r.sous_total)}</span></div>
        ${r.frais_a_confirmer ? "" : (r.frais_livraison > 0
          ? `<div class="l"><span>${echapper(optionCourante?.nom || "Livraison")}</span>
             <span>${peso(r.frais_livraison)}</span></div>` : "")}
        <div class="l somme"><span>Total</span><span>${peso(r.total)}</span></div>
        ${ecartTotal !== 0
          ? `<div class="l ecart"><span>Écart avec le total actuel</span>
             <span>${ecartTotal > 0 ? "+" : ""}${peso(ecartTotal)}</span></div>` : ""}
        ${credit > 0 && ecartTotal !== 0
          ? `<div class="edit-alerte">${peso(credit)} de crédit ont déjà été
             annoncés sur cette commande. Le solde du client n'est pas modifié :
             réglez l'écart de ${peso(Math.abs(ecartTotal))} à la main depuis la
             page Crédit.</div>` : ""}
        ${c.compte_uid
          ? `<button type="button" class="mineur edit-recalc-tarif" style="margin-top:8px;">
               🔄 Recalculer avec le tarif actuel du compte (${Number(c.remise) || 0}% appliqué ici)
             </button>` : ""}
      </div>

      <div class="edit-actions">
        <button type="button" class="action edit-ok">Enregistrer les modifications</button>
        <button type="button" class="mineur edit-annuler">Annuler</button>
      </div>`;

    // Lignes du panier
    const zl = zone.querySelector(".edit-lignes");
    if (!panier.length) {
      zl.innerHTML = '<div class="edit-vide">Plus aucun article. La commande ne peut pas être vide.</div>';
    } else {
      panier.forEach((l, i) => {
        const ligne = document.createElement("div");
        ligne.className = "edit-l";
        ligne.innerHTML = `
          <span class="n"></span>
          <input type="number" class="q" min="1" step="1" value="${Number(l.qte) || 1}">
          <span class="p">${peso(r.lignes[i].prix * (Number(l.qte) || 0))}</span>
          <button type="button" class="retirer" aria-label="Retirer">✕</button>`;
        ligne.querySelector(".n").textContent = l.nom || codeLigne(l) || "?";
        ligne.querySelector(".q").onchange = (e) => {
          const v = Math.max(1, Number(e.target.value) || 1);
          panier[i].qte = v;
          dessiner();
        };
        ligne.querySelector(".retirer").onclick = () => {
          panier.splice(i, 1);
          dessiner();
        };
        zl.appendChild(ligne);
      });
    }

    // Ajout d'un produit
    zone.querySelector(".edit-plus").onclick = () => {
      const code = zone.querySelector(".edit-produit").value;
      const qte = Math.max(1, Number(zone.querySelector(".edit-qte").value) || 1);
      const fiche = catalogue[code];
      if (!fiche) return;
      const deja = panier.find(l => codeLigne(l) === code);
      if (deja) deja.qte = (Number(deja.qte) || 0) + qte;   // pas de doublon
      else panier.push({ code, nom: fiche.nom, qte, prix: fiche.prix_vente });
      dessiner();
    };

    // Date, y compris un jour de fermeture
    const champJour = zone.querySelector(".edit-jour");
    const avertit = zone.querySelector(".edit-avertit");
    const majAvertissement = () => {
      avertit.textContent = jourFerme(champJour.value)
        ? "Jour de fermeture — autorisé, mais rien d'autre n'est cuit ce jour-là."
        : "";
    };
    majAvertissement();
    champJour.onchange = () => { date = champJour.value; majAvertissement(); };

    // Mode de retrait/livraison
    zone.querySelector(".edit-livraison").onchange = (e) => {
      optionCourante = optionsProposees.find(o => o.nom === e.target.value) || null;
      dessiner();
    };

    zone.querySelector(".edit-annuler").onclick = () => {
      zone.hidden = true;
      zone.innerHTML = "";
    };

    // Le tarif de groupe d'une commande est figé au moment où elle a été
    // créée — un compte réglé après coup ne la rattrape pas tout seul.
    // Ce bouton va chercher le tarif actuel du compte et refait le calcul,
    // sans rien enregistrer avant le clic sur "Enregistrer les modifications".
    const btnRecalc = zone.querySelector(".edit-recalc-tarif");
    if (btnRecalc) {
      btnRecalc.onclick = async () => {
        btnRecalc.disabled = true;
        try {
          const snap = await getDoc(doc(db, "comptes", c.compte_uid));
          const nouvelleRemise = snap.exists() ? (Number(snap.data().remise) || 0) : 0;
          if (nouvelleRemise === (Number(c.remise) || 0)) {
            signaler("Déjà à jour — le compte a la même remise (" + nouvelleRemise + "%).");
          } else {
            c.remise = nouvelleRemise;
            dessiner();
            signaler("Tarif du compte repris : " + nouvelleRemise + "%. Vérifie et enregistre pour appliquer.");
          }
        } catch (e) {
          console.error(e);
          signaler("Impossible de lire le compte.", "err");
        } finally {
          btnRecalc.disabled = false;
        }
      };
    }

    zone.querySelector(".edit-ok").onclick = () =>
      enregistrerModification(c, panier, date, optionCourante);
  }

  dessiner();
}

async function enregistrerModification(c, panier, date, option) {
  if (!panier.length)
    return signaler("Une commande ne peut pas être vide. Annulez-la plutôt.", "err");
  if (!date)
    return signaler("La date de retrait est obligatoire.", "err");

  const r = recalculer(c, panier, option);
  const ecarts = ecartsStock(c.panier, r.lignes);
  // Le stock n'a été touché qu'à la confirmation : avant, il n'y a rien à rendre.
  const toucherStock = !!c.stock_deduit;

  const changeLivraison = option && option.nom !== c.option?.nom;

  const resume = [
    `${(c.panier || []).length} ligne(s) → ${r.lignes.length}`,
    `total ${peso(c.total)} → ${peso(r.total)}`,
    c.date_retrait !== date ? `date ${c.date_retrait} → ${date}` : null,
    changeLivraison ? `mode ${c.option?.nom || "—"} → ${option.nom}` : null,
    toucherStock && Object.keys(ecarts).length
      ? "le stock sera ajusté en conséquence" : null
  ].filter(Boolean).join("\n");

  if (!confirm("Enregistrer ces modifications ?\n\n" + resume)) return;

  try {
    const paquet = writeBatch(db);

    paquet.update(doc(db, "commandes", c.id), {
      panier: r.lignes,
      date_retrait: date,
      remise: Number(c.remise) || 0,
      sous_total: r.calcul.sousTotal,
      sous_total_brut: r.calcul.base,
      remise_montant: r.calcul.economie,
      remise_source: r.calcul.source,
      code_promo: c.code_promo
        ? Object.assign({}, c.code_promo,
            { montant: r.calcul.source === "promo" ? r.calcul.economie : 0 })
        : null,
      option: option
        ? { nom: option.nom, type: option.type, lieu: option.lieu || "" }
        : (c.option || null),
      frais_livraison: r.frais_livraison,
      frais_a_confirmer: r.frais_a_confirmer,
      total: r.total,
      modifiee_le: new Date().toISOString(),
      modifiee_par: auth.currentUser?.email || ""
    });

    if (toucherStock) {
      Object.entries(ecarts).forEach(([code, d]) => {
        paquet.update(doc(db, "boutique_produits", code), { stock: increment(d) });
      });
    }

    await paquet.commit();

    // Mise à jour de la copie locale, sans recharger toute la page.
    c.panier = r.lignes;
    c.date_retrait = date;
    c.sous_total = r.calcul.sousTotal;
    c.total = r.total;
    c.remise_source = r.calcul.source;
    if (option) {
      c.option = { nom: option.nom, type: option.type, lieu: option.lieu || "" };
      c.frais_livraison = r.frais_livraison;
      c.frais_a_confirmer = r.frais_a_confirmer;
    }

    trierCommandes();

    afficher(false);
    publierProduction();
    publierCharges();

    const credit = Number(c.credit_utilise) || 0;
    signaler(credit > 0
      ? "Commande modifiée. Vérifiez le crédit du client, il n'a pas été ajusté."
      : "Commande modifiée.", "ok");
  } catch (e) {
    console.error(e);
    signaler("La modification n'a pas pu être enregistrée.", "err");
  }
}

/* L'adresse imprimée sur l'étiquette de livraison vient de la fiche client
   quand elle existe, pas de ce que le client a tapé au checkout.

   Les deux divergent souvent : au checkout on reçoit « unit 4b near the church
   tondo », sur la fiche l'adresse a été nettoyée à la main pour que la
   géolocalisation tombe juste. C'est la version nettoyée que le motard doit
   lire, et c'est aussi celle qui correspond au point GPS envoyé à Lalamove.

   Repli sur l'adresse de la commande si la fiche n'existe pas ou n'a pas
   d'adresse : mieux vaut le texte brut qu'une étiquette vide. Les retraits ne
   sont pas concernés, ils n'impriment pas d'adresse.

   La substitution se fait sur une copie : la commande en base garde ce que le
   client a demandé ce jour-là. */
/* Rappel visible tant que des commandes n'ont pas de fiche client. Compté sur
   toute la collection et non sur la vue courante : le travail à faire ne
   dépend pas de l'écran qu'on regarde. */
function majRappelImport() {
  const zone = $("rappelImport");
  if (!zone) return;
  const sansFiche = commandes.filter(c =>
    c.statut !== "annulee" && ficheAVerifier(c) === "pas encore importé").length;
  zone.hidden = sansFiche === 0;
  if (!zone.hidden) {
    zone.innerHTML = `<b>${sansFiche} commande(s)</b> dont le client n'a pas
      encore de fiche. <a href="clients-admin.html">Importer depuis les
      commandes</a> pour leur poser un tag et un point de livraison.`;
  }
}

/* ---------- Fiche client à compléter ----------
   Même règle que le bloc « À compléter » de l'écran Clients : pas de tag, ou
   une adresse sans point de livraison. C'est le vrai sens de « nouveau
   client » au moment de préparer une commande — non pas son ancienneté, mais
   le fait qu'on ne peut pas encore livrer sans vérifier.

   Une commande dont le téléphone ne correspond à aucune fiche compte aussi :
   c'est le cas le plus courant, il suffit que l'import n'ait pas encore
   tourné. La pastille sert alors de rappel.

   Rend la raison, ou une chaîne vide si tout est en ordre. */
function ficheAVerifier(c) {
  const k = cleTel(c.client?.telephone);
  if (!k) return "";
  const fiche = clients.find(x => cleTel(x.telephone || x.id) === k);
  if (!fiche) return "pas encore importé";
  const manques = [];
  if (!fiche.groupe) manques.push("tag");
  const co = fiche.coordonnees;
  if (fiche.adresse && String(fiche.adresse).trim() && !(co && co.lat && co.lng))
    manques.push("point de livraison");
  return manques.join(" et ");
}

/* ---------- Nom affichable ----------
   Les clients tapent leur nom tout en capitales une fois sur trois, et une
   liste de tournée qui crie est pénible à lire. On corrige à l'affichage
   seulement : la donnée reste ce que le client a écrit, et si une fiche
   porte un nom mis au propre à la main, c'est lui qui s'affiche.

   Uniquement sur un nom entièrement en majuscules — « LE LAY » corrigé en
   « Le Lay » est un gain, mais toucher à « McDonald » ou « van Dijk » serait
   une dégradation, donc ces noms-là sont laissés tels quels.

   Le trait d'union et l'apostrophe coupent les mots, pour que « Jean-Pierre »
   et « O'Brien » reprennent leur majuscule au bon endroit. */
function nomAffichable(n) {
  const t = String(n || "").trim();
  if (!t || t !== t.toUpperCase()) return t;   // pas tout en capitales : intact
  return t.toLowerCase().replace(/\p{L}+/gu, m => m.charAt(0).toUpperCase() + m.slice(1));
}

function nomDe(c) {
  // Le nom de la fiche client l'emporte : c'est celui que vous avez corrigé.
  const k = cleTel(c.client?.telephone);
  const fiche = k ? clients.find(x => cleTel(x.telephone || x.id) === k) : null;
  return nomAffichable((fiche && fiche.nom) || c.client?.nom || "");
}

/* ---------- Adresse à utiliser pour une livraison ----------
   L'adresse portée par la commande est celle tapée au checkout : en
   majuscules, avec la ville écrite deux fois et trois repères de trop. Celle
   de la fiche client a été nettoyée à la main pour que la géolocalisation
   tombe juste et que le motard la lise.

   C'est donc la fiche qui fait foi partout où une adresse sert à livrer —
   étiquettes, panneau de tournée, course Lalamove — et non seulement à
   l'impression comme c'était le cas jusqu'ici. Une correction faite dans le
   fichier clients doit se voir immédiatement, sinon on la refait dix fois.

   Deux exceptions : l'adresse ponctuelle, où le client a demandé une
   livraison ailleurs pour cette fois, et la fiche sans adresse, où le texte
   brut vaut mieux que rien. */
function adresseLivraison(c) {
  if (c.client?.adresse_ponctuelle) return c.client?.adresse || "";
  const k = cleTel(c.client?.telephone);
  const fiche = k ? clients.find(x => cleTel(x.telephone || x.id) === k) : null;
  const surFiche = fiche ? String(fiche.adresse || "").trim() : "";
  return surFiche || c.client?.adresse || "";
}

function pourEtiquette(c) {
  if (c.option?.type !== "livraison") return c;
  const a = adresseLivraison(c);
  if (!a || a === c.client?.adresse) return c;
  return { ...c, client: { ...c.client, adresse: a } };
}
