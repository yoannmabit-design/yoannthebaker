<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoann's French Bakery — Order online</title>
<meta name="description" content="Authentic French artisan bread and pastries, baked to order in Manila.">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
  :root{
    --creme:#fdf6ec;
    --papier:#fffdf9;
    --encre:#1a1a1a;
    --encre-doux:#6b6157;
    --trait:#e2d7c6;
    --accent:#2f4858;
    --epuise:#9a9188;
    --r:6px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:96px;
  }

  /* ---------- En-tête ---------- */
  .banniere{
    background:var(--encre);color:var(--creme);
    padding:30px 20px;text-align:center;
  }
  .banniere .logo{
    width:112px;height:112px;border-radius:50%;
    object-fit:contain;background:var(--creme);
    display:block;margin:0 auto 18px;
  }
  .banniere h1{
    font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;
    font-size:clamp(27px,7vw,40px);font-weight:400;
    margin:0;letter-spacing:.015em;
  }
  .banniere .lien-compte{
    display:inline-block;margin:14px 4px 0;color:var(--creme);
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;border:1px solid rgba(253,246,236,.35);
    padding:7px 15px;border-radius:var(--r);
  }
  .banniere .sous{
    margin:9px 0 0;font-size:12.5px;letter-spacing:.19em;
    text-transform:uppercase;opacity:.72;
  }
  .avis{
    background:#f3e8d5;border-bottom:1px solid var(--trait);
    padding:13px 20px;text-align:center;font-size:14.5px;color:#4a4038;
  }
  .vacances{
    background:var(--papier);border-bottom:1px solid var(--trait);
    padding:26px 20px;text-align:center;
  }
  .vacances img{
    display:block;max-width:320px;width:100%;height:auto;margin:0 auto 16px;
    border-radius:var(--r);
  }
  .vacances .titre{
    font-family:"Iowan Old Style",Georgia,serif;font-size:21px;margin:0 0 8px;
  }
  .vacances p{margin:0;font-size:15.5px;color:var(--encre-doux);
    max-width:460px;margin-inline:auto;line-height:1.5}

  main{max-width:760px;margin:0 auto;padding:22px 16px 30px}
  .reprise{
    background:#f2f6f8;border-bottom:1px solid var(--trait);
    padding:14px 18px;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap;justify-content:center;font-size:14.5px;
  }
  .reprise button{
    background:var(--accent);color:#fff;border:none;padding:9px 16px;
    border-radius:var(--r);font-size:14.5px;font-weight:600;cursor:pointer;
  }
  .rayons{
    display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:12px 16px;background:var(--papier);
    border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:5;
  }
  .rayons a{
    white-space:nowrap;text-decoration:none;color:var(--encre-doux);
    font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid var(--trait);border-radius:20px;padding:7px 15px;
  }
  .rayons a:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- Catégories ---------- */
  .categorie{margin-bottom:34px}
  .categorie{scroll-margin-top:64px}
  .categorie h2{
    font-family:"Iowan Old Style",Georgia,serif;
    font-size:20px;font-weight:400;margin:0 0 3px;
  }
  .categorie .filet{height:1px;background:var(--trait);margin-bottom:16px}

  /* ---------- Produit ---------- */
  .produit{
    display:flex;gap:14px;align-items:center;
    padding:14px 0;border-bottom:1px solid var(--trait);
  }
  .produit:last-child{border-bottom:none}
  .produit img{
    width:66px;height:66px;object-fit:cover;border-radius:var(--r);
    background:#efe6d8;flex-shrink:0;
  }
  .infos{flex:1;min-width:0}
  .infos .nom{font-weight:600;font-size:16px}
  .infos .desc{
    font-size:13.5px;color:var(--encre-doux);margin-top:2px;
  }
  .infos .prix{font-size:15px;margin-top:5px}
  .produit.indispo{opacity:.55}
  .indispo .etiquette{
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--epuise);margin-top:5px;
  }

  /* ---------- Compteur ---------- */
  .compteur{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .compteur button{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--trait);background:var(--papier);
    font-size:19px;line-height:1;color:var(--encre);cursor:pointer;
  }
  .compteur button:active{background:var(--trait)}
  .compteur button:disabled{opacity:.3;cursor:default}
  .compteur .n{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .ajouter{
    border:1px solid var(--accent);background:transparent;color:var(--accent);
    padding:9px 17px;border-radius:var(--r);font-size:14.5px;
    font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .ajouter:active{background:var(--accent);color:#fff}

  /* ---------- Panier ---------- */
  .panier{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--encre);color:var(--creme);
    padding:14px 18px;display:flex;align-items:center;gap:14px;
    transform:translateY(110%);transition:transform .22s ease;
  }
  .panier.visible{transform:translateY(0)}
  .panier .resume{flex:1;min-width:0}
  .panier .articles{font-size:13px;opacity:.75}
  .panier .total{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .panier button{
    background:var(--creme);color:var(--encre);border:none;
    padding:13px 22px;border-radius:var(--r);
    font-size:15.5px;font-weight:600;cursor:pointer;
  }

  /* ---------- Code promo ---------- */
  .promo{
    max-width:760px;margin:0 auto 26px;padding:16px;
    background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);
  }
  .promo .titre{
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--encre-doux);margin:0 0 10px;
  }
  .promo .saisie{display:flex;gap:9px;flex-wrap:wrap}
  .promo input{
    flex:1;min-width:150px;padding:11px 12px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:15px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--encre);
  }
  .promo button{
    background:var(--accent);color:#fff;border:none;padding:11px 20px;
    border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;
  }
  .promo button:disabled{opacity:.5;cursor:default}
  .promo .etat{margin:10px 0 0;font-size:14px;color:var(--encre-doux)}
  .promo .etat.ok{color:#3d6b3d}
  .promo .etat.err{color:#8c2f22}
  .promo .etat a{color:var(--accent)}
  .promo .retirer{
    background:none;border:none;color:var(--accent);padding:0;
    font-size:14px;text-decoration:underline;cursor:pointer;margin-left:8px;
  }
  .panier .economie{font-size:12.5px;opacity:.8}

  .message{padding:52px 20px;text-align:center;color:var(--encre-doux)}
  footer{
    text-align:center;padding:24px 20px 34px;
    font-size:13px;color:var(--encre-doux);
  }
  @media (prefers-reduced-motion:reduce){
    .panier{transition:none}
  }
  @media (max-width:420px){
    .produit img{width:56px;height:56px}
    .compteur button{width:36px;height:36px}
  }
</style>
</head>
<body>

<div class="banniere">
  <img class="logo" src="logo.jpg" alt="Yoann's French Bakery"
       onerror="this.remove()">
  <h1>Yoann's French Bakery</h1>
  <p class="sous">Baked to order in Manila</p>
  <a class="lien-compte" href="compte.html">My account</a>
  <a class="lien-compte" href="abonnement.html">Bread plan</a>
</div>

<div class="vacances" id="vacances" hidden></div>
<div class="avis" id="avis" hidden></div>

<nav class="rayons" id="rayons" hidden></nav>

<div class="reprise" id="reprise" hidden></div>

<main id="catalogue">
  <div class="message">Loading the bakery…</div>
</main>

<section class="promo" id="promo" hidden>
  <p class="titre">Promo code</p>
  <div class="saisie">
    <input type="text" id="champCode" placeholder="Enter your code"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           aria-label="Promo code">
    <button type="button" id="btnCode">Apply</button>
  </div>
  <p class="etat" id="etatPromo"></p>
</section>

<footer id="pied"></footer>

<div class="panier" id="panier">
  <div class="resume">
    <div class="articles" id="panierArticles"></div>
    <div class="total" id="panierTotal"></div>
    <div class="economie" id="panierEconomie" hidden></div>
  </div>
  <button id="btnCommander">Checkout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { normaliserCode, lireCodeMemorise, memoriserCode, oublierCode,
         chargerCode, verifierCode, calculerPrix, prixUnitaire, libelleCode,
         RAYONS, rayonDe, libellePortee }
  from "./promo.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const appF = initializeApp(firebaseConfig);
const db   = getFirestore(appF);
const auth = getAuth(appF);
const $  = (id) => document.getElementById(id);

/* Rayons de la vitrine : la liste et le repli viennent du module partagé,
   pour que le classement du catalogue et la portée des codes promo
   reposent sur la même règle. */
const ORDRE = RAYONS;
const rayon = rayonDe;

let produits = [];
let panier   = {};   // { idProduit: quantité }
let ferme    = false;   // mode vacances
let remise   = 0;       // tarif de groupe du client connecté, en pourcentage
let connecte = false;   // un code promo suppose un compte
let promo    = null;    // fiche du code promo appliqué
let sourceRemise = "aucune";   // "groupe" | "promo" | "aucune"

/* ---------- Panier conservé sur l'appareil du client ---------- */
function chargerPanier() {
  try { panier = JSON.parse(localStorage.getItem("panier") || "{}"); }
  catch { panier = {}; }
}
function sauverPanier() {
  try { localStorage.setItem("panier", JSON.stringify(panier)); } catch {}
}

const peso = (n) => "₱" + Number(n).toLocaleString("en-PH");

// Le prix affiché par produit dépend de la remise retenue : au tarif de
// groupe la réduction est dans la ligne, avec un code promo elle porte
// sur le total et les lignes gardent leur prix catalogue.
function prixClient(p) {
  return prixUnitaire(p.prix_vente, remise, sourceRemise);
}

// Lignes du panier, dans la forme attendue par le module de calcul.
function lignesPanier() {
  const l = [];
  produits.forEach(p => {
    const q = panier[p.id];
    if (q) l.push({ qte: q, prixBase: Number(p.prix_vente) || 0, rayon: rayon(p) });
  });
  return l;
}

/* ---------- Chargement ---------- */
async function demarrer() {
  chargerPanier();
  try {
    const [params, catalogue] = await Promise.all([
      getDoc(doc(db, "parametres", "boutique")),
      getDocs(collection(db, "boutique_produits"))
    ]);

    if (params.exists()) {
      const p = params.data();

      const vac = p.vacances || {};
      ferme = !!vac.actif;
      if (ferme) {
        const zone = $("vacances");
        zone.innerHTML =
          (vac.image ? `<img src="${vac.image}" alt="" onerror="this.remove()">` : "") +
          '<p class="titre">We are closed at the moment</p><p></p>';
        zone.querySelector("p:last-child").textContent =
          vac.message || "Online orders are paused. Thank you for your patience.";
        zone.hidden = false;
      }

      if (p.message_accueil) {
        $("avis").textContent = p.message_accueil;
        $("avis").hidden = false;
      }
      if (p.whatsapp) {
        $("pied").innerHTML =
          'Questions? <a href="https://wa.me/' + p.whatsapp +
          '" style="color:#2f4858">Message us on WhatsApp</a>';
      }
    }

    produits = [];
    catalogue.forEach(s => {
      const d = s.data();
      if (d.visible === false) return;
      produits.push({ id: s.id, ...d });
    });

    // Le panier peut contenir des produits retirés depuis la dernière visite.
    Object.keys(panier).forEach(id => {
      const p = produits.find(x => x.id === id);
      if (!p || p.disponible === false) { delete panier[id]; return; }
      const reste = restant(p);
      if (reste !== null) {
        if (reste <= 0) delete panier[id];
        else if (panier[id] > reste) panier[id] = reste;
      }
    });
    sauverPanier();

    afficher();
    proposerDerniere();
  } catch (e) {
    console.error(e);
    $("catalogue").innerHTML =
      '<div class="message">The menu could not be loaded. Please refresh the page.</div>';
  }
}

/* ---------- Reprise de la dernière commande ----------
   Proposée seulement quand le panier est vide : sinon elle gênerait
   plus qu'elle n'aiderait. */
function proposerDerniere() {
  if (ferme || Object.keys(panier).length) return;
  let d = null;
  try { d = JSON.parse(localStorage.getItem("derniere_commande") || "null"); } catch {}
  if (!d || !(d.lignes || []).length) return;

  const encore = d.lignes.filter(l =>
    produits.some(p => p.id === l.id && p.disponible !== false));
  if (!encore.length) return;

  const zone = $("reprise");
  zone.innerHTML = `<span>Same as last time? ${
    encore.map(l => l.qte + " × " + l.nom).join(", ")}</span>
    <button id="btnReprise">Add to basket</button>`;
  zone.hidden = false;

  $("btnReprise").onclick = () => {
    encore.forEach(l => { panier[l.id] = (panier[l.id] || 0) + l.qte; });
    sauverPanier();
    zone.hidden = true;
    afficher();
  };
}

/* ---------- Affichage ---------- */
function afficher() {
  const zone = $("catalogue");

  // La remise retenue décide de l'affichage des prix : on tranche avant
  // de dessiner les lignes.
  sourceRemise = calculerPrix(lignesPanier(), remise, promo).source;

  if (!produits.length) {
    zone.innerHTML =
      '<div class="message">No products available right now. Please check back soon.</div>';
    majPanier();
    return;
  }

  const groupes = {};
  produits.forEach(p => {
    const c = rayon(p);
    (groupes[c] = groupes[c] || []).push(p);
  });

  const cles = Object.keys(groupes).sort((a, b) => {
    const ia = ORDRE.indexOf(a), ib = ORDRE.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
  });

  zone.innerHTML = "";

  // Barre de navigation entre rayons, masquée s'il n'y en a qu'un.
  const barre = $("rayons");
  if (cles.length > 1) {
    barre.innerHTML = cles.map(c =>
      `<a href="#rayon-${c.replace(/\s+/g, "-")}">${c}</a>`).join("");
    barre.hidden = false;
  } else {
    barre.hidden = true;
  }

  cles.forEach(cle => {
    const bloc = document.createElement("section");
    bloc.className = "categorie";
    bloc.id = "rayon-" + cle.replace(/\s+/g, "-");

    const titre = document.createElement("h2");
    titre.textContent = cle;
    bloc.appendChild(titre);
    bloc.insertAdjacentHTML("beforeend", '<div class="filet"></div>');

    groupes[cle]
      .sort((a, b) => a.nom.localeCompare(b.nom))
      .forEach(p => bloc.appendChild(ligneProduit(p)));

    zone.appendChild(bloc);
  });

  majPanier();
}

function restant(p) {
  // null = toujours disponible ; sinon nombre de pièces encore vendables.
  return p.mode_stock === "limite" ? Math.max(0, Number(p.stock) || 0) : null;
}

function ligneProduit(p) {
  const reste = restant(p);
  const dispo = !ferme && p.disponible !== false && (reste === null || reste > 0);
  const el = document.createElement("div");
  el.className = "produit" + (dispo ? "" : " indispo");

  // À défaut d'adresse saisie : photos/<identifiant>.webp, puis .jpg, puis rien.
  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";

  if (p.photo_url) {
    img.src = p.photo_url;
    img.onerror = () => img.remove();
  } else {
    const base = "photos/" + String(p.id).toLowerCase();
    const essais = [".webp", ".jpg", ".jpeg", ".png"].map(e => base + e);
    let n = 0;
    img.onerror = () => {
      n += 1;
      if (n < essais.length) img.src = essais[n];
      else img.remove();
    };
    img.src = essais[0];
  }
  el.appendChild(img);

  const infos = document.createElement("div");
  infos.className = "infos";
  const nom = document.createElement("div");
  nom.className = "nom";
  nom.textContent = p.nom;
  infos.appendChild(nom);

  if (p.description_client) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = p.description_client;
    infos.appendChild(d);
  }

  const prix = document.createElement("div");
  prix.className = "prix";
  if (sourceRemise === "groupe") {
    prix.innerHTML = `<span style="text-decoration:line-through;color:var(--epuise)">${
      peso(p.prix_vente || 0)}</span> <strong>${peso(prixClient(p))}</strong>`;
  } else {
    prix.textContent = peso(p.prix_vente || 0);
  }
  infos.appendChild(prix);

  if (!dispo && !ferme) {
    const e = document.createElement("div");
    e.className = "etiquette";
    e.textContent = "Sold out";
    infos.appendChild(e);
  } else if (reste !== null && reste <= 5) {
    const e = document.createElement("div");
    e.className = "etiquette";
    e.style.color = "var(--accent)";
    e.textContent = "Only " + reste + " left";
    infos.appendChild(e);
  }
  el.appendChild(infos);

  if (dispo) el.appendChild(controle(p));
  return el;
}

function controle(p) {
  const n = panier[p.id] || 0;
  const reste = restant(p);

  if (!n) {
    const b = document.createElement("button");
    b.className = "ajouter";
    b.textContent = "Add";
    b.setAttribute("aria-label", "Add " + p.nom);
    b.onclick = () => { panier[p.id] = 1; apresChangement(); };
    return b;
  }

  const boite = document.createElement("div");
  boite.className = "compteur";

  const moins = document.createElement("button");
  moins.textContent = "−";
  moins.setAttribute("aria-label", "Remove one " + p.nom);
  moins.onclick = () => {
    panier[p.id] > 1 ? panier[p.id]-- : delete panier[p.id];
    apresChangement();
  };

  const compte = document.createElement("span");
  compte.className = "n";
  compte.textContent = n;

  const plus = document.createElement("button");
  plus.textContent = "+";
  plus.setAttribute("aria-label", "Add one " + p.nom);
  plus.disabled = reste !== null && n >= reste;
  plus.onclick = () => { panier[p.id] = n + 1; apresChangement(); };

  boite.append(moins, compte, plus);
  return boite;
}

function apresChangement() {
  sauverPanier();
  afficher();
}

/* ---------- Barre du panier ---------- */
function majPanier() {
  let articles = 0;
  produits.forEach(p => { articles += panier[p.id] || 0; });

  const calcul = calculerPrix(lignesPanier(), remise, promo);
  sourceRemise = calcul.source;

  $("panier").classList.toggle("visible", articles > 0 && !ferme);
  $("panierArticles").textContent = articles + (articles === 1 ? " item" : " items");
  $("panierTotal").textContent = peso(calcul.sousTotal);

  const eco = $("panierEconomie");
  if (calcul.source === "promo") {
    eco.textContent = promo.id + " applied — you save " + peso(calcul.economie);
    eco.hidden = false;
  } else if (calcul.source === "groupe") {
    eco.textContent = "Trade price applied — you save " + peso(calcul.economie);
    eco.hidden = false;
  } else {
    eco.hidden = true;
  }

  majPromo();
}

/* ---------- Code promo ---------- */
function etatPromo(texte, type = "", html = false) {
  const e = $("etatPromo");
  if (html) e.innerHTML = texte; else e.textContent = texte;
  e.className = "etat " + type;
}

function majPromo() {
  const zone = $("promo");
  zone.hidden = ferme;
  if (ferme) return;

  if (!promo) {
    $("champCode").hidden = false;
    $("btnCode").hidden = false;
    if (!connecte && $("champCode").value.trim()) {
      etatPromo('Please <a href="compte.html">sign in</a> to use a promo code.',
                "err", true);
    }
    return;
  }

  // Un code appliqué se remplace par sa ligne d'état.
  $("champCode").hidden = true;
  $("btnCode").hidden = true;

  const calcul = calculerPrix(lignesPanier(), remise, promo);
  const portee = libellePortee(promo);

  let texte;
  if (calcul.source === "promo") {
    texte = promo.id + " applied — " + libelleCode(promo);
  } else if (portee && calcul.eligible === 0) {
    // Le code est bon, le panier ne contient simplement rien du rayon visé.
    texte = promo.id + " applies to " + portee + " only — add " +
            portee.toLowerCase() + " to use it";
  } else {
    texte = promo.id + " saved for later — your trade price is a better deal today";
  }

  etatPromo("", "ok");
  const e = $("etatPromo");
  e.textContent = texte;
  const b = document.createElement("button");
  b.className = "retirer";
  b.type = "button";
  b.textContent = "Remove";
  b.onclick = retirerCode;
  e.appendChild(b);
}

async function appliquerCode() {
  const saisie = normaliserCode($("champCode").value);
  if (!saisie) { etatPromo("Enter a code first.", "err"); return; }

  $("btnCode").disabled = true;
  etatPromo("Checking…");
  try {
    const fiche = await chargerCode(db, saisie);
    const v = verifierCode(fiche, { connecte });
    if (!v.ok) {
      promo = null;
      oublierCode();
      etatPromo(v.connexion
        ? 'Please <a href="compte.html">sign in</a> to use a promo code.'
        : v.message, "err", !!v.connexion);
      afficher();
      return;
    }
    promo = fiche;
    memoriserCode(fiche.id);
    $("champCode").value = "";
    afficher();
  } catch (e) {
    console.error(e);
    etatPromo("We couldn't check that code. Please try again.", "err");
  } finally {
    $("btnCode").disabled = false;
  }
}

function retirerCode() {
  promo = null;
  oublierCode();
  $("champCode").value = "";
  etatPromo("");
  afficher();
}

$("btnCode").onclick = appliquerCode;
$("champCode").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); appliquerCode(); }
});

/* Le code saisi lors d'une visite précédente est revérifié sur le serveur :
   il a pu être désactivé entre-temps. */
async function reprendreCode() {
  const memorise = lireCodeMemorise();
  if (!memorise) { majPromo(); return; }
  try {
    const fiche = await chargerCode(db, memorise);
    const v = verifierCode(fiche, { connecte });
    promo = v.ok ? fiche : null;
    if (!v.ok && !v.connexion) oublierCode();   // un code refusé faute de compte est gardé
  } catch (e) {
    console.error(e);
    promo = null;
  }
  afficher();
}

$("btnCommander").onclick = () => {
  window.location.href = "checkout.html";
};

onAuthStateChanged(auth, async (user) => {
  remise = 0;
  connecte = !!user;
  if (user) {
    try {
      const s = await getDoc(doc(db, "comptes", user.uid));
      remise = Number(s.data()?.remise) || 0;
    } catch (e) { console.error(e); }
  } else {
    promo = null;   // sans compte, aucun code ne s'applique
  }
  // Le code est revérifié à chaque changement d'état : la connexion peut
  // arriver après le premier affichage.
  await reprendreCode();
  if (produits.length) afficher();   // les prix changent si la remise arrive après
  if (remise > 0) {
    const b = $("avis");
    b.textContent = "Your " + remise + "% trade price is applied.";
    b.hidden = false;
  }
});

demarrer();
</script>
