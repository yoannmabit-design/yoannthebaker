  if (validees.length) {
    message += `\n\n${validees.length} commande(s) déjà validée(s) : le stock et ` +
      "les avoirs déjà décomptés ne seront pas rendus.";
  }
  if (issuesAbo.length) {
    message += `\n\n${issuesAbo.length} commande(s) d'abonnement : l'échéance reste ` +
      "planifiée, la commande sera regénérée au prochain chargement. Sautez " +
      "l'échéance dans Abonnements pour l'éviter.";
  }
  if (!confirm(message)) return;

  $("lotSupprimer").disabled = true;
  signaler("Suppression…");

  try {
    // Firestore limite un lot à 500 écritures ; on découpe par prudence.
    for (let i = 0; i < ids.length; i += 400) {
      const paquet = writeBatch(db);
      ids.slice(i, i + 400).forEach(id => paquet.delete(doc(db, "commandes", id)));
      await paquet.commit();
    }

    commandes = commandes.filter(c => !selection.has(c.id));
    selection.clear();
    afficher(false);
    publierProduction();
    signaler(ids.length + " commande(s) supprimée(s).", "ok");
  } catch (e) {
    console.error(e);
    signaler("La suppression a échoué.", "err");
  } finally {
    $("lotSupprimer").disabled = false;
  }
};

$("lotAppliquer").onclick = async () => {
  const statut = $("lotStatut").value;
  const paiement = $("lotPaiement").value;
  const ids = [...selection];
  if (!ids.length || (!statut && !paiement)) return;

  const quoi = [statut ? LIBELLES[statut] : null, paiement ? PAIEMENTS[paiement] : null]
    .filter(Boolean).join(" et ");
  if (!confirm(`Appliquer « ${quoi} » à ${ids.length} commande(s) ?`)) return;

  $("lotAppliquer").disabled = true;
  signaler("Application…");

  try {
    // Firestore limite un lot à 500 écritures ; on découpe par prudence.
    for (let i = 0; i < ids.length; i += 400) {
      const paquet = writeBatch(db);
      ids.slice(i, i + 400).forEach(id => {
        const c = commandes.find(x => x.id === id);
        const champs = {};
        if (statut)   champs.statut = statut;
        if (paiement) champs["paiement.statut"] = paiement;
        if (statut && c) {
          const a = ajustementsStock(c, statut);
          if (a) champs.stock_deduit = appliquerStock(paquet, c, statut);
          const credit = appliquerCredit(paquet, c, statut);
          if (credit !== null) champs.credit_deduit = credit;
        }
        paquet.update(doc(db, "commandes", id), champs);
      });
      await paquet.commit();
    }

    ids.forEach(id => {
      const c = commandes.find(x => x.id === id);
      if (!c) return;
      if (statut) {
        const a = ajustementsStock(c, statut);
        if (a) c.stock_deduit = a.drapeau;
        c.statut = statut;
      }
      if (paiement) { c.paiement = c.paiement || {}; c.paiement.statut = paiement; }
    });

    // Les échéances d'abonnement suivent, une par une : chacune peut toucher
    // un compte différent, elles ne tiennent pas dans un lot commun.
    if (statut && SUITE_ECHEANCE[statut]) {
      for (const id of ids) {
        const c = commandes.find(x => x.id === id);
        if (c) await lierEcheance(c, statut);
      }
    }

    /* Remboursement par lot : chaque commande se traite une par une, avec sa
       propre confirmation. Poser la question globalement reviendrait à
       créditer en bloc des clients aux situations différentes — l'un payé,
       l'autre pas, un troisième sans compte. */
    if (paiement === "rembourse") {
      for (const id of ids) {
        const c = commandes.find(x => x.id === id);
        if (c) await proposerRemboursement(c);
      }
    }

    selection.clear();
    $("lotStatut").value = "";
    $("lotPaiement").value = "";
    afficher(false);
    publierProduction();
    publierCharges();
    signaler(ids.length + " commande(s) mise(s) à jour.", "ok");
  } catch (e) {
    console.error(e);
    signaler("Échec de la mise à jour groupée.", "err");
    majBoutonLot();
  }
};


/* ---------- Liaison commande → abonnement ----------
   Une commande d'abonnement porte abonnement_id et abonnement_rang : elle sait
   donc à quelle échéance elle correspond. Changer son statut ici met l'échéance
   à jour, pour ne pas avoir à refaire le même geste sur la page Abonnements.

     remise  → échéance livrée
     annulee → échéance sautée

   Un seul sens : la commande commande. La page Abonnements reste libre de
   marquer une livraison à la main, ce qui n'écrase rien ici.

   L'argent suit la livraison, comme sur la page Abonnements : quand
   l'abonnement est payé sur le crédit, marquer livré prélève le montant et
   inscrit le mouvement. Le drapeau echeance_appliquee évite tout double
   prélèvement si le statut est remis deux fois. */
const SUITE_ECHEANCE = { "remise": "livree", "annulee": "sautee" };

async function lierEcheance(c, nouveauStatut) {
  const suite = SUITE_ECHEANCE[nouveauStatut];
  if (!c.abonnement_id || !c.abonnement_rang || !suite) return;
  if (c.echeance_appliquee === suite) return;          // déjà fait

  try {
    const ref = doc(db, "abonnements", c.abonnement_id);
    const s = await getDoc(ref);
    if (!s.exists()) return;
    const a = s.data();

    // Le rang est de 1 à n ; l'échéance est à l'index rang − 1.
    const i = Number(c.abonnement_rang) - 1;
    const liste = a.echeances || [];
    if (!liste[i]) return;
    if (liste[i].statut === suite) {                   // déjà à jour côté abonnement
      await updateDoc(doc(db, "commandes", c.id), { echeance_appliquee: suite });
      c.echeance_appliquee = suite;
      return;
    }

    const echeances = liste.map((e, n) => n === i
      ? (suite === "livree"
          ? { ...e, statut: "livree", livree_le: new Date().toISOString() }
          : { ...e, statut: "sautee" })
      : e);

    const paquet = writeBatch(db);
    paquet.update(ref, { echeances });

    // Prélèvement du crédit, à l'identique de la page Abonnements.
    const surCredit = a.paiement?.mode === "credit";
    const montant = Number(a.total_par_livraison) || 0;
    if (suite === "livree" && surCredit && montant > 0 && a.client?.uid) {
      paquet.set(doc(collection(db, "comptes", a.client.uid, "mouvements")), {
        type: "depense", montant: -montant,
        note: "Livraison du " + liste[i].date,
        quand: new Date().toISOString(), par: auth.currentUser?.email || ""
      });
      paquet.update(doc(db, "comptes", a.client.uid), { solde: increment(-montant) });
    }

    // Plus aucune échéance planifiée : l'abonnement est terminé.
    if (!echeances.some(e => e.statut === "planifiee"))
      paquet.update(ref, { statut: "termine" });

    paquet.update(doc(db, "commandes", c.id), { echeance_appliquee: suite });
    await paquet.commit();
    c.echeance_appliquee = suite;

    signaler("Échéance d'abonnement mise à jour (" + suite + ").", "ok");
  } catch (e) {
    // La commande, elle, est bien enregistrée : on ne la fait pas échouer.
    console.error("Liaison échéance", e);
    signaler("Commande enregistrée, mais l'échéance d'abonnement n'a pas suivi.", "err");
  }
}

/* ---------- Passage en « Remboursé » ----------
   Le crédit qui avait servi à payer la commande est restitué tout seul par
   appliquerCredit() à l'annulation. L'argent réellement encaissé, lui, ne
   l'est pas : il a quitté GCash ou la banque, rien dans la base ne le sait.

   La FAQ promet au client que le montant revient en crédit sur son compte.
   Cette promesse ne tient que si vous y pensez, et c'est exactement le genre
   d'oubli qui se remarque du côté du client avant le vôtre.

   Le déclencheur est le statut de paiement « Remboursé », et non l'annulation :
   un article manquant ou une erreur de tarif se rembourse sans rien annuler,
   et une commande annulée n'a pas toujours été encaissée. Le geste dit
   l'intention, l'annulation non.

   Rien n'est jamais écrit en silence : il arrive qu'on rembourse en espèces.

   Rend true si un mouvement a été écrit. */
async function proposerRemboursement(c) {
  const paye = Number(c.paiement?.montant_paye) || 0;
  /* Montant à rendre. Si le paiement est marqué payé sans montant saisi, on
     retient le total de la commande : c'est le cas courant, et la question
     laisse le dernier mot. */
  const encaisse = paye > 0 ? paye : (Number(c.total) || 0);
  // Le crédit déjà consommé revient par son propre chemin à l'annulation : on
  // ne rembourse ici que la part payée en argent, sinon le client serait
  // crédité deux fois du même montant.
  const enArgent = Math.max(0, encaisse - (Number(c.credit_utilise) || 0));
  if (enArgent <= 0) return false;
  if (c.remboursee) return false;   // déjà fait, on ne repasse pas dessus

  if (!c.compte_uid) {
    signaler(peso(enArgent) + " à rembourser, mais aucun compte client " +
      "rattaché à cette commande : à régler depuis Crédit.", "err");
    return false;
  }

  if (!confirm(`Remettre ${peso(enArgent)} en crédit sur le compte de ` +
               `${nomDe(c) || "ce client"} ?\n\n` +
               (paye > 0 ? "" : "Aucun montant encaissé n'était saisi : c'est le " +
                                "total de la commande qui est repris.\n\n") +
               "Annuler si vous remboursez autrement.")) return false;

  try {
    const paquet = writeBatch(db);
    paquet.set(doc(collection(db, "comptes", c.compte_uid, "mouvements")), {
      type: "remboursement", montant: enArgent,
      note: "Remboursement commande " + (c.numero || c.id),
      quand: new Date().toISOString(), par: auth.currentUser.email
    });
    paquet.update(doc(db, "comptes", c.compte_uid), { solde: increment(enArgent) });
    // Drapeau sur la commande : une seconde annulation ne recrédite pas.
    paquet.update(doc(db, "commandes", c.id), { remboursee: true });
    await paquet.commit();
    c.remboursee = true;
    signaler(peso(enArgent) + " remis en crédit.", "ok");
    return true;
  } catch (e) {
    console.error("Remboursement", e);
    signaler("Le crédit n'a pas pu être écrit — à saisir depuis Crédit.", "err");
    return false;
  }
}

/* ---------- Enregistrement ---------- */
async function enregistrer(c, champs) {
  try {
    if (champs.statut) {
      const paquet = writeBatch(db);
      const deduit = appliquerStock(paquet, c, champs.statut);
      const maj = Object.assign({}, champs);
      const a = ajustementsStock(c, champs.statut);
      if (a) maj.stock_deduit = deduit;
      const credit = appliquerCredit(paquet, c, champs.statut);
      if (credit !== null) maj.credit_deduit = credit;
      paquet.update(doc(db, "commandes", c.id), maj);
      await paquet.commit();
      if (a) c.stock_deduit = deduit;
    } else {
      await updateDoc(doc(db, "commandes", c.id), champs);
    }
    if (champs.statut) {
      c.statut = champs.statut;
      await lierEcheance(c, champs.statut);
    }
    if (champs["paiement.statut"]) {
      c.paiement = c.paiement || {};
      c.paiement.statut = champs["paiement.statut"];
      // Après coup : la commande est déjà enregistrée, un refus ou un échec
      // ici ne la remet pas en cause.
      if (champs["paiement.statut"] === "rembourse") await proposerRemboursement(c);
    }
    if ("paiement.methode" in champs) {
      c.paiement = c.paiement || {};
      c.paiement.methode = champs["paiement.methode"];
    }
    if ("paiement.montant_paye" in champs) {
      c.paiement = c.paiement || {};
      c.paiement.montant_paye = champs["paiement.montant_paye"];
    }
    afficher(false);
    publierProduction();
    signaler("Enregistré");
  } catch (e) {
    console.error(e);
    signaler("Échec de l'enregistrement");
  }
}

let minuteur;
function signaler(texte, type = "") {
  $("etat").textContent = texte;
  $("etat").className = "etat vu " + type;
  clearTimeout(minuteur);
  minuteur = setTimeout(() => $("etat").classList.remove("vu"), 2600);
}

/* ==========================================================
   NOUVELLE COMMANDE (depuis l'admin)
   Pour un client qui commande par téléphone ou en personne. Réutilise
   volontairement les mêmes briques que l'écran de modification
   (recalculer via calculerPrix/prixUnitaire, options de retrait,
   catalogue) plutôt que dupliquer la logique de prix.

   Statut de départ : "confirmee" directement — c'est vous qui la créez,
   il n'y a rien à confirmer après coup (décision explicite, pas un oubli).

   Code promo : uniquement proposé si le téléphone correspond à un compte
   existant, exactement comme sur la vitrine (verifierCode exige un
   compte — un code est nominatif). Sans compte, tarif plein, comme une
   commande sans compte classique — c'est le même chemin que d'habitude,
   pas un chemin spécial pour l'admin.
   ========================================================== */
let ncPanier = [];
let ncCompte = null;   // compte trouvé par téléphone, ou null
let ncPromo = null;    // fiche du code promo appliqué, ou null

function ncOuvrir() {
  ncPanier = [];
  ncCompte = null;
  ncPromo = null;
  $("nc-tel").value = "";
  $("nc-nom").value = "";
  $("nc-adresse").value = "";
  $("nc-adresse-champ").hidden = true;
  $("nc-compte-etat").textContent = "";
  $("nc-promo").value = "";
  $("nc-promo-msg").textContent = "";
  $("nc-promo-champ").hidden = true;
  $("nc-date").value = "";
  $("nc-date").min = iso(new Date());

  const choix = Object.entries(catalogue)
    .filter(([, f]) => f.publie)
    .sort((a, b) => a[1].nom.localeCompare(b[1].nom))
    .map(([code, f]) => `<option value="${code}">${echapper(f.nom)}</option>`)
    .join("");
  $("nc-produit").innerHTML = choix;

  $("nc-livraison").innerHTML = optionsRetrait.map((o, i) =>
    `<option value="${i}">${echapper(o.nom)}${o.tarif_variable ? " (tarif à confirmer)" :
      (Number(o.tarif) > 0 ? " — " + peso(Number(o.tarif)) : "")}</option>`).join("");
  ncMajAdresseVisible();

  $("panneauNouvelle").hidden = false;
  ncDessiner();
  $("panneauNouvelle").scrollIntoView({ behavior: "smooth", block: "start" });
}

function ncFermer() {
  $("panneauNouvelle").hidden = true;
}

function ncOptionCourante() {
  return optionsRetrait[Number($("nc-livraison").value) || 0] || null;
}

function ncMajAdresseVisible() {
  const o = ncOptionCourante();
  $("nc-adresse-champ").hidden = !(o && o.demander_adresse);
}

// Recherche par téléphone : ne remplit nom/adresse que si le champ est
// encore vide, pour ne jamais écraser ce que vous êtes en train de taper.
function ncChercherTelephone() {
  const cle = cleTel($("nc-tel").value);
  ncCompte = null;
  $("nc-compte-etat").textContent = "";
  $("nc-promo-champ").hidden = true;

  if (!cle) return;

  const client = clients.find(c => cleTel(c.telephone) === cle);
  if (client) {
    if (!$("nc-nom").value.trim()) $("nc-nom").value = client.nom || "";
    if (!$("nc-adresse").value.trim()) $("nc-adresse").value = client.adresse || "";
  }

  const compte = comptes.find(c => cleTel(c.telephone) === cle);
  if (compte) {
    ncCompte = compte;
    const remise = Number(compte.remise) || 0;
    $("nc-compte-etat").innerHTML =
      `Compte trouvé${compte.groupe ? " — groupe " + echapper(compte.groupe) : ""}` +
      (remise > 0 ? `, remise ${remise}%` : "");
    // Un code promo est nominatif : il ne peut s'appliquer que là où existe
    // un compte à décompter, jamais sur une commande sans compte.
    $("nc-promo-champ").hidden = false;
  } else {
    $("nc-compte-etat").textContent = "Aucun compte à ce numéro — tarif plein, sans code promo (comme une commande sans compte classique).";
  }
  ncDessiner();
}

function ncAjouterLigne() {
  const code = $("nc-produit").value;
  const qte = Math.max(1, parseInt($("nc-qte").value) || 1);
  const f = catalogue[code];
  if (!f) return;

  const existante = ncPanier.find(l => l.code === code);
  if (existante) existante.qte += qte;
  else ncPanier.push({ code, nom: f.nom, qte, prixBase: f.prix_vente, rayon: f.rayon });

  ncDessiner();
}

function ncRetirerLigne(i) {
  ncPanier.splice(i, 1);
  ncDessiner();
}

async function ncAppliquerPromo() {
  const saisie = normaliserCode($("nc-promo").value);
  $("nc-promo-msg").textContent = "";
  ncPromo = null;

  if (!saisie) { ncDessiner(); return; }
  if (!ncCompte) {
    $("nc-promo-msg").textContent = "Un compte est nécessaire pour appliquer un code.";
    return;
  }

  try {
    const fiche = await chargerCode(db, saisie);
    const usages = await usagesClient(db, ncCompte.id, saisie, { collection, query, where, getDocs, limit });
    const v = verifierCode(fiche, { connecte: true, usages });
    if (!v.ok) {
      $("nc-promo-msg").textContent = v.message;
      ncDessiner();
      return;
    }
    ncPromo = fiche;
    $("nc-promo-msg").textContent = "Code appliqué.";
  } catch (e) {
    console.error(e);
    $("nc-promo-msg").textContent = "Vérification impossible.";
  }
  ncDessiner();
}

// Même calcul que recalculer() pour une commande existante, adapté à un
// panier qui n'a pas encore de commande derrière lui.
function ncCalculer() {
  const remise = ncCompte ? (Number(ncCompte.remise) || 0) : 0;
  const fiche = ncPromo
    ? { valeur: ncPromo.valeur, type: ncPromo.type, rayons: ncPromo.rayons || [] }
    : null;

  const pourCalcul = ncPanier.map(l => ({ qte: l.qte, prixBase: l.prixBase, rayon: l.rayon }));
  const calcul = calculerPrix(pourCalcul, remise, fiche);

  const lignes = ncPanier.map(l => ({
    code: l.code, nom: l.nom, qte: l.qte,
    prix: prixUnitaire(l.prixBase, remise, calcul.source)
  }));

  const o = ncOptionCourante();
  const fraisAConfirmer = !!(o && o.tarif_variable);
  const frais = fraisAConfirmer ? 0 : (o ? (Number(o.tarif) || 0) : 0);

  return {
    lignes, calcul, remise,
    sous_total: calcul.sousTotal,
    frais_livraison: frais,
    frais_a_confirmer: fraisAConfirmer,
    total: calcul.sousTotal + frais
  };
}

function ncDessiner() {
  const zl = $("nc-lignes");
  if (!ncPanier.length) {
    zl.innerHTML = '<div class="edit-vide">Aucun article pour l\'instant.</div>';
  } else {
    zl.innerHTML = "";
    ncPanier.forEach((l, i) => {
      const ligne = document.createElement("div");
      ligne.className = "edit-l";
      ligne.innerHTML = `
        <span class="n"></span>
        <input type="number" class="q" min="1" step="1" value="${l.qte}">
        <span class="p"></span>
        <button type="button" class="retirer" title="Retirer">✕</button>`;
      ligne.querySelector(".n").textContent = l.nom;
      ligne.querySelector(".q").onchange = (e) => {
        l.qte = Math.max(1, parseInt(e.target.value) || 1);
        ncDessiner();
      };
      ligne.querySelector(".retirer").onclick = () => ncRetirerLigne(i);
      zl.appendChild(ligne);
    });
  }
  ncMajAdresseVisible();

  const r = ncCalculer();
  ncPanier.forEach((l, i) => {
    const p = zl.children[i]?.querySelector(".p");
    if (p) p.textContent = peso(r.lignes[i].prix * r.lignes[i].qte);
  });

  $("nc-bilan").innerHTML = `
    <div class="l"><span>Sous-total</span><span>${peso(r.sous_total)}</span></div>
    ${r.frais_a_confirmer ? "" : (r.frais_livraison > 0
      ? `<div class="l"><span>${echapper(ncOptionCourante()?.nom || "Livraison")}</span>
         <span>${peso(r.frais_livraison)}</span></div>` : "")}
    <div class="l somme"><span>Total</span><span>${peso(r.total)}</span></div>`;

  const avertit = $("nc-avertit");
  avertit.textContent = jourFerme($("nc-date").value) ? "Jour habituellement fermé." : "";
}

async function ncCreer() {
  const nom = $("nc-nom").value.trim();
  const tel = $("nc-tel").value.replace(/\D/g, "");
  const o = ncOptionCourante();
  const date = $("nc-date").value;

  if (nom.length < 2) return signaler("Le nom est trop court.", "err");
  if (tel.length < 10) return signaler("Le numéro de téléphone est incomplet.", "err");
  if (!ncPanier.length) return signaler("Ajoutez au moins un article.", "err");
  if (!date) return signaler("Choisissez une date de retrait.", "err");
  if (!o) return signaler("Choisissez un mode de retrait.", "err");

  const adresseDetail = o.demander_adresse ? { rue: $("nc-adresse").value.trim() } : null;
  const adresse = $("nc-adresse").value.trim();

  const r = ncCalculer();
  const numero = `${String(new Date().getDate()).padStart(2, "0")}${String(new Date().getMonth() + 1).padStart(2, "0")}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

  const commande = {
    numero,
    statut: "confirmee",
    client: { nom, telephone: tel, adresse, adresse_detail: adresseDetail },
    panier: r.lignes,
    remise: r.remise,
    remise_source: ncPromo ? "promo" : (r.remise > 0 ? "groupe" : "aucune"),
    code_promo: ncPromo
      ? { code: ncPromo.id, type: ncPromo.type, valeur: Number(ncPromo.valeur) || 0,
          rayons: Array.isArray(ncPromo.rayons) ? ncPromo.rayons : [] }
      : null,
    compte_uid: ncCompte ? ncCompte.id : "",
    credit_utilise: 0,
    sous_total_brut: ncPanier.reduce((t, l) => t + l.qte * l.prixBase, 0),
    sous_total: r.sous_total,
    frais_livraison: r.frais_livraison,
    frais_a_confirmer: r.frais_a_confirmer,
    total: r.total,
    option: { nom: o.nom, type: o.type, lieu: o.lieu || "" },
    date_retrait: date,
    paiement: { methode: "manuel", statut: "en attente" },
    notes: "Créée depuis l'admin.",
    cree_le: new Date().toISOString()
  };

  try {
    $("nc-creer").disabled = true;
    await setDoc(doc(db, "commandes", numero), commande);
    ncFermer();
    await charger();
    signaler("Commande créée.");
  } catch (e) {
    console.error(e);
    signaler("La création a échoué.", "err");
  } finally {
    $("nc-creer").disabled = false;
  }
}

$("btnNouvelleCommande").onclick = ncOuvrir;
$("nc-annuler").onclick = ncFermer;
$("nc-ajouter").onclick = ncAjouterLigne;
$("nc-tel").onchange = ncChercherTelephone;
$("nc-livraison").onchange = ncDessiner;
$("nc-date").onchange = ncDessiner;
$("nc-promo-appliquer").onclick = ncAppliquerPromo;
$("nc-creer").onclick = ncCreer;
</script>
</body>
</html>
