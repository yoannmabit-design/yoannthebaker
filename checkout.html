<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1a1a1a;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --alerte:#8c2f22;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:110px;
  }
  header{
    background:var(--encre);color:var(--creme);
    padding:15px 18px;display:flex;align-items:center;gap:14px;
  }
  header a{color:var(--creme);text-decoration:none;font-size:22px;line-height:1}
  header h1{font-size:17px;margin:0;font-weight:600}
  main{max-width:620px;margin:0 auto;padding:20px 16px}

  .bloc{
    background:var(--papier);border:1px solid var(--trait);
    border-radius:var(--r);padding:18px;margin-bottom:16px;
  }
  .bloc h2{font-size:15px;margin:0 0 14px;letter-spacing:.01em}

  label.champ{display:block;margin-bottom:13px}
  label.champ span{display:block;font-size:13px;color:var(--encre-doux);margin-bottom:5px}
  input,select,textarea{
    width:100%;padding:12px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font:inherit;font-size:16px;color:var(--encre);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  textarea{min-height:66px;resize:vertical}

  .choix{
    display:flex;align-items:flex-start;gap:11px;padding:13px;
    border:1px solid var(--trait);border-radius:var(--r);
    margin-bottom:9px;cursor:pointer;background:#fff;
  }
  .choix.actif{border-color:var(--accent);background:#f2f6f8}
  .choix input{width:auto;margin-top:3px;flex-shrink:0}
  .choix .corps{flex:1;min-width:0}
  .choix .t{font-weight:600;font-size:15px;display:flex;
    justify-content:space-between;gap:12px}
  .choix .t .tarif{font-weight:400;white-space:nowrap;color:var(--encre-doux)}
  .choix .d{font-size:13px;color:var(--encre-doux);margin-top:3px}
  .choix .j{font-size:12.5px;color:var(--accent);margin-top:4px}

  .choix .qr{display:block;margin-top:11px}
  .choix .qr img{
    display:block;width:172px;max-width:100%;height:auto;
    border:1px solid var(--trait);border-radius:var(--r);background:#fff;
  }
  .choix .qr a{
    display:inline-block;margin-top:7px;font-size:13.5px;color:var(--accent);
  }
  .case.complet{
    color:var(--alerte);opacity:.6;
    text-decoration:line-through;text-decoration-thickness:1px;
  }
  /* Bloc dépliable plutôt qu'infobulle : une infobulle au survol n'existe
     pas sur téléphone, et c'est là que commandent la plupart des clients. */
  .compte-avantages{
    margin-top:14px;border:1px solid var(--trait);border-radius:var(--r);
    background:var(--creme);
  }
  .compte-avantages .tete{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;background:none;border:none;padding:12px 14px;
    font:inherit;font-size:14.5px;font-weight:600;color:var(--accent);
    cursor:pointer;text-align:left;
  }
  .compte-avantages .chevron{transition:transform .15s}
  .compte-avantages .tete[aria-expanded="true"] .chevron{transform:rotate(180deg)}
  .compte-avantages .corps{padding:0 14px 14px}
  .compte-avantages ul{margin:0 0 12px;padding-left:20px;font-size:14.5px;line-height:1.6}
  .compte-avantages .lien-compte{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:10px 18px;border-radius:var(--r);font-size:15px;font-weight:600;
  }
  .compte-avantages .sous{
    margin:9px 0 0;font-size:13px;color:var(--encre-doux);
  }

  .champ .option{font-weight:400;opacity:.65}
  .champ .etiq{display:block;font-size:13px;color:var(--encre-doux);margin-bottom:5px}
  .cal{border:1px solid var(--trait);border-radius:var(--r);background:#fff;padding:11px}
  .cal .tete{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:9px;
  }
  .cal .mois{font-weight:600;font-size:15px}
  .cal .nav{
    width:34px;height:34px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font-size:16px;line-height:1;color:var(--encre);cursor:pointer;
  }
  .cal .nav:disabled{opacity:.3;cursor:default}
  .cal .grille{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .jour-nom{
    text-align:center;font-size:11px;color:var(--encre-doux);
    text-transform:uppercase;letter-spacing:.04em;padding:4px 0;
  }
  .cal .case{
    aspect-ratio:1;border:none;background:transparent;border-radius:var(--r);
    font:inherit;font-size:15px;color:var(--epuise,#b3aaa0);cursor:default;
  }
  .cal .case.libre{color:var(--encre);font-weight:700;cursor:pointer;background:#f4efe6}
  .cal .case.libre:hover{background:#e9e1d4}
  .cal .case.prise{background:var(--accent);color:#fff}
  .cal .case.vide{background:transparent}
  .choisie{font-size:14px;color:var(--accent);margin:9px 0 0;font-weight:600}
  .recap{font-size:15px}
  .recap .l{display:flex;justify-content:space-between;gap:14px;padding:5px 0}
  .recap .l.somme{
    border-top:1px solid var(--trait);margin-top:9px;padding-top:11px;
    font-weight:600;font-size:18px;
  }
  .recap .q{color:var(--encre-doux)}
  .recap .ligne-panier{align-items:center}
  .recap .nom-panier{flex:1;min-width:0}
  .recap .l.remise span:last-child{color:#3d6b3d}
  .promo{margin-top:13px;padding-top:12px;border-top:1px dashed var(--trait)}
  .promo .saisie{display:flex;gap:9px;flex-wrap:wrap}
  .promo input{
    flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:15px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--encre);
  }
  .promo button.appliquer{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;
    border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;
  }
  .promo button.appliquer:disabled{opacity:.5;cursor:default}
  .promo .etat{margin:9px 0 0;font-size:14px;color:var(--encre-doux)}
  .promo .etat.ok{color:#3d6b3d}
  .promo .etat.err{color:var(--alerte)}
  .promo .etat a{color:var(--accent)}
  .promo .retirer{
    background:none;border:none;color:var(--accent);padding:0;margin-left:8px;
    font-size:14px;text-decoration:underline;cursor:pointer;
  }
  .compteur-mini{display:flex;align-items:center;gap:7px}
  .compteur-mini button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--trait);
    background:#fff;font-size:16px;line-height:1;color:var(--encre);cursor:pointer;
  }
  .compteur-mini button:disabled{opacity:.3;cursor:default}
  .compteur-mini .qn{min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
  .ajouter-plus{
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;
    margin-top:12px;padding-top:11px;border-top:1px dashed var(--trait);
  }
  .ajouter-plus a,.ajouter-plus button{
    color:var(--accent);font-size:14.5px;text-decoration:none;
    background:none;border:none;padding:0;cursor:pointer;
  }

  .pied{
    position:fixed;left:0;right:0;bottom:0;background:var(--encre);
    color:var(--creme);padding:13px 18px;display:flex;align-items:center;gap:14px;
  }
  .pied .total{flex:1;font-size:19px;font-weight:600}
  .pied button{
    background:var(--creme);color:var(--encre);border:none;
    padding:14px 22px;border-radius:var(--r);
    font-size:15.5px;font-weight:600;cursor:pointer;
  }
  .pied button:disabled{opacity:.45;cursor:default}

  .erreur{color:var(--alerte);font-size:14px;margin-top:10px}
  .note{font-size:13px;color:var(--encre-doux);margin-top:9px}
  .message{padding:60px 20px;text-align:center;color:var(--encre-doux)}
  .message a{color:var(--accent)}
  .retour{
    background:none;border:none;color:var(--accent);
    font-size:14px;cursor:pointer;padding:0;text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <a href="./" aria-label="Back to the menu">&#8249;</a>
  <h1>Checkout</h1>
</header>

<main id="page">
  <div class="message">Loading your order…</div>
</main>

<div class="pied" id="pied" hidden>
  <span class="total" id="totalPied"></span>
  <button id="btnEnvoyer">Place order</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, increment }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { normaliserCode, lireCodeMemorise, memoriserCode, oublierCode,
         chargerCode, verifierCode, calculerPrix, prixUnitaire, libelleCode,
         rayonDe, libellePortee }
  from "./promo.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const appF = initializeApp(firebaseConfig);
const db   = getFirestore(appF);
const auth = getAuth(appF);
const $  = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n).toLocaleString("en-PH");

const JOURS_COURTS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

let params = {}, options = [], lignes = [], sousTotal = 0;
let remise = 0, uidClient = "", solde = 0, creditUtilise = 0;
let promo = null;              // fiche du code promo appliqué
let sourceRemise = "aucune";   // "groupe" | "promo" | "aucune"
let economie = 0;              // écart avec le tarif catalogue
let eligible = 0;              // part du panier concernée par le code
let adresseCompte = null;      // adresse détaillée enregistrée sur le compte
let charges = {};              // { "2026-08-22": { "BUT-CRO": 12 } }
let capacites = {};            // { "BUT-CRO": 30 } — 0 ou absent = pas de limite
let dateChoisie = "", moisVu = null, dateMin = null;

/* ---------- Démarrage ---------- */
function attendreConnexion() {
  return new Promise(resolve => {
    const stop = onAuthStateChanged(auth, async (user) => {
      stop();
      if (user) {
        uidClient = user.uid;
        try {
          const s = await getDoc(doc(db, "comptes", user.uid));
          remise = Number(s.data()?.remise) || 0;
          solde  = Number(s.data()?.solde) || 0;
          // Adresse détaillée si le compte en a une, sinon l'ancienne ligne.
          adresseCompte = s.data()?.adresse_detail || s.data()?.adresse || null;
        } catch (e) { console.error(e); }
      }
      resolve();
    });
  });
}

let panier = {};

(async function () {
  await attendreConnexion();
  try { panier = JSON.parse(localStorage.getItem("panier") || "{}"); } catch {}

  if (!Object.keys(panier).length) return vide("Your basket is empty.");

  try {
    const [p, catalogue] = await Promise.all([
      getDoc(doc(db, "parametres", "boutique")),
      getDocs(collection(db, "boutique_produits"))
    ]);
    params  = p.exists() ? p.data() : {};
    options = params.options_retrait || [];

    const vac = params.vacances || {};
    if (vac.actif) {
      return vide(vac.message || "We are closed at the moment. Online orders are paused.");
    }

    // Les prix viennent de la base, jamais du panier gardé sur l'appareil.
    catalogue.forEach(s => {
      const d = s.data();
      let q = panier[s.id];
      if (!q || d.visible === false || d.disponible === false) return;
      // Le stock a pu descendre depuis la mise au panier.
      if (d.mode_stock === "limite") {
        const reste = Math.max(0, Number(d.stock) || 0);
        if (reste <= 0) return;
        if (q > reste) q = reste;
      }
      const base = Number(d.prix_vente) || 0;
      const reste = d.mode_stock === "limite"
        ? Math.max(0, Number(d.stock) || 0) : null;
      // prix reste le montant réellement facturé : il est recalculé par
      // majPrix() une fois le code promo connu.
      const code = d.code || s.id;
      capacites[code] = Number(d.capacite_jour) || 0;
      lignes.push({ id: s.id, code, nom: d.nom, rayon: rayonDe(d),
                    qte: q, prixBase: base, prix: base, reste, montant: q * base });
    });

    // Le code saisi sur la vitrine suit le panier : on le revérifie ici,
    // il a pu être désactivé depuis.
    await chargerCharges();
    await reprendreCode();
    majPrix();

    if (!lignes.length) return vide("The items in your basket are no longer available.");
    if (!options.length) return vide("Ordering is temporarily unavailable.");

    construire();
  } catch (e) {
    console.error(e);
    $("page").innerHTML =
      '<div class="message">Something went wrong loading your order. Please refresh.</div>';
  }
})();

function vide(texte) {
  $("page").innerHTML =
    `<div class="message">${texte}<br><br><a href="./">Back to the menu</a></div>`;
}

/* ---------- Formulaire ---------- */
function construire() {
  const memo = lireMemo();
  const creneaux = params.creneaux || [];

  $("page").innerHTML = `
    <div class="bloc">
      <h2>Your order</h2>
      <div class="recap" id="recap"></div>
      <div class="promo">
        <div class="saisie" id="saisieCode">
          <input type="text" id="champCode" placeholder="Promo code"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 aria-label="Promo code">
          <button type="button" class="appliquer" id="btnCode">Apply</button>
        </div>
        <p class="etat" id="etatPromo"></p>
      </div>
    </div>

    <div class="bloc">
      <h2>Your details</h2>
      <label class="champ"><span>Full name</span>
        <input type="text" id="nom" autocomplete="name"></label>
      <label class="champ"><span>WhatsApp number</span>
        <input type="tel" id="tel" inputmode="tel" placeholder="0917 123 4567"
               autocomplete="tel"></label>
      <div id="zoneMemo"></div>

      <div class="compte-avantages" id="blocCompte" hidden>
        <button type="button" class="tete" id="btnAvantages" aria-expanded="false">
          <span>Why create an account?</span>
          <span class="chevron">&#9662;</span>
        </button>
        <div class="corps" id="corpsAvantages" hidden>
          <ul>
            <li>Follow your order and see when it's paid</li>
            <li>Find your last orders with full details</li>
            <li>Check your store credit and its history</li>
            <li>Use promo codes — they need an account</li>
            <li>Your address filled in next time</li>
            <li>Subscribe to a bread plan</li>
          </ul>
          <a class="lien-compte" href="compte.html">Sign in with Google</a>
          <p class="sous">Takes two taps. You can order without one.</p>
        </div>
      </div>
    </div>

    <div class="bloc">
      <h2>Where would you like to get it?</h2>
      <div id="listeOptions"></div>
      <div id="blocAdresse" hidden style="margin-top:14px">
        <label class="champ"><span>Unit / floor / building <span class="option">optional</span></span>
          <input type="text" id="adrUnite" autocomplete="address-line2"
                 placeholder="Unit 5B, Solstice Tower"></label>
        <label class="champ"><span>House number and street</span>
          <input type="text" id="adrRue" autocomplete="address-line1"
                 placeholder="128 Rada Street"></label>
        <label class="champ"><span>Barangay</span>
          <input type="text" id="adrBarangay" autocomplete="address-level3"
                 placeholder="San Lorenzo"></label>
        <div id="blocVille"></div>
      </div>
    </div>

    <div class="bloc">
      <h2>When?</h2>
      <div class="champ"><span class="etiq">Date</span>
        <div class="cal" id="calendrier"></div>
        <p class="choisie" id="dateChoisie"></p>
      </div>
      ${creneaux.length ? `
      <label class="champ"><span>Time</span>
        <select id="creneau">${creneaux.map(c => `<option>${c}</option>`).join("")}</select>
      </label>` : ""}
      <div class="note" id="noteDate"></div>
    </div>

    <div class="bloc" id="blocCredit" hidden>
      <h2>Store credit</h2>
      <label class="choix" id="choixCredit">
        <input type="checkbox" id="utiliserCredit">
        <span class="corps">
          <span class="t"><span id="titreCredit"></span></span>
          <span class="d" id="detailCredit"></span>
        </span>
      </label>
    </div>

    <div class="bloc">
      <h2>Payment</h2>
      <div id="listePaiements"></div>
      <div class="note" id="instrPaiement"></div>
    </div>

    <div class="bloc">
      <h2>Anything else?</h2>
      <textarea id="notes" placeholder="Allergies, a message on the cake, landmarks…"></textarea>
    </div>

    <div class="erreur" id="erreur"></div>
  `;

  // Options de retrait
  const liste = $("listeOptions");
  options.forEach((o, i) => {
    const tarif = o.tarif_variable ? "Confirmed later"
                : (o.tarif > 0 ? peso(o.tarif) : "Free");
    const jours = (o.jours || []).length
      ? (o.jours || []).map(n => JOURS_COURTS[n]).join(", ")
      : "";
    const l = document.createElement("label");
    l.className = "choix";
    l.dataset.i = i;
    l.innerHTML = `
      <input type="radio" name="option" value="${i}" ${i === 0 ? "checked" : ""}>
      <span class="corps">
        <span class="t"><span></span><span class="tarif">${tarif}</span></span>
        ${o.lieu ? '<span class="d"></span>' : ""}
        ${jours ? `<span class="j">${jours} only</span>` : ""}
      </span>`;
    l.querySelector(".t span").textContent = o.nom;
    if (o.lieu) l.querySelector(".d").textContent = o.lieu;
    l.querySelector("input").onchange = majOption;
    liste.appendChild(l);
  });

  construireVille();

  if (memo.nom) $("nom").value = memo.nom;
  if (memo.tel) $("tel").value = memo.tel;
  // L'adresse du compte prime sur celle de l'appareil : c'est la plus sûre
  // quand le client commande depuis un téléphone partagé.
  ecrireAdresse(adresseCompte || memo.adresse_detail || memo.adresse || "");
  if (memo.nom || memo.tel) {
    $("zoneMemo").innerHTML =
      '<button class="retour" id="oublier">Not you? Clear these details</button>';
    $("oublier").onclick = () => {
      localStorage.removeItem("client");
      $("nom").value = ""; $("tel").value = "";
      ecrireAdresse("");
      $("zoneMemo").innerHTML = "";
    };
  }

  construireCredit();
  construirePaiements();
  construirePromo();
  construireAvantages();

  majOption();
  $("pied").hidden = false;
}


/* ---------- Capacité de production ----------
   Un document par jour dans la collection charge, publié et corrigé par
   l'administration des commandes : { produits: { "BUT-CRO": 12 } }.
   La vitrine ne peut pas compter les commandes des autres clients, ces
   compteurs sont sa seule vue sur ce qui est déjà pris. */
async function chargerCharges() {
  try {
    const s = await getDocs(collection(db, "charge"));
    charges = {};
    s.forEach(d => charges[d.id] = d.data().produits || {});
  } catch (e) {
    // Sans charges connues, on laisse commander : mieux vaut une journée
    // un peu trop chargée qu'une boutique qui refuse tout.
    console.error(e);
    charges = {};
  }
}

/* Ce qui manque pour que le panier tienne dans une journée donnée.
   Renvoie [] si tout passe, sinon la liste des produits en cause. */
function depassements(date) {
  const pris = charges[date] || {};
  const trop = [];
  lignes.forEach(l => {
    const plafond = Number(capacites[l.code]) || 0;
    if (!plafond) return;                       // pas de limite sur ce produit
    const reste = plafond - (Number(pris[l.code]) || 0);
    if (l.qte > reste) trop.push({ nom: l.nom, reste: Math.max(0, reste) });
  });
  return trop;
}

function jourComplet(date) {
  return depassements(date).length > 0;
}

// Message nommant ce qui bloque, plutôt qu'un refus sans explication.
function messageComplet(trop) {
  if (trop.length === 1) {
    const p = trop[0];
    return p.reste > 0
      ? "Only " + p.reste + " × " + p.nom + " left for that day."
      : p.nom + " is fully booked that day.";
  }
  // Plusieurs produits : certains peuvent avoir un reste, « fully booked »
  // serait faux. On reste sur ce qui est vrai des deux.
  const noms = trop.map(x => x.nom);
  return "We don't have enough " +
         noms.slice(0, -1).join(", ") + " and " + noms[noms.length - 1] +
         " for that day.";
}

/* ---------- Pourquoi un compte ----------
   Montré seulement à qui n'est pas connecté : inutile de vanter un compte
   à quelqu'un qui en a déjà un. */
function construireAvantages() {
  const bloc = $("blocCompte");
  if (!bloc) return;
  bloc.hidden = !!uidClient;

  const tete = $("btnAvantages");
  const corps = $("corpsAvantages");
  tete.onclick = () => {
    const ouvrir = corps.hidden;
    corps.hidden = !ouvrir;
    tete.setAttribute("aria-expanded", String(ouvrir));
  };
}

/* ---------- Adresse de livraison ----------
   Saisie en champs séparés, mais enregistrée AUSSI sur une seule ligne dans
   client.adresse : l'administration des commandes, la confirmation et la page
   d'abonnement lisent ce champ tel quel et n'ont pas à changer. */
function construireVille() {
  const villes = (params.villes_livrees || []).filter(Boolean);
  const zone = $("blocVille");

  // Liste vide côté administration : on retombe sur un champ libre.
  if (!villes.length) {
    zone.innerHTML = `
      <label class="champ"><span>City</span>
        <input type="text" id="adrVille" autocomplete="address-level2"></label>`;
    return;
  }

  zone.innerHTML = `
    <label class="champ"><span>City</span>
      <select id="adrVille">
        <option value="">Choose your city…</option>
        ${villes.map(v => `<option value="${echapper(v)}">${echapper(v)}</option>`).join("")}
      </select></label>
    <div class="note">We deliver to these cities only. Ask us if yours isn't listed.</div>`;
}

function lireAdresse() {
  const v = (id) => { const e = $(id); return e ? e.value.trim() : ""; };
  return {
    unite:    v("adrUnite"),
    rue:      v("adrRue"),
    barangay: v("adrBarangay"),
    ville:    v("adrVille")
  };
}

// Une seule ligne, pour l'administration et les messages.
function adresseUneLigne(a) {
  return [a.unite, a.rue, a.barangay, a.ville].filter(Boolean).join(", ");
}

/* Remplit les champs à partir d'une adresse détaillée, ou d'une simple
   ligne écrite avant ce découpage : dans ce cas tout part dans la rue,
   au client de répartir. La ville n'est reprise que si elle figure encore
   dans la liste livrée. */
function ecrireAdresse(source) {
  const a = (source && typeof source === "object") ? source : null;
  const poser = (id, val) => { const e = $(id); if (e) e.value = val || ""; };

  poser("adrUnite",    a ? a.unite : "");
  poser("adrRue",      a ? a.rue : (typeof source === "string" ? source : ""));
  poser("adrBarangay", a ? a.barangay : "");

  const champVille = $("adrVille");
  if (!champVille) return;
  const voulue = a ? (a.ville || "") : "";
  if (champVille.tagName === "SELECT") {
    const dispo = [...champVille.options].some(o => o.value === voulue);
    champVille.value = dispo ? voulue : "";
  } else {
    champVille.value = voulue;
  }
}

/* ---------- Code promo ----------
   Le code suit le panier : celui saisi sur la vitrine est déjà chargé,
   et celui saisi ici sera retrouvé au retour sur la vitrine. */
function construirePromo() {
  $("btnCode").onclick = appliquerCode;
  $("champCode").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); appliquerCode(); }
  });
  majPromo();
}

function etatPromo(texte, type = "", html = false) {
  const e = $("etatPromo");
  if (!e) return;
  if (html) e.innerHTML = texte; else e.textContent = texte;
  e.className = "etat " + type;
}

function majPromo() {
  if (!$("saisieCode")) return;

  if (!promo) {
    $("saisieCode").hidden = false;
    if (!uidClient) {
      etatPromo('Have a code? <a href="compte.html">Sign in</a> to use it.', "", true);
    }
    return;
  }

  $("saisieCode").hidden = true;
  const e = $("etatPromo");
  const portee = libellePortee(promo);
  e.className = "etat ok";
  if (sourceRemise === "promo") {
    e.textContent = promo.id + " applied — " + libelleCode(promo);
  } else if (portee && eligible === 0) {
    e.className = "etat";
    e.textContent = promo.id + " applies to " + portee +
                    " only — nothing in your basket qualifies";
  } else {
    e.textContent = promo.id +
      " saved for later — your trade price is a better deal today";
  }

  const b = document.createElement("button");
  b.className = "retirer";
  b.type = "button";
  b.textContent = "Remove";
  b.onclick = () => {
    promo = null;
    oublierCode();
    $("champCode").value = "";
    etatPromo("");
    majPrix();
    majTotaux();
  };
  e.appendChild(b);
}

async function appliquerCode() {
  const saisie = normaliserCode($("champCode").value);
  if (!saisie) { etatPromo("Enter a code first.", "err"); return; }

  $("btnCode").disabled = true;
  etatPromo("Checking…");
  try {
    const fiche = await chargerCode(db, saisie);
    const v = verifierCode(fiche, { connecte: !!uidClient });
    if (!v.ok) {
      promo = null;
      oublierCode();
      etatPromo(v.connexion
        ? 'Please <a href="compte.html">sign in</a> to use a promo code.'
        : v.message, "err", !!v.connexion);
      majPrix();
      majTotaux();
      return;
    }
    promo = fiche;
    memoriserCode(fiche.id);
    $("champCode").value = "";
    majPrix();
    majTotaux();
  } catch (e) {
    console.error(e);
    etatPromo("We couldn't check that code. Please try again.", "err");
  } finally {
    $("btnCode").disabled = false;
  }
}

// Reprise du code mémorisé, revérifié sur le serveur.
async function reprendreCode() {
  const memorise = lireCodeMemorise();
  if (!memorise) return;
  try {
    const fiche = await chargerCode(db, memorise);
    const v = verifierCode(fiche, { connecte: !!uidClient });
    promo = v.ok ? fiche : null;
    if (!v.ok && !v.connexion) oublierCode();
  } catch (e) {
    console.error(e);
    promo = null;
  }
}

/* Prix facturés : le module tranche entre tarif de groupe et code promo,
   la vitrine et cette page appliquent donc la même règle. */
function majPrix() {
  const calcul = calculerPrix(
    lignes.map(l => ({ qte: l.qte, prixBase: l.prixBase, rayon: l.rayon })),
    remise, promo);
  sourceRemise = calcul.source;
  economie = calcul.economie;
  eligible = calcul.eligible;
  lignes.forEach(l => {
    l.prix = prixUnitaire(l.prixBase, remise, sourceRemise);
    l.montant = l.qte * l.prix;
  });
  sousTotal = calcul.sousTotal;
}

/* ---------- Panier modifiable depuis le checkout ---------- */
function modifierLigne(id, delta) {
  const l = lignes.find(x => x.id === id);
  if (!l) return;
  const nouvelle = l.qte + delta;

  if (nouvelle <= 0) {
    lignes = lignes.filter(x => x.id !== id);
    delete panier[id];
  } else {
    if (l.reste !== null && nouvelle > l.reste) return;
    l.qte = nouvelle;
    l.montant = l.qte * l.prix;
    panier[id] = l.qte;
  }

  try { localStorage.setItem("panier", JSON.stringify(panier)); } catch {}
  majPrix();

  if (!lignes.length) return vide("Your basket is empty.");
  majTotaux();
  verifierDate();   // une quantité en hausse peut dépasser la capacité du jour
}

// Reprise de la dernière commande passée sur cet appareil.
function derniereCommande() {
  try { return JSON.parse(localStorage.getItem("derniere_commande") || "null"); }
  catch { return null; }
}

function brancherDerniere() {
  const b = $("btnDerniere");
  if (!b) return;
  const d = derniereCommande();
  const utile = d && (d.lignes || []).some(x => !panier[x.id]);
  b.hidden = !utile;
  if (!utile) return;
  b.onclick = () => {
    (d.lignes || []).forEach(x => {
      if (!panier[x.id]) panier[x.id] = x.qte;
    });
    try { localStorage.setItem("panier", JSON.stringify(panier)); } catch {}
    location.reload();
  };
}

/* ---------- Crédit en boutique ----------
   Le client décide d'utiliser tout ou partie de son solde ; le reste
   se règle normalement. Le prélèvement réel a lieu à la confirmation. */
function construireCredit() {
  if (!(solde > 0)) return;
  $("blocCredit").hidden = false;
  $("utiliserCredit").onchange = () => { majTotaux(); majPaiement(); };
  majCredit();
}

function majCredit() {
  if (!(solde > 0)) { creditUtilise = 0; return; }
  const total = sousTotal + fraisOption();
  const possible = Math.min(solde, total);
  creditUtilise = $("utiliserCredit").checked ? possible : 0;

  $("titreCredit").textContent = "Use my credit — " + peso(solde) + " available";
  $("detailCredit").textContent = creditUtilise > 0
    ? (creditUtilise >= total
        ? "Your order is fully covered by your credit."
        : peso(creditUtilise) + " applied · " + peso(total - creditUtilise) + " left to pay")
    : "Apply up to " + peso(possible) + " to this order.";
  $("choixCredit").classList.toggle("actif", creditUtilise > 0);
}

function fraisOption() {
  const o = choisie();
  return o.tarif_variable ? 0 : (Number(o.tarif) || 0);
}

/* ---------- Moyens de paiement ---------- */
function construirePaiements() {
  const pay = params.paiement || {};
  const g = pay.gcash  || { nom: pay.gcash_nom, numero: pay.gcash_numero };
  const m = pay.maya   || {};
  const b = pay.banque || { nom: pay.banque_nom,
                            titulaire: pay.banque_titulaire,
                            numero: pay.banque_numero };
  const choix = [];

  if (g.numero || g.qr) choix.push({
    code: "gcash", titre: "GCash", qr: g.qr,
    detail: [g.numero, g.nom].filter(Boolean).join(" — ")
  });
  if (m.numero || m.qr) choix.push({
    code: "maya", titre: "Maya", qr: m.qr,
    detail: [m.numero, m.nom].filter(Boolean).join(" — ")
  });
  if (b.numero || b.qr) choix.push({
    code: "virement", titre: "Bank transfer", qr: b.qr,
    detail: [b.nom, b.titulaire, b.numero].filter(Boolean).join(" — ")
  });
  choix.push({
    code: "especes", titre: "Cash", qr: "",
    detail: "Pay when you collect or receive your order."
  });

  const zone = $("listePaiements");
  zone.innerHTML = "";
  choix.forEach((c, i) => {
    const l = document.createElement("label");
    l.className = "choix";
    l.dataset.paiement = c.code;
    l.innerHTML = `
      <input type="radio" name="paiement" value="${c.code}" ${i === 0 ? "checked" : ""}>
      <span class="corps"><span class="t"><span></span></span>
      <span class="d"></span>
      <span class="qr" hidden></span></span>`;
    l.querySelector(".t span").textContent = c.titre;
    l.querySelector(".d").textContent = c.detail;

    if (c.qr) {
      const boite = l.querySelector(".qr");
      const img = document.createElement("img");
      img.src = c.qr;
      img.alt = c.titre + " QR code";
      img.loading = "lazy";
      const lien = document.createElement("a");
      lien.href = c.qr;
      lien.download = "";
      lien.textContent = "Save QR code";
      lien.onclick = (e) => e.stopPropagation();
      boite.append(img, lien);
      boite.dataset.actif = "1";
    }

    l.querySelector("input").onchange = majPaiement;
    zone.appendChild(l);
  });

  majPaiement();
}

function majPaiement() {
  const total = sousTotal + fraisOption();
  const couvert = creditUtilise >= total && total > 0;
  const zone = $("listePaiements");
  if (zone) zone.style.opacity = couvert ? ".45" : "";
  const instr = $("instrPaiement");
  if (couvert && instr) { instr.textContent = "Nothing more to pay — thank you!"; return; }

  const v = document.querySelector('input[name="paiement"]:checked').value;
  document.querySelectorAll(".choix[data-paiement]").forEach(c => {
    const actif = c.dataset.paiement === v;
    c.classList.toggle("actif", actif);
    const qr = c.querySelector(".qr");
    if (qr) qr.hidden = !(actif && qr.dataset.actif);
  });

  const instructions = (params.paiement || {}).instructions || "";
  $("instrPaiement").textContent = v === "especes" ? "" : instructions;
}

/* ---------- Option choisie ---------- */
function choisie() {
  const r = document.querySelector('input[name="option"]:checked');
  return options[Number(r.value)];
}

function majOption() {
  const o = choisie();
  document.querySelectorAll(".choix[data-i]").forEach(c =>
    c.classList.toggle("actif", options[Number(c.dataset.i)] === o));

  $("blocAdresse").hidden = !o.demander_adresse;

  // Le calendrier repart du premier jour compatible avec cette option.
  const delai = Number(params.delai_min_heures) || 0;
  dateMin = new Date(Date.now() + delai * 3600000);
  dateMin.setHours(0, 0, 0, 0);

  const premier = premierJourPossible(new Date(Date.now() + delai * 3600000), o);
  dateChoisie = premier ? iso(premier) : "";
  moisVu = premier ? new Date(premier.getFullYear(), premier.getMonth(), 1)
                   : new Date(dateMin.getFullYear(), dateMin.getMonth(), 1);
  dessinerCalendrier();

  const bouts = [];
  if (delai) bouts.push("We need at least " + delai + " hours' notice.");
  if ((o.jours || []).length)
    bouts.push(o.nom + " is available on " +
      o.jours.map(n => JOURS_COURTS[n]).join(", ") + " only.");
  $("noteDate").textContent = bouts.join(" ");

  verifierDate();
  majTotaux();
}

/* ---------- Calendrier ---------- */
function dessinerCalendrier() {
  const o = choisie();
  const premierDuMois = new Date(moisVu.getFullYear(), moisVu.getMonth(), 1);
  const nbJours = new Date(moisVu.getFullYear(), moisVu.getMonth() + 1, 0).getDate();
  const decalage = indexJour(premierDuMois);   // 0 = lundi

  const moisNom = premierDuMois.toLocaleDateString("en-GB",
    { month: "long", year: "numeric" });

  // Un mois entièrement passé n'a pas à être atteignable.
  const finDuMoisPrecedent = new Date(moisVu.getFullYear(), moisVu.getMonth(), 0);
  const reculPossible = finDuMoisPrecedent >= dateMin;

  let cases = "";
  for (let i = 0; i < decalage; i++) cases += '<div class="case vide"></div>';

  for (let n = 1; n <= nbJours; n++) {
    const d = new Date(moisVu.getFullYear(), moisVu.getMonth(), n);
    const cle = iso(d);
    const ouvert = d >= dateMin && jourPossible(d, o);
    const complet = ouvert && jourComplet(cle);
    const libre = ouvert && !complet;
    const prise = cle === dateChoisie;
    cases += libre
      ? `<button type="button" class="case libre ${prise ? "prise" : ""}"
           data-jour="${cle}">${n}</button>`
      : `<div class="case ${complet ? "complet" : ""}" aria-disabled="true"
           ${complet ? 'title="Fully booked"' : ""}>${n}</div>`;
  }

  $("calendrier").innerHTML = `
    <div class="tete">
      <button type="button" class="nav" id="calPrec" ${reculPossible ? "" : "disabled"}
        aria-label="Previous month">&#8249;</button>
      <span class="mois">${moisNom}</span>
      <button type="button" class="nav" id="calSuiv" aria-label="Next month">&#8250;</button>
    </div>
    <div class="grille">
      ${JOURS_COURTS.map(j => `<div class="jour-nom">${j[0]}</div>`).join("")}
      ${cases}
    </div>`;

  $("calPrec").onclick = () => { moisVu.setMonth(moisVu.getMonth() - 1); dessinerCalendrier(); };
  $("calSuiv").onclick = () => { moisVu.setMonth(moisVu.getMonth() + 1); dessinerCalendrier(); };

  $("calendrier").querySelectorAll(".case.libre").forEach(b => {
    b.onclick = () => {
      dateChoisie = b.dataset.jour;
      dessinerCalendrier();
      verifierDate();
    };
  });

  $("dateChoisie").textContent = dateChoisie
    ? new Date(dateChoisie + "T12:00:00").toLocaleDateString("en-GB",
        { weekday: "long", day: "numeric", month: "long" })
    : "";
}

/* ---------- Dates ---------- */
function iso(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}
function indexJour(d) { return (d.getDay() + 6) % 7; }   // 0 = lundi

function jourPossible(d, o) {
  const jours = o.jours || [];
  // Une option limitée à certains jours impose ses propres jours.
  if (jours.length) return jours.includes(indexJour(d));
  return !(params.jours_fermes || []).includes(indexJour(d));
}
function premierJourPossible(depuis, o) {
  const j = new Date(depuis);
  for (let i = 0; i < 21; i++) {
    // Un jour ouvert mais déjà plein pour ce panier n'est pas proposé d'office.
    if (jourPossible(j, o) && !jourComplet(iso(j))) return j;
    j.setDate(j.getDate() + 1);
  }
  return null;
}
function verifierDate() {
  if (!dateChoisie) {
    $("erreur").textContent =
      "No date is available for this basket in the coming weeks. " +
      "Try removing an item or ordering a smaller quantity.";
    $("btnEnvoyer").disabled = true;
    return;
  }
  // La date choisie peut s'être remplie pendant que le client hésitait,
  // ou le panier avoir grossi depuis.
  const trop = depassements(dateChoisie);
  if (trop.length) {
    $("erreur").textContent = messageComplet(trop) + " Please pick another day.";
    $("btnEnvoyer").disabled = true;
    return;
  }
  $("erreur").textContent = "";
  $("btnEnvoyer").disabled = false;
}

/* ---------- Totaux ---------- */
function majTotaux() {
  const o = choisie();
  const frais = o.tarif_variable ? 0 : (Number(o.tarif) || 0);
  const total = sousTotal + frais;

  let html = lignes.map(l =>
    `<div class="l ligne-panier" data-id="${l.id}">
       <span class="compteur-mini">
         <button type="button" data-d="-1" aria-label="Remove one">−</button>
         <span class="qn">${l.qte}</span>
         <button type="button" data-d="1" aria-label="Add one"
           ${l.reste !== null && l.qte >= l.reste ? "disabled" : ""}>+</button>
       </span>
       <span class="nom-panier">${echapper(l.nom)}</span>
       <span>${peso(l.montant)}</span></div>`).join("");

  html += `<div class="ajouter-plus"><a href="./">+ Add more items</a>
           <button type="button" id="btnDerniere" hidden>Add my last order</button></div>`;

  // Avec un code promo la réduction porte sur le total : les lignes
  // gardent leur prix catalogue et l'écart s'affiche ici.
  if (sourceRemise === "promo") {
    const portee = libellePortee(promo);
    html += `<div class="l remise"><span>Promo code ${echapper(promo.id)}${
      portee ? " (" + echapper(portee) + ")" : ""}</span>
             <span>−${peso(economie)}</span></div>`;
  }

  if (o.tarif_variable)
    html += `<div class="l"><span>${echapper(o.nom)}</span><span>Confirmed later</span></div>`;
  else if (frais > 0)
    html += `<div class="l"><span>${echapper(o.nom)}</span><span>${peso(frais)}</span></div>`;

  html += `<div class="l somme"><span>Total</span><span>${peso(total)}</span></div>`;

  majCredit();
  if (creditUtilise > 0) {
    html += `<div class="l"><span>Store credit</span><span>−${peso(creditUtilise)}</span></div>`;
    html += `<div class="l somme"><span>Left to pay</span>
             <span>${peso(Math.max(0, total - creditUtilise))}</span></div>`;
  }

  $("recap").innerHTML = html;
  $("totalPied").textContent = peso(Math.max(0, total - creditUtilise));

  $("recap").querySelectorAll(".ligne-panier").forEach(el => {
    el.querySelectorAll("button[data-d]").forEach(b => {
      b.onclick = () => modifierLigne(el.dataset.id, Number(b.dataset.d));
    });
  });
  brancherDerniere();
  // Le gagnant peut changer avec les quantités : le message suit.
  majPromo();
}
function echapper(t) {
  return String(t).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- Mémoire de l'appareil ---------- */
function lireMemo() {
  try { return JSON.parse(localStorage.getItem("client") || "{}"); }
  catch { return {}; }
}

/* ---------- Envoi ---------- */
$("btnEnvoyer").onclick = async () => {
  const o   = choisie();
  const nom = $("nom").value.trim();
  const tel = $("tel").value.replace(/\D/g, "");
  const detail  = o.demander_adresse ? lireAdresse() : null;
  const adresse = detail ? adresseUneLigne(detail) : "";

  if (nom.length < 2)  return echec("Please enter your name.");
  if (tel.length < 10) return echec("Please enter a valid mobile number.");
  if (o.demander_adresse) {
    if (!detail.rue)      return echec("Please enter your house number and street.");
    if (!detail.barangay) return echec("Please enter your barangay.");
    if (!detail.ville)    return echec("Please choose your city.");
  }
  if (!dateChoisie) return echec("Please choose a date.");

  $("btnEnvoyer").disabled = true;
  $("erreur").textContent = "";

  // Dernière vérification du code au moment de valider : il a pu être
  // désactivé pendant que le client remplissait le formulaire.
  if (promo) {
    try {
      const fiche = await chargerCode(db, promo.id);
      const v = verifierCode(fiche, { connecte: !!uidClient });
      if (!v.ok) {
        promo = null;
        oublierCode();
        majPrix();
        majTotaux();
        return echec(v.message + " Your total has been updated — please check it before ordering.");
      }
      promo = fiche;
      majPrix();
      majTotaux();
    } catch (e) {
      console.error(e);
      return echec("We couldn't confirm your promo code. Please try again.");
    }
  }

  /* Dernière vérification de la capacité, sur la valeur du serveur : la
     journée a pu se remplir pendant que le client remplissait le formulaire. */
  try {
    const s = await getDoc(doc(db, "charge", dateChoisie));
    charges[dateChoisie] = s.exists() ? (s.data().produits || {}) : {};
  } catch (e) {
    console.error(e);   // on garde la valeur connue plutôt que de bloquer
  }
  const trop = depassements(dateChoisie);
  if (trop.length) {
    dessinerCalendrier();
    verifierDate();
    return echec(messageComplet(trop) + " Please pick another day.");
  }

  const frais  = o.tarif_variable ? 0 : (Number(o.tarif) || 0);
  const numero = reference();

  const commande = {
    numero,
    statut: "nouvelle",
    // adresse reste la ligne complète, lue telle quelle par l'administration
    // et la confirmation ; adresse_detail porte le découpage.
    client: { nom, telephone: tel, adresse, adresse_detail: detail },
    panier: lignes.map(l => ({ code: l.code, nom: l.nom, qte: l.qte, prix: l.prix })),
    remise,
    // Quelle remise a réellement joué : "groupe", "promo" ou "aucune".
    remise_source: sourceRemise,
    code_promo: sourceRemise === "promo"
      ? { code: promo.id, type: promo.type, valeur: Number(promo.valeur) || 0,
          rayons: Array.isArray(promo.rayons) ? promo.rayons : [],
          montant: economie }
      : null,
    compte_uid: uidClient,
    credit_utilise: creditUtilise,
    // sous_total est le montant facturé ; sous_total_brut est le tarif
    // catalogue avant toute remise.
    sous_total_brut: lignes.reduce((t, l) => t + l.qte * l.prixBase, 0),
    remise_montant: economie,
    sous_total: sousTotal,
    frais_livraison: frais,
    frais_a_confirmer: !!o.tarif_variable,
    total: sousTotal + frais,
    option: { nom: o.nom, type: o.type, lieu: o.lieu || "" },
    date_retrait: dateChoisie,
    creneau: $("creneau") ? $("creneau").value : "",
    paiement: {
      methode: document.querySelector('input[name="paiement"]:checked').value,
      statut: "en attente"
    },
    notes: $("notes").value.trim(),
    cree_le: new Date().toISOString()
  };

  try {
    await setDoc(doc(db, "commandes", numero), commande);

    /* Capacité consommée. L'administration recalcule ces compteurs depuis les
       commandes réelles à chaque ouverture : un incrément perdu ici se répare
       tout seul, il ne justifie pas de faire échouer une commande enregistrée. */
    try {
      const pas = {};
      lignes.forEach(l => { pas["produits." + l.code] = increment(l.qte); });
      await setDoc(doc(db, "charge", dateChoisie),
                   { date: dateChoisie, maj: new Date().toISOString() }, { merge: true });
      await updateDoc(doc(db, "charge", dateChoisie), pas);
    } catch (e) { console.error(e); }

    // L'adresse est gardée sur le compte pour les prochaines commandes.
    // merge : le solde, la remise et le groupe ne sont pas touchés.
    if (uidClient && detail && adresse) {
      try {
        await setDoc(doc(db, "comptes", uidClient),
                     { adresse, adresse_detail: detail }, { merge: true });
      } catch (e) { console.error(e); }   // sans effet sur la commande
    }
    try {
      localStorage.setItem("client",
        JSON.stringify({ nom, tel, adresse, adresse_detail: detail }));
      localStorage.setItem("derniere_commande", JSON.stringify({
        quand: new Date().toISOString(),
        lignes: lignes.map(l => ({ id: l.id, nom: l.nom, qte: l.qte }))
      }));
      localStorage.removeItem("panier");
      // Le code ne doit pas se rappliquer tout seul à la commande suivante.
      oublierCode();
      sessionStorage.setItem("commande", JSON.stringify(commande));
    } catch {}
    window.location.href = "confirmation.html";
  } catch (e) {
    console.error(e);
    echec("Your order could not be sent. Please check your connection and try again.");
  }
};

function echec(texte) {
  $("erreur").textContent = texte;
  $("btnEnvoyer").disabled = false;
  $("erreur").scrollIntoView({ behavior: "smooth", block: "center" });
}

function reference() {
  const d = new Date();
  const j = String(d.getDate()).padStart(2, "0");
  const m = String(d.getMonth() + 1).padStart(2, "0");
  return `${j}${m}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
}

</script>
