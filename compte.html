<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="logo.jpg">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1a1a1a;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --ok:#3d6b3d;--alerte:#8c2f22;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:18px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    background:var(--encre);color:var(--creme);
    padding:15px 18px;display:flex;align-items:center;gap:14px;
  }
  header a{color:var(--creme);text-decoration:none;font-size:25px;line-height:1}
  header h1{font-size:19px;margin:0;font-weight:600}
  main{max-width:560px;margin:0 auto;padding:22px 16px 60px}

  .bloc{
    background:var(--papier);border:1px solid var(--trait);
    border-radius:var(--r);padding:20px;margin-bottom:16px;
  }
  .bloc h2{font-size:17px;margin:0 0 12px}

  .solde{text-align:center;padding:26px 20px}
  .solde .montant{
    font-size:43px;font-weight:600;font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .solde .montant.du{color:var(--alerte)}
  .solde .etiq{font-size:14.5px;color:var(--encre-doux);letter-spacing:.08em;
    text-transform:uppercase;margin-top:6px}
  .solde .aide{font-size:16px;color:var(--encre-doux);margin-top:14px}
  .aide{font-size:15px;color:var(--encre-doux)}

  .mvt{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--trait);font-size:17px}
  .mvt:last-child{border-bottom:none}
  .mvt .quand{font-size:14.5px;color:var(--encre-doux)}
  .mvt .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .mvt .val.plus{color:var(--ok)}
  .mvt .val.moins{color:var(--alerte)}

  button.principal{
    width:100%;background:var(--encre);color:var(--creme);border:none;
    padding:14px;border-radius:var(--r);font-size:17.5px;font-weight:600;
    cursor:pointer;margin-bottom:10px;
  }
  button.secondaire{
    width:100%;background:transparent;color:var(--accent);
    border:1px solid var(--trait);padding:13px;border-radius:var(--r);
    font-size:17px;cursor:pointer;
  }
  input[type=email]{
    width:100%;padding:13px 12px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:18px;
    color:var(--encre);margin-bottom:10px;
  }
  .ou{text-align:center;font-size:14.5px;color:var(--encre-doux);margin:16px 0}
  .note{font-size:14.5px;color:var(--encre-doux);line-height:1.5;margin-top:16px}
  .message{font-size:16.5px;margin-top:12px}
  .message.ok{color:var(--ok)}
  .message.err{color:var(--alerte)}
  .lien{display:block;text-align:center;margin-top:22px;color:var(--accent);font-size:17px}
  .vide{padding:24px;text-align:center;color:var(--encre-doux);font-size:16.5px}
  .cmd{border-bottom:1px solid var(--trait)}
  .cmd:last-child{border-bottom:none}
  .cmd .tete{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    width:100%;background:none;border:none;padding:12px 0;
    font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  .cmd .tete:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cmd .quand{font-weight:600}
  .cmd .num{
    font-family:ui-monospace,monospace;font-size:13.5px;color:var(--encre-doux);
  }
  .cmd .statut{
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 9px;border-radius:11px;background:#efe6d8;color:var(--encre-doux);
  }
  .cmd .statut.vive{background:#e4efe4;color:var(--ok)}
  .cmd .statut.morte{background:#f6e2de;color:var(--alerte)}
  .cmd .paiement{
    font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 9px;border-radius:11px;
    border:1px solid var(--trait);color:var(--encre-doux);
  }
  .cmd .paiement.vive{border-color:#bcd6bc;background:#e4efe4;color:var(--ok)}
  .cmd .paiement.morte{border-color:#e8c9c2;background:#f6e2de;color:var(--alerte)}
  .cmd .ou.attente{color:var(--encre-doux);font-style:italic}
  .cmd .somme{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
  .cmd .fleche{color:var(--encre-doux);font-size:13.5px}
  .cmd .detail{padding:2px 0 14px;font-size:16.5px}
  .cmd .detail[hidden]{display:none}
  .cmd .l{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .cmd .l.total{
    border-top:1px solid var(--trait);margin-top:7px;padding-top:8px;font-weight:600;
  }
  .cmd .l .q{color:var(--encre-doux)}
  .cmd .ou{color:var(--encre-doux);font-size:15px;margin:8px 0 0;line-height:1.45}
  .abo{border-bottom:1px solid var(--trait);padding:12px 0}
  .abo:last-child{border-bottom:none}
  .abo .titre{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .abo .quoi{font-weight:600}
  .abo .rythme{font-size:15px;color:var(--encre-doux)}
  .abo .puce{
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 9px;border-radius:11px;background:#efe6d8;color:var(--encre-doux);
  }
  .abo .puce.vive{background:#e4efe4;color:var(--ok)}
  .abo .puce.morte{background:#f6e2de;color:var(--alerte)}
  .abo h3{
    font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--encre-doux);margin:14px 0 4px;font-weight:600;
  }
  .abo .ech{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:7px 0;border-bottom:1px solid var(--trait);font-size:16.5px;
  }
  .abo .ech:last-child{border-bottom:none}
  .abo .ech.faite{color:var(--encre-doux)}
  .abo .ech .quand{font-variant-numeric:tabular-nums}
  .abo .ech .rang{font-size:13.5px;color:var(--encre-doux)}
  .abo .ech .fin{margin-left:auto;display:flex;align-items:center;gap:10px}
  .abo .ech .aide{font-size:14.5px;text-align:right}
  .abo button.bouger{
    background:transparent;color:var(--accent);border:1px solid var(--trait);
    border-radius:var(--r);padding:5px 12px;font:inherit;font-size:15px;cursor:pointer;
  }
  .abo button.bouger[disabled]{opacity:.5;cursor:default}
  .abo button.replier{
    background:none;border:none;padding:0;margin-top:12px;
    color:var(--accent);font:inherit;font-size:15px;cursor:pointer;
  }
  .abo .quota{font-size:14.5px;color:var(--encre-doux);margin:10px 0 0}
  .abo .dit{font-size:15.5px;margin:10px 0 0}
  .abo .dit.ok{color:var(--ok)}
  .abo .dit.err{color:var(--alerte)}
  .qui{font-size:15px;color:var(--encre-doux);text-align:center;margin-top:14px}
  .qui button{background:none;border:none;color:var(--accent);
    text-decoration:underline;cursor:pointer;font-size:15px;padding:0}
</style>
</head>
<body>

<header>
  <a href="./" aria-label="Back to the menu">&#8249;</a>
  <h1>My account</h1>
</header>

<main id="page">
  <div class="vide">Loading…</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
         sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc,
         query, orderBy, limit, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* La règle des reports vit dans abo.js, partagée avec l'administration :
   elle n'est pas réécrite ici, sans quoi les deux faces divergeraient. */
import { aVenir, passees, rang, peutReporter, reportsRestants, MAX_REPORTS, reporter }
  from "./abo.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const $    = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH");
const ech  = (t) => String(t ?? "").replace(/[&<>"]/g, x =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));

const LIBELLES = {
  rechargement: "Top-up", depense: "Order", remboursement: "Refund", correction: "Adjustment"
};

/* ---------- Retour depuis un lien e-mail ---------- */
(async function () {
  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = "";
    try { email = localStorage.getItem("emailConnexion") || ""; } catch {}
    if (!email) email = window.prompt("Please confirm your email address") || "";
    try {
      await signInWithEmailLink(auth, email, window.location.href);
      try { localStorage.removeItem("emailConnexion"); } catch {}
      history.replaceState(null, "", location.pathname);
    } catch (e) {
      console.error(e);
    }
  }
})();

/* ---------- État de connexion ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) return ecranConnexion();
  await ecranCompte(user);
});

/* ---------- Écran de connexion ---------- */
function ecranConnexion() {
  $("page").innerHTML = `
    <div class="bloc">
      <h2>Sign in to your account</h2>
      <p style="font-size:16.5px;color:var(--encre-doux);margin:0 0 18px">
        Your account keeps your store credit and your order history.
      </p>

      <button class="principal" id="btnGoogle">Continue with Google</button>

      <div class="ou">or</div>

      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
      <button class="secondaire" id="btnLien">Get a sign-in link by email</button>

      <div class="message" id="message"></div>

      <p class="note">
        We only keep your name, your email and your orders. Nothing is shared
        with anyone, and signing in with Google gives us no access to your
        Google data beyond your name and email address.
      </p>
    </div>
    <a class="lien" href="./">Back to the menu</a>`;

  $("btnGoogle").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) {
      console.error(e);
      dire("Sign-in did not complete. Please allow pop-ups and try again.", "err");
    }
  };

  $("btnLien").onclick = async () => {
    const email = $("email").value.trim();
    if (!email || !email.includes("@")) return dire("Please enter a valid email address.", "err");
    try {
      await sendSignInLinkToEmail(auth, email, {
        url: location.origin + location.pathname,
        handleCodeInApp: true
      });
      try { localStorage.setItem("emailConnexion", email); } catch {}
      dire("Check your inbox — we sent you a sign-in link. It may take a minute.", "ok");
    } catch (e) {
      console.error(e);
      dire("The link could not be sent. Please try Google sign-in instead.", "err");
    }
  };
}

function dire(texte, type) {
  const el = $("message");
  if (!el) return;
  el.textContent = texte;
  el.className = "message " + (type || "");
}


/* ---------- Historique des commandes ----------
   Le détail est replié : la liste reste lisible, le client ouvre ce qu'il veut. */
/* Le paiement dit du point de vue du fournil : « Awaiting confirmation »
   signifie que la boulangerie n'a pas encore pointé le règlement, pas que le
   client aurait oublié de payer. La nuance évite une inquiétude inutile. */
const PAIEMENTS = {
  "paye":       { texte: "Paid",                  classe: "vive" },
  "en attente": { texte: "Awaiting confirmation", classe: "" },
  "rembourse":  { texte: "Refunded",              classe: "morte" }
};

const ETATS = {
  "nouvelle":      { texte: "Received",    classe: "" },
  "confirmee":     { texte: "Confirmed",   classe: "vive" },
  "en production": { texte: "Baking",      classe: "vive" },
  "prete":         { texte: "Ready",       classe: "vive" },
  "remise":        { texte: "Collected",   classe: "" },
  "annulee":       { texte: "Cancelled",   classe: "morte" }
};

// Le nom du jour plutôt qu'une date brute : plus parlant pour un retrait.
function joliJour(iso) {
  if (!iso) return "";
  const d = new Date(iso + (iso.length <= 10 ? "T12:00:00" : ""));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-PH",
    { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}

function ligneCommande(c) {
  const e = ETATS[c.statut] || { texte: c.statut || "", classe: "" };
  const etatPaiement = c.paiement?.statut || "en attente";
  const p = PAIEMENTS[etatPaiement] || { texte: etatPaiement, classe: "" };
  const total = Number(c.total) || 0;
  const restant = Math.max(0, total - (Number(c.credit_utilise) || 0));

  const articles = (c.panier || []).map(l =>
    `<div class="l"><span><span class="q">${Number(l.qte) || 0} × </span>${
      ech(l.nom || l.code || "")}</span>
     <span>${peso((Number(l.qte) || 0) * (Number(l.prix) || 0))}</span></div>`).join("");

  const extras = [];
  if (c.code_promo && c.code_promo.montant)
    extras.push(`<div class="l"><span>Promo code ${ech(c.code_promo.code || "")}</span>
                 <span>−${peso(c.code_promo.montant)}</span></div>`);
  if (c.frais_a_confirmer)
    extras.push(`<div class="l"><span>${ech(c.option?.nom || "Delivery")}</span>
                 <span>Confirmed later</span></div>`);
  else if (Number(c.frais_livraison) > 0)
    extras.push(`<div class="l"><span>${ech(c.option?.nom || "Delivery")}</span>
                 <span>${peso(c.frais_livraison)}</span></div>`);
  if (Number(c.credit_utilise) > 0)
    extras.push(`<div class="l"><span>Store credit</span>
                 <span>−${peso(c.credit_utilise)}</span></div>`);

  const ou = [
    c.option?.nom || "",
    c.creneau || "",
    c.client?.adresse || ""
  ].filter(Boolean).join(" · ");

  return `<div class="cmd">
    <button class="tete" type="button" aria-expanded="false">
      <span class="quand">${ech(joliJour(c.date_retrait))}</span>
      <span class="num">${ech(c.numero || c.id)}</span>
      <span class="statut ${e.classe}">${ech(e.texte)}</span>
      <span class="paiement ${p.classe}">${ech(p.texte)}</span>
      <span class="somme">${peso(total)}</span>
      <span class="fleche">▾</span>
    </button>
    <div class="detail" hidden>
      ${articles}
      ${extras.join("")}
      <div class="l total"><span>${Number(c.credit_utilise) > 0 ? "Paid" : "Total"}</span>
        <span>${peso(Number(c.credit_utilise) > 0 ? restant : total)}</span></div>
      ${ou ? `<p class="ou">${ech(ou)}</p>` : ""}
      ${etatPaiement === "en attente"
        ? '<p class="ou attente">We\'ll mark this as paid once we\'ve checked the transfer. Already paid? No action needed.</p>'
        : ""}
    </div>
  </div>`;
}

// Le détail s'ouvre au clic, une fois la page écrite.
function brancherCommandes() {
  document.querySelectorAll(".cmd").forEach(bloc => {
    const tete = bloc.querySelector(".tete");
    const detail = bloc.querySelector(".detail");
    tete.onclick = () => {
      const ouvert = detail.hidden;
      detail.hidden = !ouvert;
      tete.setAttribute("aria-expanded", String(ouvert));
      bloc.querySelector(".fleche").textContent = ouvert ? "▴" : "▾";
    };
  });
}

/* ---------- Abonnements ----------
   Le client voit ce qui vient, garde la trace de ce qui est passé, et
   décale lui-même une livraison dans la limite de ses reports. Les
   décalages dus aux absences de la boulangerie ne consomment pas ce
   quota : abo.js s'en charge, la page ne fait que présenter. */
const ETATS_ABO = {
  "nouveau": { texte: "Being set up", classe: "" },
  "actif":   { texte: "Active",       classe: "vive" },
  "arrete":  { texte: "Stopped",      classe: "morte" },
  "termine": { texte: "Completed",    classe: "" }
};

const ETATS_ECH = {
  "planifiee": "Planned",
  "livree":    "Delivered",
  "sautee":    "Skipped"
};

/* Pourquoi le bouton n'est pas disponible, dit sans jargon. Une chaîne
   vide vaut « ne rien afficher » : le cas ne concerne pas le client. */
const POURQUOI = {
  plafond_atteint: "Both changes used",
  trop_tard:       "Too close — message us",
  deja_traitee:    "",
  abonnement_inactif: "",
  echeance_introuvable: "",
  date_invalide:   ""
};

function cadenceTexte(a) {
  return a.cadence === "quinzaine" ? "Every two weeks" : "Every week";
}

function ligneEcheance(a, ec, modifiable) {
  const droit = modifiable
    ? peutReporter(a, ec.date)
    : { ok: false, raison: "abonnement_inactif" };
  const r = rang(a, ec.date);
  const note = droit.ok ? "" : (POURQUOI[droit.raison] || "");

  return `<div class="ech">
    <span class="quand">${ech(joliJour(ec.date))}</span>
    ${r ? `<span class="rang">${r.position} of ${r.total}</span>` : ""}
    ${ec.decalee ? '<span class="rang">· moved</span>' : ""}
    <span class="fin">
      ${droit.ok
        ? `<button class="bouger" data-abo="${ech(a.id)}" data-date="${ech(ec.date)}"
             >Move this one</button>`
        : (note ? `<span class="aide">${ech(note)}</span>` : "")}
    </span>
  </div>`;
}

function lignePassee(a, ec) {
  const r = rang(a, ec.date);
  return `<div class="ech faite">
    <span class="quand">${ech(joliJour(ec.date))}</span>
    ${r ? `<span class="rang">${r.position} of ${r.total}</span>` : ""}
    <span class="fin"><span class="aide">${ech(ETATS_ECH[ec.statut] || ec.statut || "")}</span></span>
  </div>`;
}

/* Le contenu seul, sans son enveloppe : après un report on redessine ce
   bloc-là et pas la page entière, pour ne pas replier les commandes que
   le client venait d'ouvrir. */
function contenuAbonnement(a) {
  const e = ETATS_ABO[a.statut] || { texte: a.statut || "", classe: "" };
  const articles = (a.panier || [])
    .map(l => `${Number(l.qte) || 0} × ${l.nom || l.code || ""}`)
    .join(", ");

  const suite = aVenir(a);
  const vues  = passees(a);
  const modifiable = a.statut === "actif";
  const restants = reportsRestants(a);

  const listeSuite = suite.length
    ? suite.map(ec => ligneEcheance(a, ec, modifiable)).join("")
    : '<div class="aide" style="padding:7px 0">Nothing planned right now.</div>';

  const listeVues = vues.length
    ? `<button class="replier" type="button" aria-expanded="false">
         Past deliveries (${vues.length}) &#9662;</button>
       <div class="vues" hidden>${vues.map(ec => lignePassee(a, ec)).join("")}</div>`
    : "";

  return `
    <div class="titre">
      <span class="quoi">${ech(articles || "Your bread plan")}</span>
      <span class="puce ${e.classe}">${ech(e.texte)}</span>
    </div>
    <div class="rythme">${ech(cadenceTexte(a))}</div>

    <h3>Coming next</h3>
    ${listeSuite}
    ${modifiable
      ? `<p class="quota">${restants > 0
          ? `You can move ${restants} more ${restants === 1 ? "delivery" : "deliveries"} yourself (${MAX_REPORTS} per plan). A moved delivery is added back at the end.`
          : "You've used both of your changes — message us if you need another."}</p>`
      : ""}

    ${listeVues}
    <div class="dit" data-dit></div>`;
}

function blocAbonnement(a) {
  return `<div class="abo" id="abo-${ech(a.id)}">${contenuAbonnement(a)}</div>`;
}

/* Les abonnements chargés, gardés en mémoire pour redessiner un bloc
   sans relire toute la page. */
let abonnements = [];

function brancherAbonnements() {
  document.querySelectorAll(".abo .replier").forEach(b => {
    b.onclick = () => {
      const liste = b.parentElement.querySelector(".vues");
      const ouvert = liste.hidden;
      liste.hidden = !ouvert;
      b.setAttribute("aria-expanded", String(ouvert));
      b.innerHTML = b.innerHTML.replace(ouvert ? "&#9662;" : "&#9652;",
                                        ouvert ? "&#9652;" : "&#9662;")
                   .replace(ouvert ? "▾" : "▴", ouvert ? "▴" : "▾");
    };
  });

  document.querySelectorAll(".abo button.bouger").forEach(b => {
    b.onclick = () => demanderReport(b.dataset.abo, b.dataset.date, b);
  });
}

function redessinerAbonnement(a, message, type) {
  const bloc = $("abo-" + a.id);
  if (!bloc) return;
  bloc.innerHTML = contenuAbonnement(a);
  brancherAbonnements();
  if (message) {
    const dit = bloc.querySelector("[data-dit]");
    if (dit) {
      dit.textContent = message;
      dit.className = "dit " + (type || "");
    }
  }
}

async function demanderReport(id, date, bouton) {
  const a = abonnements.find(x => x.id === id);
  if (!a) return;

  const restants = reportsRestants(a);
  if (!confirm(
    `Move the delivery of ${joliJour(date)}?\n\n` +
    "It will be added back at the end of your plan.\n" +
    `This uses ${restants === 1 ? "your last change" : "one of your " + restants + " remaining changes"}.`
  )) return;

  bouton.disabled = true;
  bouton.textContent = "Moving…";

  const r = await reporter(db, id, date, { origine: "client" });

  if (!r.ok) {
    // L'abonnement a pu changer côté fournil pendant que la page était
    // ouverte : on repart de la version que le serveur vient de rendre.
    if (r.abo) {
      Object.assign(a, r.abo);
      redessinerAbonnement(a,
        POURQUOI[r.raison] || "That change could not be made. Please message us.", "err");
    } else {
      bouton.disabled = false;
      bouton.textContent = "Move this one";
    }
    return;
  }

  Object.assign(a, r.abo);
  redessinerAbonnement(a,
    r.jusquA ? "Moved — it now comes on " + joliJour(r.jusquA) + "."
             : "That delivery has been skipped.", "ok");
}

/* ---------- Écran du compte ---------- */
async function ecranCompte(user) {
  $("page").innerHTML = '<div class="vide">Loading your account…</div>';

  const ref = doc(db, "comptes", user.uid);
  let fiche = null;

  try {
    const s = await getDoc(ref);
    if (s.exists()) {
      fiche = s.data();
    } else {
      // Première connexion : on crée la fiche, sans solde — seul le
      // boulanger peut créditer un compte.
      const nouvelle = {
        nom: user.displayName || "",
        email: user.email || "",
        cree_le: new Date().toISOString()
      };
      await setDoc(ref, nouvelle);
      fiche = nouvelle;
    }
  } catch (e) {
    console.error(e);
    $("page").innerHTML =
      '<div class="bloc"><p>Your account could not be loaded. Please try again later.</p></div>';
    return;
  }

  const solde = Number(fiche.solde) || 0;

  let mouvements = [];
  try {
    const q = query(collection(db, "comptes", user.uid, "mouvements"),
                    orderBy("quand", "desc"), limit(20));
    const s = await getDocs(q);
    s.forEach(d => mouvements.push(d.data()));
  } catch (e) { console.error(e); }

  /* Commandes du client, lues sur le serveur : le stockage local ne garde
     que la dernière, et rien ne suit d'un appareil à l'autre.
     Le tri se fait ici plutôt que dans la requête : un orderBy combiné à un
     where imposerait un index composite dans Firestore. */
  let commandes = [];
  let commandesLues = true;
  const DERNIERES = 3;
  try {
    const q = query(collection(db, "commandes"),
                    where("compte_uid", "==", user.uid), limit(50));
    const s = await getDocs(q);
    s.forEach(d => commandes.push({ id: d.id, ...d.data() }));
    commandes.sort((a, b) => String(b.cree_le || "").localeCompare(String(a.cree_le || "")));
    // Limiter dans la requête donnerait trois commandes au hasard : sans
    // orderBy, Firestore coupe selon l'identifiant, qui n'a rien de
    // chronologique. On trie d'abord, on coupe ensuite.
    commandes = commandes.slice(0, DERNIERES);
  } catch (e) {
    console.error(e);
    commandesLues = false;   // règles Firestore, le plus souvent
  }

  /* Abonnements du client. Même parti pris que pour les commandes : un
     where seul, puis tri en mémoire, pour ne pas imposer d'index
     composite à Firestore. Le volume par client est de toute façon
     minuscule. */
  let abonnementsLus = true;
  try {
    const q = query(collection(db, "abonnements"),
                    where("client.uid", "==", user.uid), limit(20));
    const s = await getDocs(q);
    abonnements = [];
    s.forEach(d => abonnements.push({ id: d.id, ...d.data() }));
    // Les plans en cours d'abord, les terminés ensuite, puis du plus
    // récent au plus ancien.
    const ordre = { actif: 0, nouveau: 1, termine: 2, arrete: 3 };
    abonnements.sort((a, b) =>
      (ordre[a.statut] ?? 9) - (ordre[b.statut] ?? 9) ||
      String(b.cree_le || "").localeCompare(String(a.cree_le || "")));
  } catch (e) {
    console.error(e);
    abonnements = [];
    abonnementsLus = false;
  }

  const histo = mouvements.length
    ? mouvements.map(m => {
        const plus = m.montant >= 0;
        return `<div class="mvt">
          <span>${ech(LIBELLES[m.type] || m.type)}
            <span class="quand">${ech((m.quand || "").slice(0, 10))}</span></span>
          <span class="val ${plus ? "plus" : "moins"}">${plus ? "+" : ""}${peso(m.montant)}</span>
        </div>`;
      }).join("")
    : '<div class="vide">No activity yet.</div>';

  /* Un client sans abonnement ne voit pas de bloc vide : la place est
     rendue au reste de la page. */
  const listeAbonnements = !abonnementsLus
    ? `<div class="bloc"><h2>Your bread plan</h2>
         <div class="vide">Your plan could not be loaded right now.</div></div>`
    : (abonnements.length
        ? `<div class="bloc">
             <h2>${abonnements.length > 1 ? "Your bread plans" : "Your bread plan"}</h2>
             ${abonnements.map(blocAbonnement).join("")}
           </div>`
        : "");

  const listeCommandes = !commandesLues
    ? '<div class="vide">Your orders could not be loaded right now.</div>'
    : (commandes.length
        ? commandes.map(ligneCommande).join("")
        : '<div class="vide">No orders yet.</div>');

  $("page").innerHTML = `
    <div class="bloc solde">
      <div class="montant${solde < 0 ? " du" : ""}">${peso(solde)}</div>
      <div class="etiq">${solde < 0 ? "Amount due" : "Store credit"}</div>
      <p class="aide">${
        solde < 0
          ? "This is what's owed on your account. Settle it whenever suits you — send us your proof of payment and we'll update it right away."
          : (solde > 0
              ? "You can use this at checkout."
              : "Ask us about topping up your account — pay once, order as you go.")}</p>
    </div>

    ${listeAbonnements}

    <div class="bloc">
      <h2>Your last orders</h2>
      ${listeCommandes}
      ${commandes.length >= DERNIERES
        ? '<p class="aide" style="margin:12px 0 0">Older orders aren\'t shown here — message us if you need one.</p>'
        : ""}
    </div>

    <div class="bloc">
      <h2>Store credit activity</h2>
      ${histo}
    </div>

    <a class="lien" href="./">Back to the menu</a>
    <p class="qui">Signed in as ${ech(user.email || user.displayName || "")} —
      <button id="btnSortir">sign out</button></p>`;

  brancherCommandes();
  brancherAbonnements();
  $("btnSortir").onclick = () => signOut(auth);
}
</script>
